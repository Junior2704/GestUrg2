<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="icon" type="image/jpeg" href="logog2.png">
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mes documents - GestUrg2</title>


<!-- ======================================================
     HTML2PDF
====================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- ======================================================
     CONVERSION ORD → PDF
====================================================== -->

<script src="../ordToPdf.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        #f4f7fa;

    color:
        #222;

}


/* ======================================================
   HEADER
====================================================== */

header {

    background:
        #0078d4;

    color:
        white;

    padding:
        18px 25px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

}


header h1 {

    margin:
        0;

    font-size:
        22px;

}


.logout {

    border:
        none;

    background:
        rgba(255,255,255,.15);

    color:
        white;

    padding:
        10px 15px;

    border-radius:
        8px;

    cursor:
        pointer;

    font-size:
        14px;

}


.logout:hover {

    background:
        rgba(255,255,255,.25);

}


/* ======================================================
   CONTENEUR
====================================================== */

.container {

    max-width:
        900px;

    margin:
        30px auto;

    padding:
        0 20px;

}


/* ======================================================
   PATIENT
====================================================== */

.patient-card {

    background:
        white;

    padding:
        25px;

    border-radius:
        15px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.07);

    margin-bottom:
        25px;

}


.patient-card h2 {

    margin-top:
        0;

    color:
        #0078d4;

}


/* ======================================================
   DOCUMENTS
====================================================== */

.documents {

    display:
        grid;

    gap:
        15px;

}


.document {

    background:
        white;

    border-radius:
        12px;

    padding:
        18px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.06);

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        15px;

}


.document-info {

    flex:
        1;

}


.document-title {

    font-weight:
        600;

    margin-bottom:
        5px;

}


.document-type {

    color:
        #777;

    font-size:
        14px;

}


.document-date {

    color:
        #999;

    font-size:
        13px;

    margin-top:
        5px;

}


.document button {

    border:
        none;

    background:
        #0078d4;

    color:
        white;

    padding:
        10px 15px;

    border-radius:
        8px;

    cursor:
        pointer;

    white-space:
        nowrap;

}


.document button:hover {

    background:
        #006abc;

}


.document button:disabled {

    opacity:
        .6;

    cursor:
        wait;

}


/* ======================================================
   MESSAGES
====================================================== */

.message {

    text-align:
        center;

    padding:
        40px;

    color:
        #777;

}


.error {

    color:
        #c62828;

}


/* ======================================================
   LOADER DOCUMENT
====================================================== */

.loader {

    display:
        inline-block;

    width:
        16px;

    height:
        16px;

    border:
        2px solid
        rgba(255,255,255,.4);

    border-top-color:
        white;

    border-radius:
        50%;

    animation:
        rotation .7s linear infinite;

    vertical-align:
        middle;

    margin-right:
        7px;

}


@keyframes rotation {

    to {
        transform:
            rotate(360deg);
    }

}


/* ======================================================
   MOBILE
====================================================== */

@media (max-width: 600px) {

    header {

        padding:
            15px;

    }

    header h1 {

        font-size:
            18px;

    }

    .container {

        margin-top:
            20px;

        padding:
            0 12px;

    }

    .document {

        flex-direction:
            column;

        align-items:
            stretch;

    }

    .document button {

        width:
            100%;

    }

}

</style>

</head>


<body>


<header>

    <h1>
        GestUrg2 — Espace patient
    </h1>

    <button
        class="logout"
        id="btnLogout"
    >
        Se déconnecter
    </button>

</header>


<div class="container">


    <!-- ==================================================
         PATIENT
    ================================================== -->

    <div
        class="patient-card"
        id="patientCard"
    >

        Chargement...

    </div>


    <h2>
        Mes documents
    </h2>


    <!-- ==================================================
         DOCUMENTS
    ================================================== -->

    <div
        id="documents"
        class="documents"
    >

        <div class="message">
            Chargement des documents...
        </div>

    </div>

</div>


<script>

const SERVER =
    "https://gesturg2-server.onrender.com";


let session = null;


// ======================================================
// CHARGER LA SESSION
// ======================================================

async function chargerSession() {

    try {

        const response =
            await fetch(
                `${SERVER}/api/patient-access/session`,
                {
                    method:
                        "GET",

                    credentials:
                        "include"
                }
            );


        const resultat =
            await response.json();


        if (
            response.status === 401 ||
            !resultat.success
        ) {

            window.location.href =
                "patient-login.html";

            return false;

        }


        session =
            resultat;


        console.log(
            "Session patient :",
            session
        );


        afficherPatient();


        return true;


    } catch (error) {

        console.error(
            "Erreur session :",
            error
        );


        document.getElementById(
            "patientCard"
        ).innerHTML = `

            <div class="error">

                Impossible de contacter le serveur.

            </div>

        `;


        return false;

    }

}


// ======================================================
// AFFICHER PATIENT
// ======================================================

function afficherPatient() {

    const patient =
        session.patient;


    document.getElementById(
        "patientCard"
    ).innerHTML = `

        <h2>

            Bonjour
            ${escapeHtml(patient.prenom)}
            ${escapeHtml(patient.nom)}

        </h2>

        <p>

            Vous êtes connecté à votre
            espace patient.

        </p>

    `;

}


// ======================================================
// CHARGER LES DOCUMENTS
// ======================================================

async function chargerDocuments() {

    const container =
        document.getElementById(
            "documents"
        );


    try {

        const response =
            await fetch(
                `${SERVER}/api/patient-access/documents`,
                {
                    method:
                        "GET",

                    credentials:
                        "include"
                }
            );


        const resultat =
            await response.json();


        // --------------------------------------------------
        // SESSION EXPIRÉE
        // --------------------------------------------------

        if (
            response.status === 401
        ) {

            window.location.href =
                "patient-login.html";

            return;

        }


        // --------------------------------------------------
        // ERREUR
        // --------------------------------------------------

        if (!resultat.success) {

            container.innerHTML = `

                <div class="message error">

                    ${escapeHtml(
                        resultat.error ||
                        "Impossible de charger les documents."
                    )}

                </div>

            `;

            return;

        }


        // --------------------------------------------------
        // AUCUN DOCUMENT
        // --------------------------------------------------

        if (
            !resultat.documents ||
            resultat.documents.length === 0
        ) {

            container.innerHTML = `

                <div class="message">

                    Aucun document disponible.

                </div>

            `;

            return;

        }


        container.innerHTML =
            "";


        // --------------------------------------------------
        // AFFICHER LES DOCUMENTS
        // --------------------------------------------------

        resultat.documents.forEach(
            documentMedical => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "document";


                element.innerHTML = `

                    <div class="document-info">

                        <div class="document-title">

                            ${escapeHtml(
                                documentMedical.titre ||
                                "Document"
                            )}

                        </div>

                        <div class="document-type">

                            ${escapeHtml(
                                documentMedical.type ||
                                "Document médical"
                            )}

                        </div>

                        ${
                            documentMedical.dateCreation
                                ? `
                                    <div class="document-date">

                                        ${escapeHtml(
                                            documentMedical.dateCreation
                                        )}

                                    </div>
                                  `
                                : ""
                        }

                    </div>


                    <button
                        type="button"
                        class="btn-open-document"
                    >

                        Ouvrir

                    </button>

                `;


                const bouton =
                    element.querySelector(
                        ".btn-open-document"
                    );


                bouton.addEventListener(
                    "click",
                    () => {

                        ouvrirDocument(
                            documentMedical.id,
                            bouton
                        );

                    }
                );


                container.appendChild(
                    element
                );

            }
        );


    } catch (error) {

        console.error(
            "Erreur documents :",
            error
        );


        container.innerHTML = `

            <div class="message error">

                Impossible de charger les documents.

            </div>

        `;

    }

}


// ======================================================
// OUVRIR UN DOCUMENT
// ======================================================

async function ouvrirDocument(
    documentId,
    bouton
) {

    if (!documentId) {

        return;

    }


    try {

        // --------------------------------------------------
        // BOUTON
        // --------------------------------------------------

        if (bouton) {

            bouton.disabled =
                true;

            bouton.innerHTML = `

                <span class="loader"></span>
                Ouverture...

            `;

        }


        // --------------------------------------------------
        // RÉCUPÉRER LE DOCUMENT
        // --------------------------------------------------

        const response =
            await fetch(
                `${SERVER}/api/patient-access/documents/${encodeURIComponent(documentId)}`,
                {
                    method:
                        "GET",

                    credentials:
                        "include"
                }
            );


        const resultat =
            await response.json();


        // --------------------------------------------------
        // SESSION EXPIRÉE
        // --------------------------------------------------

        if (
            response.status === 401
        ) {

            window.location.href =
                "patient-login.html";

            return;

        }


        // --------------------------------------------------
        // ACCÈS REFUSÉ
        // --------------------------------------------------

        if (
            response.status === 403
        ) {

            alert(
                "Vous n'avez pas accès à ce document."
            );

            return;

        }


        // --------------------------------------------------
        // AUTRE ERREUR
        // --------------------------------------------------

        if (!resultat.success) {

            alert(
                resultat.error ||
                "Impossible d'ouvrir le document."
            );

            return;

        }


        const documentMedical =
            resultat.document;


        // --------------------------------------------------
        // VÉRIFIER LE FORMAT ORD
        // --------------------------------------------------

        if (
            !documentMedical.ord ||
            typeof documentMedical.ord !== "object"
        ) {

            console.error(
                "Format ORD absent :",
                documentMedical
            );


            alert(
                "Ce document ne peut pas être affiché."
            );

            return;

        }


        console.log(
            "ORD récupéré :",
            documentMedical.ord
        );


        // --------------------------------------------------
        // VÉRIFIER ordToPDF
        // --------------------------------------------------

        if (
            typeof window.ordToPDF !==
            "function"
        ) {

            console.error(
                "ordToPDF indisponible"
            );


            alert(
                "Le système PDF n'est pas disponible."
            );

            return;

        }


        // --------------------------------------------------
        // GÉNÉRER LE PDF
        // --------------------------------------------------

        const pdfBlob =
            await window.ordToPDF(
                documentMedical.ord
            );


        // --------------------------------------------------
        // VÉRIFIER LE PDF
        // --------------------------------------------------

        if (!pdfBlob) {

            throw new Error(
                "Le PDF n'a pas été généré."
            );

        }


        // --------------------------------------------------
        // CRÉER URL TEMPORAIRE
        // --------------------------------------------------

        const pdfUrl =
            URL.createObjectURL(
                pdfBlob
            );


        // --------------------------------------------------
        // OUVRIR LE PDF
        // --------------------------------------------------

        const nouvelleFenetre =
            window.open(
                pdfUrl,
                "_blank"
            );


        if (!nouvelleFenetre) {

            alert(
                "Votre navigateur bloque l'ouverture du PDF. Autorisez les fenêtres pop-up pour GestUrg2."
            );

            URL.revokeObjectURL(
                pdfUrl
            );

            return;

        }


        // On laisse le navigateur utiliser
        // temporairement l'URL du PDF.


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    pdfUrl
                );

            },
            60000
        );


    } catch (error) {

        console.error(
            "Erreur ouverture document :",
            error
        );


        alert(
            "Impossible de générer le document PDF."
        );


    } finally {

        if (bouton) {

            bouton.disabled =
                false;

            bouton.textContent =
                "Ouvrir";

        }

    }

}


// ======================================================
// DÉCONNEXION
// ======================================================

document
    .getElementById("btnLogout")
    .addEventListener(
        "click",
        async () => {

            const bouton =
                document.getElementById(
                    "btnLogout"
                );


            bouton.disabled =
                true;


            bouton.textContent =
                "Déconnexion...";


            try {

                await fetch(
                    `${SERVER}/api/patient-access/logout`,
                    {
                        method:
                            "POST",

                        credentials:
                            "include"
                    }
                );


            } catch (error) {

                console.error(
                    "Erreur déconnexion :",
                    error
                );

            }


            window.location.href =
                "patient-login.html";

        }
    );


// ======================================================
// PROTECTION XSS
// ======================================================

function escapeHtml(value) {

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


// ======================================================
// DÉMARRAGE
// ======================================================

(async () => {

    const connecte =
        await chargerSession();


    if (!connecte) {

        return;

    }


    await chargerDocuments();

})();

</script>

</body>

</html>
