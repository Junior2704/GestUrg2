<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Document — GestUrg2</title>


<!-- =====================================================
     PDF.JS
     Pas de lecteur PDF Google/Chromium :
     les pages sont rendues nous-mêmes dans des canvas.
===================================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    type="module">
</script>


<!-- =====================================================
     HTML2PDF
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="ordToPdf.js"></script>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background: #eef2f6;

}


/* =========================================================
   BARRE PRINCIPALE
========================================================= */

#toolbar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 60px;

    background: #ffffff;

    border-bottom: 1px solid #dce3ea;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 0 14px;

    z-index: 1000;

    box-shadow:
        0 2px 10px rgba(0,0,0,.07);

}


/* =========================================================
   LOGO
========================================================= */

#logo {

    width: 38px;

    height: 38px;

    object-fit: contain;

    flex-shrink: 0;

}


/* =========================================================
   INFORMATIONS DOCUMENT
========================================================= */

#documentInfo {

    flex: 1;

    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    margin-left: 4px;

}


#documentTitle {

    color: #1565c0;

    font-size: 15px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


#documentStatus {

    color: #78909c;

    font-size: 11px;

    margin-top: 2px;

}


/* =========================================================
   BOUTONS
========================================================= */

.toolbarButton {

    height: 36px;

    min-width: 36px;

    padding: 0 10px;

    border-radius: 7px;

    border: 1px solid #d2dce4;

    background: #ffffff;

    color: #455a64;

    font-size: 14px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 6px;

    transition:
        background .15s,
        border-color .15s,
        color .15s,
        transform .08s;

}


.toolbarButton:hover {

    background: #f3f7fa;

    border-color: #b8c7d2;

}


.toolbarButton:active {

    transform: scale(.96);

}


/* =========================================================
   BOUTON IMPRESSION
========================================================= */

#printButton {

    background: #1976d2;

    border-color: #1976d2;

    color: white;

    font-weight: 600;

    padding-left: 14px;

    padding-right: 14px;

}


#printButton:hover {

    background: #1565c0;

    border-color: #1565c0;

}


#printButton.hidden {

    display: none;

}


/* =========================================================
   SÉPARATEUR
========================================================= */

.separator {

    width: 1px;

    height: 28px;

    background: #dce3ea;

    margin: 0 3px;

}


/* =========================================================
   ZONE DE DOCUMENT
========================================================= */

#viewer {

    position: fixed;

    top: 60px;

    left: 0;

    right: 0;

    bottom: 0;

    overflow: auto;

    background:
        radial-gradient(
            circle at center,
            #f9fbfd 0%,
            #e7edf2 100%
        );

    padding: 28px 20px 60px;

}


/* =========================================================
   CONTENEUR DES PAGES
========================================================= */

#pages {

    width: fit-content;

    min-width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 24px;

}


/* =========================================================
   PAGE PDF
========================================================= */

.pdfPage {

    position: relative;

    background: #ffffff;

    box-shadow:
        0 4px 18px rgba(0,0,0,.16);

    overflow: hidden;

}


.pdfPage canvas {

    display: block;

}


/* =========================================================
   NUMÉRO DE PAGE
========================================================= */

.pageNumber {

    position: absolute;

    left: 50%;

    bottom: -24px;

    transform: translateX(-50%);

    color: #78909c;

    font-size: 11px;

    white-space: nowrap;

}


/* =========================================================
   LOADER
========================================================= */

#loader {

    position: fixed;

    inset: 60px 0 0 0;

    background: rgba(238,242,246,.96);

    z-index: 900;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transition: opacity .2s;

}


#loader.hidden {

    opacity: 0;

    pointer-events: none;

}


.loaderRing {

    width: 46px;

    height: 46px;

    border-radius: 50%;

    border: 4px solid #d7e6f3;

    border-top-color: #1976d2;

    animation:
        spin .8s linear infinite;

}


@keyframes spin {

    to {

        transform: rotate(360deg);

    }

}


#loaderText {

    margin-top: 14px;

    color: #607d8b;

    font-size: 13px;

}


/* =========================================================
   ÉCRAN ERREUR
========================================================= */

#errorScreen {

    position: fixed;

    inset: 60px 0 0 0;

    display: none;

    z-index: 800;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;

    background: #eef2f6;

}


#errorScreen.visible {

    display: flex;

}


#errorIcon {

    font-size: 42px;

    margin-bottom: 10px;

}


#errorTitle {

    color: #263238;

    font-size: 18px;

    font-weight: 700;

}


#errorMessage {

    margin-top: 6px;

    color: #78909c;

    font-size: 13px;

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

    width: 11px;

    height: 11px;

}


::-webkit-scrollbar-track {

    background: #edf2f6;

}


::-webkit-scrollbar-thumb {

    background:
        linear-gradient(
            180deg,
            #42a5f5,
            #1565c0
        );

    border-radius: 10px;

    border: 2px solid #edf2f6;

}


::-webkit-scrollbar-thumb:hover {

    background:
        linear-gradient(
            180deg,
            #64b5f6,
            #1976d2
        );

}


/* =========================================================
   PETITES FENÊTRES
========================================================= */

@media (max-width: 700px) {

    #documentStatus {

        display: none;

    }

    #documentTitle {

        max-width: 180px;

    }

    .printText {

        display: none;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     BARRE
===================================================== -->

<header id="toolbar">


    <img
        id="logo"
        src="logog2.png"
        alt="GestUrg2"
    >


    <div id="documentInfo">

        <div id="documentTitle">
            Document PDF
        </div>

        <div id="documentStatus">
            Chargement...
        </div>

    </div>


    <div class="separator"></div>


    <!-- Zoom -->

    <button
        class="toolbarButton"
        id="zoomOut"
        title="Zoom arrière"
    >
        −
    </button>


    <button
        class="toolbarButton"
        id="zoomValue"
        title="Réinitialiser le zoom"
    >
        100 %
    </button>


    <button
        class="toolbarButton"
        id="zoomIn"
        title="Zoom avant"
    >
        +
    </button>


    <div class="separator"></div>


    <!-- Rotation -->

    <button
        class="toolbarButton"
        id="rotateButton"
        title="Tourner le document"
    >
        ↻
    </button>


    <!-- Téléchargement -->

    <button
        class="toolbarButton"
        id="downloadButton"
        title="Télécharger"
    >
        ↓
    </button>


    <!-- Plein écran -->

    <button
        class="toolbarButton"
        id="fullscreenButton"
        title="Plein écran"
    >
        ⛶
    </button>


    <!-- Impression uniquement Electron -->

    <button
        class="toolbarButton"
        id="printButton"
        title="Imprimer"
    >
        🖨️
        <span class="printText">
            Imprimer
        </span>
    </button>


</header>


<!-- =====================================================
     VIEWER
===================================================== -->

<main id="viewer">

    <div id="pages"></div>

</main>


<!-- =====================================================
     LOADER
===================================================== -->

<div id="loader">

    <div class="loaderRing"></div>

    <div id="loaderText">
        Chargement du document...
    </div>

</div>


<!-- =====================================================
     ERREUR
===================================================== -->

<div id="errorScreen">

    <div id="errorIcon">
        ⚠️
    </div>

    <div id="errorTitle">
        Impossible de charger le document
    </div>

    <div id="errorMessage"></div>

</div>


<script type="module">

/* =========================================================
   PDF.JS
========================================================= */

import {
    getDocument,
    GlobalWorkerOptions
} from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",

    authDomain:
        "urgences-a8ed4.firebaseapp.com",

    projectId:
        "urgences-a8ed4",

    storageBucket:
        "urgences-a8ed4.appspot.com",

    messagingSenderId:
        "392921498200",

    appId:
        "1:392921498200:web:7ccce767332c67c697c02d",

    measurementId:
        "G-C74MK2KYDL"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


/* =========================================================
   VARIABLES
========================================================= */

let pdfDocument = null;

let pdfBlob = null;

let pdfUrl = null;

let nomDocument =
    "Document.pdf";

let zoom =
    1.25;

let rotation =
    0;


/* =========================================================
   DETECTION ELECTRON
========================================================= */

const estElectron =
    !!(
        window.electronPrint &&
        typeof window.electronPrint.ouvrirPDF ===
            "function"
    );


/*
 * Très important :
 *
 * En version web :
 *
 *     estElectron = false
 *
 * donc aucune impression Electron
 * n'est proposée.
 */

const printButton =
    document.getElementById(
        "printButton"
    );


if (!estElectron) {

    printButton.classList.add(
        "hidden"
    );

}


/* =========================================================
   ELEMENTS
========================================================= */

const pagesContainer =
    document.getElementById(
        "pages"
    );

const viewer =
    document.getElementById(
        "viewer"
    );

const loader =
    document.getElementById(
        "loader"
    );

const loaderText =
    document.getElementById(
        "loaderText"
    );

const errorScreen =
    document.getElementById(
        "errorScreen"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const documentTitle =
    document.getElementById(
        "documentTitle"
    );

const documentStatus =
    document.getElementById(
        "documentStatus"
    );

const zoomValue =
    document.getElementById(
        "zoomValue"
    );


/* =========================================================
   TITRE
========================================================= */

function definirTitre(
    nom
) {

    nomDocument =
        nom ||
        "Document.pdf";


    document.title =
        `${nomDocument} — GestUrg2`;


    documentTitle.textContent =
        nomDocument;

}


/* =========================================================
   LOADER
========================================================= */

function afficherLoader(
    texte
) {

    loaderText.textContent =
        texte ||
        "Chargement du document...";


    loader.classList.remove(
        "hidden"
    );

}


function masquerLoader() {

    loader.classList.add(
        "hidden"
    );

}


/* =========================================================
   ERREUR
========================================================= */

function afficherErreur(
    message
) {

    masquerLoader();

    errorMessage.textContent =
        message;

    errorScreen.classList.add(
        "visible"
    );

    documentStatus.textContent =
        "Erreur";


}


/* =========================================================
   MISE À JOUR ZOOM
========================================================= */

function mettreAJourZoom() {

    zoomValue.textContent =
        `${Math.round(zoom * 100)} %`;

}


/* =========================================================
   RENDU DU PDF
========================================================= */

async function rendrePDF() {

    if (!pdfDocument) {

        return;

    }


    pagesContainer.innerHTML =
        "";


    documentStatus.textContent =
        `${pdfDocument.numPages} page${
            pdfDocument.numPages > 1
                ? "s"
                : ""
        }`;


    mettreAJourZoom();


    for (
        let pageNumber = 1;
        pageNumber <= pdfDocument.numPages;
        pageNumber++
    ) {

        await rendrePage(
            pageNumber
        );

    }

}


/* =========================================================
   RENDRE UNE PAGE
========================================================= */

async function rendrePage(
    pageNumber
) {

    const page =
        await pdfDocument.getPage(
            pageNumber
        );


    const viewport =
        page.getViewport({

            scale:
                zoom,

            rotation:
                rotation

        });


    const pageContainer =
        document.createElement(
            "div"
        );


    pageContainer.className =
        "pdfPage";


    pageContainer.style.width =
        `${viewport.width}px`;


    pageContainer.style.height =
        `${viewport.height}px`;


    const canvas =
        document.createElement(
            "canvas"
        );


    const context =
        canvas.getContext(
            "2d"
        );


    const dpr =
        window.devicePixelRatio ||
        1;


    canvas.width =
        Math.floor(
            viewport.width *
            dpr
        );


    canvas.height =
        Math.floor(
            viewport.height *
            dpr
        );


    canvas.style.width =
        `${viewport.width}px`;


    canvas.style.height =
        `${viewport.height}px`;


    pageContainer.appendChild(
        canvas
    );


    const pageNumberLabel =
        document.createElement(
            "div"
        );


    pageNumberLabel.className =
        "pageNumber";


    pageNumberLabel.textContent =
        `Page ${pageNumber} / ${pdfDocument.numPages}`;


    pageContainer.appendChild(
        pageNumberLabel
    );


    pagesContainer.appendChild(
        pageContainer
    );


    /*
     * On utilise le DPR pour obtenir
     * un affichage net sur les écrans
     * haute résolution.
     */

    const transform =
        dpr !== 1
            ? [dpr, 0, 0, dpr, 0, 0]
            : null;


    await page.render({

        canvasContext:
            context,

        viewport:
            viewport,

        transform:
            transform

    }).promise;

}


/* =========================================================
   CHARGER UN BLOB
========================================================= */

async function chargerBlob(
    blob,
    nom
) {

    try {

        afficherLoader(
            "Préparation du document..."
        );


        pdfBlob =
            blob;


        definirTitre(
            nom
        );


        if (pdfUrl) {

            URL.revokeObjectURL(
                pdfUrl
            );

        }


        pdfUrl =
            URL.createObjectURL(
                blob
            );


        const arrayBuffer =
            await blob.arrayBuffer();


        await chargerDepuisDonnees(
            new Uint8Array(
                arrayBuffer
            )
        );

    }

    catch (error) {

        console.error(
            error
        );


        afficherErreur(
            "Le PDF n'a pas pu être chargé."
        );

    }

}


/* =========================================================
   CHARGER DEPUIS DES DONNÉES PDF
========================================================= */

async function chargerDepuisDonnees(
    data
) {

    afficherLoader(
        "Rendu du document..."
    );


    /*
     * destruction éventuelle de l'ancien PDF
     */

    if (pdfDocument) {

        try {

            await pdfDocument.destroy();

        }

        catch (_) {}

    }


    /*
     * Chargement PDF.js
     */

    const loadingTask =
        getDocument({

            data:
                data

        });


    pdfDocument =
        await loadingTask.promise;


    await rendrePDF();


    masquerLoader();


    documentStatus.textContent =
        `${pdfDocument.numPages} page${
            pdfDocument.numPages > 1
                ? "s"
                : ""
        }`;

}


/* =========================================================
   URL DIRECTE
========================================================= */

async function chargerDepuisURL(
    url,
    nom
) {

    try {

        afficherLoader(
            "Téléchargement du document..."
        );


        const response =
            await fetch(
                decodeURIComponent(
                    url
                )
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const blob =
            await response.blob();


        await chargerBlob(
            blob,
            nom
        );

    }

    catch (error) {

        console.error(
            "Erreur URL :",
            error
        );


        afficherErreur(
            "Impossible de récupérer le PDF."
        );

    }

}


/* =========================================================
   FIRESTORE
========================================================= */

async function chargerDepuisFirestore(
    docId
) {

    try {

        afficherLoader(
            "Récupération du document..."
        );


        const ref =
            db
                .collection("documents")
                .doc(docId);


        const snap =
            await ref.get();


        if (!snap.exists) {

            throw new Error(
                "Document introuvable."
            );

        }


        const data =
            snap.data();


        const nom =
            data.nom ||
            data.name ||
            data.filename ||
            data.fileName ||
            "Document.pdf";


        /* =================================================
           ORDONNANCE
        ================================================= */

        if (data.ord) {

            if (
                typeof generateHTML !==
                "function"
            ) {

                throw new Error(
                    "Le module ordonnance n'est pas chargé."
                );

            }


            afficherLoader(
                "Génération de l'ordonnance..."
            );


            const html =
                generateHTML(
                    data.ord
                );


            const container =
                document.createElement(
                    "div"
                );


            container.innerHTML =
                html;


            const blob =
                await html2pdf()
                    .set({

                        margin: 0,

                        html2canvas: {

                            scale: 2

                        },

                        jsPDF: {

                            unit: "mm",

                            format: "a4",

                            orientation:
                                "portrait"

                        }

                    })
                    .from(container)
                    .outputPdf(
                        "blob"
                    );


            await chargerBlob(
                blob,
                nom === "Document.pdf"
                    ? "Ordonnance.pdf"
                    : nom
            );


            return;

        }


        /* =================================================
           PDF BASE64
        ================================================= */

        if (data.pdfBase64) {

            const blob =
                b64toBlob(
                    data.pdfBase64,
                    "application/pdf"
                );


            await chargerBlob(
                blob,
                nom
            );


            return;

        }


        throw new Error(
            "PDF indisponible."
        );

    }

    catch (error) {

        console.error(
            "Erreur Firestore :",
            error
        );


        afficherErreur(
            error.message ||
            "Impossible de charger le document."
        );

    }

}


/* =========================================================
   BASE64 → BLOB
========================================================= */

function b64toBlob(
    b64,
    type
) {

    const bytes =
        atob(b64);


    const arr =
        new Uint8Array(
            bytes.length
        );


    for (
        let i = 0;
        i < bytes.length;
        i++
    ) {

        arr[i] =
            bytes.charCodeAt(i);

    }


    return new Blob(
        [
            arr
        ],
        {
            type:
                type
        }
    );

}


/* =========================================================
   ZOOM +
========================================================= */

document
    .getElementById(
        "zoomIn"
    )
    .addEventListener(
        "click",
        async () => {

            zoom =
                Math.min(
                    3,
                    zoom + .15
                );


            await rendrePDF();

        }
    );


/* =========================================================
   ZOOM -
========================================================= */

document
    .getElementById(
        "zoomOut"
    )
    .addEventListener(
        "click",
        async () => {

            zoom =
                Math.max(
                    .5,
                    zoom - .15
                );


            await rendrePDF();

        }
    );


/* =========================================================
   RESET ZOOM
========================================================= */

document
    .getElementById(
        "zoomValue"
    )
    .addEventListener(
        "click",
        async () => {

            zoom =
                1.25;


            await rendrePDF();

        }
    );


/* =========================================================
   ROTATION
========================================================= */

document
    .getElementById(
        "rotateButton"
    )
    .addEventListener(
        "click",
        async () => {

            rotation =
                (
                    rotation +
                    90
                ) %
                360;


            await rendrePDF();

        }
    );


/* =========================================================
   TELECHARGEMENT
========================================================= */

document
    .getElementById(
        "downloadButton"
    )
    .addEventListener(
        "click",
        () => {

            if (!pdfBlob) {

                return;

            }


            const url =
                URL.createObjectURL(
                    pdfBlob
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href =
                url;


            a.download =
                nomDocument;


            document.body.appendChild(
                a
            );


            a.click();


            a.remove();


            setTimeout(
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );

        }
    );


/* =========================================================
   PLEIN ÉCRAN
========================================================= */

document
    .getElementById(
        "fullscreenButton"
    )
    .addEventListener(
        "click",
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }

                else {

                    await document
                        .exitFullscreen();

                }

            }

            catch (error) {

                console.error(
                    error
                );

            }

        }
    );


/* =========================================================
   🖨️ IMPRESSION ELECTRON UNIQUEMENT
========================================================= */

printButton.addEventListener(
    "click",
    async () => {

        /*
         * Double sécurité :
         *
         * Même si quelqu'un déclenche
         * artificiellement le bouton,
         * aucune impression Electron
         * ne sera faite dans le navigateur.
         */

        if (!estElectron) {

            return;

        }


        if (!pdfBlob) {

            return;

        }


        try {

            printButton.disabled =
                true;


            printButton.innerHTML =
                "⏳ Préparation...";


            const buffer =
                await pdfBlob.arrayBuffer();


            await window.electronPrint
                .ouvrirPDF({

                    data:
                        new Uint8Array(
                            buffer
                        ),

                    nom:
                        nomDocument

                });


            printButton.innerHTML =
                "🖨️ Imprimer";


            printButton.disabled =
                false;

        }

        catch (error) {

            console.error(
                "Erreur impression Electron:",
                error
            );


            printButton.innerHTML =
                "🖨️ Imprimer";


            printButton.disabled =
                false;


            alert(
                "Impossible d'ouvrir la fenêtre d'impression.\n\n" +
                (
                    error.message ||
                    "Erreur inconnue."
                )
            );

        }

    }
);


/* =========================================================
   NETTOYAGE
========================================================= */

window.addEventListener(
    "beforeunload",
    async () => {

        if (pdfDocument) {

            try {

                await pdfDocument.destroy();

            }

            catch (_) {}

        }


        if (pdfUrl) {

            URL.revokeObjectURL(
                pdfUrl
            );

        }

    }
);


/* =========================================================
   FONCTION PRINCIPALE
========================================================= */

async function viewer() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const docId =
        params.get(
            "docId"
        );


    const fileUrl =
        params.get(
            "file"
        );


    const nom =
        params.get(
            "nom"
        );


    /* ================================================
       URL DIRECTE
    ================================================= */

    if (fileUrl) {

        await chargerDepuisURL(
            fileUrl,
            nom ||
            "Document.pdf"
        );


        return;

    }


    /* ================================================
       FIRESTORE
    ================================================= */

    if (docId) {

        await chargerDepuisFirestore(
            docId
        );


        return;

    }


    /* ================================================
       RIEN
    ================================================= */

    afficherErreur(
        "Aucun document PDF n'a été fourni."
    );

}


/* =========================================================
   LANCEMENT
========================================================= */

viewer();

</script>
