  <script>

    const firebaseConfig = {

    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    const otherCheck =
      document.getElementById("otherEmailCheck");

    const otherInput =
      document.getElementById("otherEmailInput");

    const emailList =
      document.getElementById("emailList");

    const btnEnvoyerMail =
      document.getElementById("btnEnvoyerMail");

    const loadingModal =
      document.getElementById("loadingModal");

    const patientId =
      new URLSearchParams(window.location.search).get("id");

    let destinataires = [];


    /* =========================================================
       AUTRE EMAIL
       ========================================================= */

    if (otherCheck && otherInput) {

      otherCheck.addEventListener("change", (e) => {

        otherInput.disabled = !e.target.checked;

        if (!e.target.checked) {
          otherInput.value = "";
        }

      });

    }


    /* =========================================================
       AFFICHAGE DES MODALES
       ========================================================= */

    const show = (id) => {

      const element = document.getElementById(id);

      if (element) {
        element.style.display = "flex";
      }

    };


    const hide = (id) => {

      const element = document.getElementById(id);

      if (element) {
        element.style.display = "none";
      }

    };


    /* =========================================================
       NOTIFICATIONS
       ========================================================= */

    const ORIGINE_PARENT_BULLE = "*";


    function afficherBulle(message, typeBulle) {

      if (window.parent === window) {

        console.warn(
          "afficherBulle appelée sans parent :",
          message
        );

        return;

      }

      window.parent.postMessage(
        {
          source: "notification-bulle",
          message: message,
          typeBulle: typeBulle
        },
        ORIGINE_PARENT_BULLE
      );

    }


    window.addEventListener("message", (event) => {

      if (
        event.data &&
        event.data.source === "notification-bulle" &&
        window.parent !== window
      ) {

        window.parent.postMessage(
          event.data,
          ORIGINE_PARENT_BULLE
        );

      }

    });


    /* =========================================================
       ENVOI DU MAIL VIA TON SERVEUR
       ========================================================= */

    async function envoyerMailServeur(
      destinataires,
      sujet,
      html
    ) {

      const response = await fetch(
        "https://gesturg2-server.onrender.com/api/mail/send",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            to: destinataires,

            subject: sujet,

            html: html

          })
        }
      );


      let result = {};

      try {

        result = await response.json();

      } catch (e) {

        result = {};

      }


      if (!response.ok) {

        throw new Error(
          result.message ||
          "Le serveur n'a pas pu envoyer le mail."
        );

      }


      return result;

    }


    /* =========================================================
       BOUTON ENVOYER
       ========================================================= */

    btnEnvoyerMail.addEventListener(
      "click",
      async () => {

        /* -----------------------------------------------------
           RÉCUPÉRATION DU MESSAGE
        ----------------------------------------------------- */

        const message =
          document
            .getElementById("messageText")
            .value
            .trim();


        if (!message) {

          afficherBulle(
            "Veuillez saisir un message.",
            "alerte"
          );

          return;

        }


        /* -----------------------------------------------------
           RÉCUPÉRATION DES DESTINATAIRES COCHÉS
        ----------------------------------------------------- */

        const cases =
          document.querySelectorAll(
            '#emailList input[type="checkbox"]:checked'
          );


        destinataires = [];


        cases.forEach((checkbox) => {

          if (checkbox.value) {

            destinataires.push(
              checkbox.value.trim()
            );

          }

        });


        /* -----------------------------------------------------
           AUTRE EMAIL
        ----------------------------------------------------- */

        if (
          otherCheck.checked &&
          otherInput.value.trim()
        ) {

          const autreEmail =
            otherInput.value.trim();


          /*
           * Vérification simple de l'adresse.
           */

          const emailRegex =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


          if (!emailRegex.test(autreEmail)) {

            afficherBulle(
              "L'adresse email saisie n'est pas valide.",
              "alerte"
            );

            return;

          }


          destinataires.push(
            autreEmail
          );

        }


        /* -----------------------------------------------------
           VÉRIFICATION DESTINATAIRES
        ----------------------------------------------------- */

        if (destinataires.length === 0) {

          afficherBulle(
            "Veuillez sélectionner au moins un destinataire.",
            "alerte"
          );

          return;

        }


        /* -----------------------------------------------------
           SUPPRESSION DES DOUBLONS
        ----------------------------------------------------- */

        destinataires =
          [...new Set(destinataires)];


        /* -----------------------------------------------------
           SUJET
        -----------------------------------------------------

           Tu peux changer cette ligne si tu veux un sujet
           différent.
        */

        const sujet =
          "Message depuis GestUrg2";


        /* -----------------------------------------------------
           CONVERSION DU MESSAGE EN HTML
        -----------------------------------------------------

           On échappe les caractères HTML avant de mettre
           le texte dans le mail.

           Les retours à la ligne deviennent <br>.
        */

        const messageSecurise =
          message
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;")
            .replace(/\n/g, "<br>");


        const htmlMail = `
<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

</head>

<body style="
  font-family: Arial, sans-serif;
  color: #222;
  line-height: 1.6;
">

  <div style="
    max-width: 700px;
    margin: auto;
  ">

    <h2 style="
      color: #1a237e;
    ">
      📧 Message GestUrg2
    </h2>

    <div style="
      padding: 18px;
      background: #f5f7fb;
      border-radius: 10px;
      border-left: 4px solid #2563eb;
    ">

      ${messageSecurise}

    </div>

    <p style="
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    ">

      Message envoyé depuis GestUrg2.

    </p>

  </div>

</body>

</html>
`;


        /* -----------------------------------------------------
           AFFICHAGE LOADER
        ----------------------------------------------------- */

        loadingModal.style.display = "flex";

        btnEnvoyerMail.disabled = true;


        try {

          /* ---------------------------------------------------
             ENVOI AU SERVEUR
          --------------------------------------------------- */

          const result =
            await envoyerMailServeur(
              destinataires,
              sujet,
              htmlMail
            );


          console.log(
            "Réponse serveur :",
            result
          );


          /* ---------------------------------------------------
             SUCCÈS
          --------------------------------------------------- */

          afficherBulle(
            "Email envoyé avec succès.",
            "administratif"
          );


          /*
           * Nettoyage du formulaire
           */

          document
            .getElementById("messageText")
            .value = "";


          otherInput.value = "";

          otherCheck.checked = false;

          otherInput.disabled = true;


          /*
           * Décocher les destinataires
           */

          document
            .querySelectorAll(
              '#emailList input[type="checkbox"]'
            )
            .forEach((checkbox) => {

              checkbox.checked = false;

            });


        } catch (error) {

          console.error(
            "Erreur lors de l'envoi :",
            error
          );


          afficherBulle(
            "Erreur lors de l'envoi : " +
            error.message,
            "alerte"
          );


        } finally {

          loadingModal.style.display = "none";

          btnEnvoyerMail.disabled = false;

        }

      }
    );


  </script>

  <script type="module">

    import {

      apiKey:

        "urgences-a8ed4"

    };

      getAuth(app);


    const db =
      getFirestore(app);


    let medecinNom = "";
    let medecinSpecialite = "";
    let medecinLieu = "";

      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "index.html";

          return;

        }


        try {

          const docRef =
            doc(
              db,
              "medecins",
              user.uid
            );

            await getDoc(docRef);


          if (!docSnap.exists()) {

            alert(
              "Utilisateur non trouvé, veuillez vous reconnecter."
            );

            window.location.href =
              "index.html";

            return;

          }


          const data =
            docSnap.data();


          medecinNom =
            data.nom || "";

          medecinSpecialite =
            data.specialite || "";

          medecinLieu =
            data.lieu || "";


          /*
           * Variables globales
           */

          window.medecinNom =
            medecinNom;

          window.medecinSpecialite =
            medecinSpecialite;

          window.medecinLieu =
            medecinLieu;


          /* ---------------------------------------------------
             CONTRÔLE DES PAGES
          --------------------------------------------------- */

          const pages =
            data.pages || {};


          const currentPath =
            window.location.pathname;


          const currentPage =
            currentPath
              .substring(
                currentPath.lastIndexOf("/") + 1
              )
              .replace(".html", "");


          const pageMapping = {

            "mailtof": "mailto"

          };


          const pageKey =
            pageMapping[currentPage] ||
            currentPage;


          console.log(
            "Page actuelle :",
            currentPage
          );


          console.log(
            "Page Firestore :",
            pageKey
          );


          if (!pages[pageKey]) {

            const modal =
              document.getElementById(
                "modal-no-access"
              );


            if (modal) {

              modal.style.display =
                "flex";

            }


            console.warn(
              "Accès refusé à",
              currentPage
            );


            return;

          }


          console.log(
            "Accès autorisé à",
            currentPage
          );


          /*
           * --------------------------------------------------
           * CHARGEMENT DES DESTINATAIRES
           * --------------------------------------------------
           *
           * IMPORTANT :
           * Je laisse ici ton système de destinataires.
           *
           * Si ton code actuel possède déjà une fonction qui
           * remplit #emailList depuis Firestore, conserve-la.
           *
           * Exemple de structure attendue :
           *
           * <label>
           *   <input type="checkbox"
           *          value="email@hopital.fr">
           *   Nom du destinataire
           * </label>
           *
           */


        } catch (error) {

          console.error(
            "Erreur chargement médecin :",
            error
          );


          alert(
            "Une erreur est survenue, veuillez réessayer plus tard."
          );

        }

      }
    );


    /* =========================================================
       VERROUILLAGE DE L'APPLICATION
       ========================================================= */

    let appLocked = false;


    window.addEventListener(
      "message",
      (event) => {

        /*
         * On conserve ton fonctionnement actuel.
         */

        if (event.origin !== "*") {

          return;

        }


        if (!event.data) {

          return;

        }


        if (
          event.data.type ===
          "APP_LOCK"
        ) {

          appLocked = true;

          document.body.style.filter =
            "grayscale(0.8)";

        }


        if (
          event.data.type ===
          "APP_UNLOCK"
        ) {

          appLocked = false;

          document.body.style.filter =
            "none";

        }

      }
    );


    /* =========================================================
       PROTECTION DES BOUTONS
       ========================================================= */

    document.addEventListener(
      "click",
      function(e) {

        if (appLocked) {

          e.stopPropagation();

          e.preventDefault();

        }

      },
      true
    );

  </script>
