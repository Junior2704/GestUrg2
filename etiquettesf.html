<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Générateur d’étiquettes patient</title>
    <link rel="icon" type="image/jpeg" href="logog2.png">

<!-- Librairies PDF & code-barres -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
/* =====================================================================
   Même identité visuelle que fiche.html
   Fond blanc · bleu clinique · cartes à bordure fine
   ===================================================================== */

/* ---------- TOKENS (identiques à fiche.html) ---------- */
:root{
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --bg:#ffffff;
  --ink:#112336;
  --muted:#586a7e;
  --line:#d8e1ea;
  --line-soft:#e9eff5;
  --field:#f6f9fc;

  --primary:#0b6fa4;
  --primary-d:#085a86;
  --primary-soft:#e3f1f9;

  --ok:#16784a;    --ok-soft:#e1f4e9;
  --late:#b92a30;  --late-soft:#fdecec;
  --warn:#7a4f00;  --warn-soft:#fff5da; --warn-line:#f0d98f;

  --shadow-sm:0 1px 2px rgba(17,35,54,.06);
  --ring:0 0 0 4px rgba(11,111,164,.15);

  --safe-t:env(safe-area-inset-top,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);

  --gutter:clamp(16px,3vw,32px);
  --maxw:1100px;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0;background:var(--bg)}
html{scroll-padding-top:var(--safe-t);max-width:100%;overflow-x:hidden}
body{
  font-family:var(--font);
  font-size:16px;line-height:1.45;
  color:var(--ink);
  max-width:100%;overflow-x:hidden;
  padding:calc(22px + var(--safe-t)) max(var(--gutter),calc((100% - var(--maxw))/2)) calc(48px + var(--safe-b));
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}
.i.lg{width:24px;height:24px}
.muted{color:var(--muted)}
hr{border:0;height:1px;background:var(--line);margin:22px 0}

/* ---------- BOUTONS ---------- */
.btn-id{
  appearance:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;
  font:600 15px/1 var(--font);color:var(--ink);text-decoration:none;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  cursor:pointer;touch-action:manipulation;
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
}
.btn-id .i{width:18px;height:18px}
.btn-id:active{background:var(--line-soft)}
.btn-id:focus-visible{outline:3px solid rgba(11,111,164,.4);outline-offset:2px}
.btn-id:disabled{opacity:.6;cursor:progress}
@media (hover:hover){.btn-id:hover:not(:disabled){background:var(--primary-soft);border-color:#b5d6ea;color:var(--primary-d)}}
.btn-id-v{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-id-v:active{background:var(--primary-d)}
@media (hover:hover){.btn-id-v:hover:not(:disabled){background:var(--primary-d);border-color:var(--primary-d);color:#fff}}
.btn-id-c{color:var(--late);background:#fff;border-color:#f0c3c5}
.btn-id-c:active{background:#fbdcdc}
@media (hover:hover){.btn-id-c:hover:not(:disabled){background:var(--late-soft);border-color:#e7a9ac;color:var(--late)}}
.btn-danger{background:var(--late);border-color:var(--late);color:#fff}
.btn-danger:active{background:#951f25}
@media (hover:hover){.btn-danger:hover:not(:disabled){background:#951f25;border-color:#951f25;color:#fff}}
.actions{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- CHAMPS ---------- */
label{display:block;margin:0 0 6px;font-size:14px;font-weight:600;color:var(--ink)}
input[type=text],input[type=number],select,textarea{
  width:100%;min-height:48px;margin:0;padding:12px 14px;
  font:inherit;font-size:16px;color:var(--ink);
  background:var(--field);
  border:1px solid var(--line);border-radius:12px;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input::placeholder{color:#8a9bad}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:var(--ring)}

/* ---------- CARTES ---------- */
.card{
  margin-bottom:16px;padding:20px;
  background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);
}
.card-title{
  display:flex;align-items:center;gap:10px;
  margin:0 0 16px;
  font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
.card-title .i{color:var(--primary);width:18px;height:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fact{padding:12px 14px;background:var(--field);border:1px solid var(--line);border-radius:12px;min-width:0}
.fact-lbl{display:block;margin:0 0 3px;font-size:13px;font-weight:500;color:var(--muted)}
.fact .val{display:block;min-height:22px;font-weight:600;overflow-wrap:anywhere}
.page-title{
  display:flex;align-items:center;gap:12px;
  margin:0 0 20px;
  font-size:22px;font-weight:700;letter-spacing:-.015em;color:var(--ink);
}
.page-title .ico{
  width:40px;height:40px;flex:none;display:grid;place-items:center;
  color:var(--primary);background:var(--primary-soft);border-radius:12px;
}

/* ---------- ÉTATS : accès refusé / erreur ---------- */
.modalna{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));
  background:rgba(10,25,41,.5);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  z-index:99999;
}
.modalna .card{
  width:min(440px,100%);margin:0;padding:30px 28px 28px;text-align:center;
  background:#fff;border:0;border-radius:18px;box-shadow:0 20px 50px rgba(10,25,41,.3);
}
.state-ico{width:58px;height:58px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;background:var(--late-soft);color:var(--late)}
.state-ico .i{width:28px;height:28px}
.modalna h2{margin-bottom:10px;font-size:21px;font-weight:700;color:var(--late)}
.modalna p{margin-bottom:8px;font-size:16px;color:var(--ink)}
.modalna p:last-child{margin-bottom:0}

/* ---------- ANIMATIONS ---------- */
.spinner{
  width:48px;height:48px;margin:auto;
  border:5px solid var(--line-soft);border-top-color:var(--primary);border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- BARRES DE DÉFILEMENT ---------- */
*{scrollbar-width:thin;scrollbar-color:rgba(11,111,164,.35) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(11,111,164,.35);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(8,90,134,.6)}

/* =====================================================================
   ÉTIQUETTES
   ===================================================================== */
main{display:block}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.field{min-width:0}
.field input[type=number]{max-width:none}
.actions.sep{margin-top:20px}
#infos{padding:0;border:0;box-shadow:none;margin-bottom:16px;background:transparent}
#infos.msg{padding:14px 16px;font-weight:600;color:var(--late);background:var(--late-soft);border:1px solid #f0c3c5;border-radius:12px}

#preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.preview-card{
  position:relative;
  padding:38px 14px 14px;
  font-size:15px;line-height:1.5;text-align:center;
  background:var(--field);border:1px solid var(--line);border-radius:12px;
  overflow-wrap:anywhere;
}
.preview-card b{font-size:16px;font-weight:700}
.preview-card img{display:block;margin:10px auto 0;max-width:150px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:8px}
.preview-title{
  position:absolute;top:10px;left:12px;
  padding:4px 10px;
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--primary-d);background:var(--primary-soft);border-radius:999px;
}

.loader-overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  z-index:100000;
  font-weight:600;color:var(--primary-d);
}
@media (max-width:700px){
  body{padding-top:calc(16px + var(--safe-t))}
  .card{padding:16px;border-radius:14px}
  .form-grid{grid-template-columns:1fr}
  .actions .btn-id{flex:1 1 100%}
}
</style>
</head>
<body>


<main id="mainContent" style="display:none;">
  <div id="infos">Chargement du patient...</div>

  <section class="card">
    <h3 class="card-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7" cy="7" r="1.5"/></svg> Presets</h3>
    <div class="actions">
      <button class="btn-id" id="btnDefault"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg> Planche par défaut</button>
      <button class="btn-id" id="btnIdentite"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Identité uniquement</button>
      <button class="btn-id" id="btnAdresse"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> Adresse uniquement</button>
    </div>
  </section>

  <section class="card">
    <h3 class="card-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg> Planche personnalisée</h3>
    <div class="form-grid">
      <div class="field">
        <label for="nbIdentite">Nombre d’étiquettes d’identité</label>
        <input type="number" id="nbIdentite" value="4" min="0">
      </div>
      <div class="field">
        <label for="nbAdresse">Nombre d’étiquettes d’adresse</label>
        <input type="number" id="nbAdresse" value="2" min="0">
      </div>
    </div>
    <div class="actions" style="margin-top:20px;">
      <button id="btnGenerer" class="btn-id btn-id-v"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg> Générer PDF (manuel)</button>
    </div>
  </section>

  <section class="card">
    <h3 class="card-title"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7" cy="7" r="1.5"/></svg> Aperçu des modèles</h3>
    <div id="preview"></div>
  </section>
</main>



<!-- Écran de chargement -->
<div id="loaderOverlay" class="loader-overlay">
  <div class="spinner"></div>
  <div>Chargement...</div>
</div>

<!-- Accès refusé -->
<div id="modal-no-access" class="modalna">
  <div class="card">
    <div class="state-ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg></div>
    <h2>Accès refusé</h2>
    <p>Vous n’avez pas accès à cette page.</p>
  </div>
</div>

<!-- Erreur générique -->
<div id="modal-error" class="modalna">
  <div class="card">
    <div class="state-ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></div>
    <h2>Oups, une erreur est survenue</h2>
    <p>Veuillez re-essayer un peu plus tard</p>
    <p>Si le problème persiste, contactez un administrateur</p>
  </div>
</div>

<script type="module">
/* --- FIREBASE (API modulaire v10) --- */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",
  authDomain: "urgences-a8ed4.firebaseapp.com",
  projectId: "urgences-a8ed4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const patientId = urlParams.get("id");
let patientData = null;

function afficherMessageInfos(texte) {
  const infos = document.getElementById("infos");
  infos.classList.add("msg");
  infos.textContent = texte;
}

function afficherLoader() {
  document.getElementById("loaderOverlay").style.display = "flex";
}
function masquerLoader() {
  document.getElementById("loaderOverlay").style.display = "none";
}

/* --- SYSTÈME D'IDENTIFICATION (identique aux autres pages de l'application) --- */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    // Pas connecté : rien à afficher (la page est destinée à être ouverte
    // depuis fiche.html, déjà protégée par la connexion).
    return;
  }

  afficherLoader();

  try {
    const docRef = doc(db, "medecins", user.uid);
    const docSnap = await getDoc(docRef);

    if (!docSnap.exists()) {
      masquerLoader();
      document.getElementById("modal-no-access").style.display = "flex";
      console.warn("Médecin non trouvé");
      return;
    }

    const data = docSnap.data();

    // Infos médecin (stockées globalement si besoin par d'autres scripts)
    window.medecinNom = data.nom || "";
    window.medecinSpecialite = data.specialite || "";
    window.medecinLieu = data.lieu || "";
    window.medecinType = data.type || "";
    window.medecinUid = user.uid;

    // Vérification d'accès à la page
  

    // ✅ Accès autorisé : on peut charger le patient
    await chargerPatient();
    document.getElementById("mainContent").style.display = "block";
    masquerLoader();

  } catch (error) {
    console.error("Erreur lors de la récupération du médecin :", error);
    masquerLoader();
    document.getElementById("modal-error").style.display = "flex";
  }
});

/* --- CHARGER PATIENT (API modulaire) --- */
async function chargerPatient() {
  if (!patientId) {
    afficherMessageInfos("Identifiant patient manquant dans l'URL");
    return;
  }

  try {
    const snap = await getDoc(doc(db, "patients", patientId));

    if (!snap.exists()) {
      afficherMessageInfos("Patient introuvable");
      return;
    }

    patientData = snap.data();
    const infos = document.getElementById("infos");
    infos.classList.remove("msg");
    infos.innerHTML = `
      <div class="facts">
        <div class="fact"><span class="fact-lbl">Patient</span><span class="val">${patientData.prenom} ${patientData.nom}</span></div>
        <div class="fact"><span class="fact-lbl">Né(e) le</span><span class="val">${patientData.dateNaissance || "?"}</span></div>
        <div class="fact"><span class="fact-lbl">ID patient</span><span class="val">${patientId}</span></div>
      </div>
    `;
    majApercu();

  } catch (error) {
    console.error("Erreur chargement patient :", error);
    afficherMessageInfos("Erreur lors du chargement du patient");
  }
}

/* --- APERÇU --- */
function majApercu(){
  if(!patientData) return;
  const preview = document.getElementById("preview");
  preview.innerHTML = "";

  const canvas = document.createElement("canvas");
  JsBarcode(canvas, patientId, {format:"CODE128", width:3, height:60, displayValue:false});
  const barcodeData = canvas.toDataURL("image/png");

  const div1=document.createElement("div");
  div1.className="preview-card";
  div1.innerHTML=`<div class='preview-title'>Identité</div>
    <b>${patientData.prenom} ${patientData.nom}</b><br>
    Né(e) le ${patientData.dateNaissance || "?"}<br>
    ID: ${patientId}<br>
    <img src='${barcodeData}'>`;
  preview.appendChild(div1);

  const div2=document.createElement("div");
  div2.className="preview-card";
  div2.innerHTML=`<div class='preview-title'>Adresse</div>
    <b>${patientData.prenom} ${patientData.nom}</b><br>
    ${patientData.adresse || "Adresse non renseignée"}<br>
    ${patientData.telephone || ""}`;
  preview.appendChild(div2);
}

/* --- TEXTE ADAPTATIF --- */
function layoutText(doc, text, maxWidth, maxHeight, initialSize = 10, minSize = 5) {
  let size = initialSize;
  let lines = [];
  const lineHeight = 4; // mm entre lignes
  doc.setFontSize(size);

  while (size >= minSize) {
    // Couper le texte en lignes selon la largeur
    const words = text.split(" ");
    let current = "";
    lines = [];
    for (const word of words) {
      const test = current ? current + " " + word : word;
      if (doc.getTextWidth(test) < maxWidth) current = test;
      else {
        lines.push(current);
        current = word;
      }
    }
    if (current) lines.push(current);

    const totalHeight = lines.length * lineHeight;
    if (totalHeight <= maxHeight) break; // ok
    size -= 0.5;
    doc.setFontSize(size);
  }

  // Si encore trop haut → tronquer
  while (lines.length * lineHeight > maxHeight) {
    lines.pop();
  }
  if (lines.length * lineHeight > maxHeight && lines.length > 0) {
    lines[lines.length - 1] += "…";
  }

  return { size, lines };
}

/* --- GÉNÉRATION PDF --- */
function genererPDF(nbIdentite, nbAdresse) {
  if(!patientData) return alert("Patient non chargé");

  const { jsPDF } = window.jspdf;
  const pdfDoc = new jsPDF({unit:"mm", format:"a4"});

  const marginLeft=5, marginTop=10;
  const labelW=63, labelH=35, cols=3, rows=8;
  const maxLabels = cols * rows;
  let count = 0;
  const total = Math.min(nbIdentite + nbAdresse, maxLabels);

  const canvas=document.createElement("canvas");
JsBarcode(canvas, patientId,{
  format: "CODE128",
  width: 2.5,        // 🔥 plus épais
  height: 50,        // 🔥 plus haut
  margin: 10,
  displayValue: false
});
  const barcodeData=canvas.toDataURL("image/png");
function formatTel(num) {
  if (!num) return "";
  // Supprime tout sauf les chiffres
  const digits = num.replace(/\D/g, "");
  // Groupes de 2 chiffres
  return digits.replace(/(\d{2})(?=\d)/g, "$1 ").trim();
}

  function placer(contenu, barcode=false){
    if(count >= maxLabels) return;
    const row=Math.floor(count/cols);
    const col=count%cols;
    const x=marginLeft+col*labelW;
    const y=marginTop+row*labelH;

    let offsetY=y+8;

    for (const line of contenu) {
      const { size, lines } = layoutText(pdfDoc, line, labelW-4, labelH-12);
      pdfDoc.setFontSize(size);
      for (const l of lines) {
        pdfDoc.text(l, x+2, offsetY);
        offsetY += 4;
        if (offsetY > y + labelH - 10) break; // pas plus bas que la zone code-barres
      }
    }

    if(barcode){
      pdfDoc.addImage(barcodeData,"PNG",x+2,y+labelH-12,40,10);
    }
    count++;
  }

  for(let i=0;i<nbIdentite && count<maxLabels;i++){
    placer([
      `${patientData.prenom} ${patientData.nom}`,
      `Né(e) le ${patientData.dateNaissance || ""}`,
      `CIP : ${patientId}`
    ],true);
  }

  for(let i=0;i<nbAdresse && count<maxLabels;i++){
    placer([
      `${patientData.prenom} ${patientData.nom}`,
      patientData.adresse || "Adresse inconnue",
      patientData.telephone ? "Tel : " + formatTel(patientData.telephone) : "",
	  

    ]);
  }

 
   // Générer le PDF en blob
const pdfBlob = pdfDoc.output("blob");

// Créer une URL temporaire
const pdfUrl = URL.createObjectURL(pdfBlob);

// Envoyer l’URL au parent pour ouverture dans un onglet interne
window.parent.postMessage(
  {
    type: "OPEN_TAB",
    title: `Etiquettes ${patientData.prenom} ${patientData.nom}`,
    url: pdfUrl
  },
  "*"
);
}


/* --- BOUTONS --- */
