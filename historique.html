<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --bleu: #0078d4;
    --bleu-fonce: #005ea2;
    --gris-fond: #ffff;
   --gris-bord: #ccc;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--gris-fond);
    color: #333;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    padding: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }

  header.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }

  header.page-header h1 {
    font-size: 1.5rem;
    color: var(--bleu);
    margin: 0;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  button {
    font-size: 0.95rem;
    padding: 9px 14px;
    border-radius: 8px;
    border: none;
    background: var(--bleu);
    color: white;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: var(--bleu-fonce); }
  button.secondaire {
    background: white;
    color: var(--bleu);
    border: 1px solid var(--bleu);
  }
  button.secondaire:hover { background: #eaf3fc; }

  label.checkbox-inline {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9rem;
    background: white;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--gris-bord);
    cursor: pointer;
    user-select: none;
  }

  .card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    padding: 20px;
    margin-bottom: 22px;
  }

  /* ---- Bloc identité patient (rappel permanent) ---- */
  #identitePatient {
    border-left: 6px solid var(--bleu);
  }
  #identitePatient h2 {
    margin-top: 0;
    color: var(--bleu);
  }
  .identite-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px 20px;
  }
  .identite-grid .champ {
    background: #f9f9f9;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .identite-grid .champ .lbl {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #777;
    margin-bottom: 2px;
  }
  .identite-grid .champ .val {
    font-weight: 600;
    color: #222;
  }
  .alerte-allergie {
    color: #c62828;
    font-weight: 700;
  }

  /* ---- Cartes hospitalisation ---- */
  .hospi-card {
    border-left: 6px solid var(--bleu);
  }
  .hospi-card.active-hospi {
    border-left-color: #2e7d32;
  }
  .hospi-card h2 {
    margin-top: 0;
    color: var(--bleu);
    border-bottom: 3px solid var(--bleu);
    padding-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .hospi-card.active-hospi h2 { color: #2e7d32; border-bottom-color: #2e7d32; }
  .badge-active {
    background: #2e7d32;
    color: white;
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 600;
  }
  .entry {
    background: #f9f9f9;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .hospi-card h3 {
    color: var(--bleu);
    margin-bottom: 8px;
  }
  .hospi-card hr {
    border: none;
    height: 3px;
    background: #e0e6ec;
    border-radius: 2px;
    margin: 16px 0;
  }

  /* ---- Journal des modifications ---- */
  .journal-modifications {
    margin-top: 14px;
    border: 1px dashed var(--gris-bord);
    border-radius: 8px;
    padding: 12px 14px;
    background: #fbfcfe;
  }
  .journal-modifications summary {
    cursor: pointer;
    font-weight: 700;
    color: var(--bleu);
    outline: none;
  }
  .journal-liste {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .journal-ligne {
    display: grid;
    grid-template-columns: 150px 1fr 190px;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    background: white;
    border: 1px solid #eee;
    font-size: 0.88rem;
    align-items: center;
  }
  .journal-ligne .jl-date { color: #555; font-variant-numeric: tabular-nums; }
  .journal-ligne .jl-action { color: #222; }
  .journal-ligne .jl-auteur {
    text-align: right;
    color: #0078d4;
    font-weight: 600;
    font-size: 0.82rem;
  }
  .journal-ligne .jl-auteur .type {
    display: block;
    color: #888;
    font-weight: 400;
    font-size: 0.75rem;
  }
  .journal-vide {
    color: #888;
    font-style: italic;
    font-size: 0.9rem;
  }

  /* ---- Sous-sections actes / médicaments / documents ---- */
  .sous-liste {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sous-item {
    background: #f9f9f9;
    border-left: 4px solid var(--bleu);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.92rem;
  }
  .sous-item.statut-ok { border-left-color: #2e7d32; }
  .sous-item.statut-attente { border-left-color: #e08a00; }
  .sous-item .sous-item-titre {
    font-weight: 700;
    color: #222;
  }
  .sous-item .sous-item-meta {
    color: #666;
    font-size: 0.82rem;
    margin-top: 2px;
  }
  .badge-statut {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .badge-statut.ok { background: #cbf7d5; color: #146c2e; }
  .badge-statut.attente { background: #fff3cd; color: #7a5600; }

  .doc-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f9f9f9;
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 0.92rem;
  }
  .doc-item button {
    padding: 5px 10px;
    font-size: 0.82rem;
  }

  .mini-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    margin-top: 6px;
  }
  .mini-table th, .mini-table td {
    border: 1px solid #e0e6ec;
    padding: 5px 7px;
    text-align: left;
  }
  .mini-table th {
    background: #eef3fb;
    color: var(--bleu-fonce);
  }
  .section-vide {
    color: #888;
    font-style: italic;
    font-size: 0.88rem;
  }

  /* ---- Barre d'export d'une hospitalisation ---- */
  #selectHospiExport {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--gris-bord);
    font-size: 0.9rem;
    background: white;
  }

  #rechercheGlobale {
    width: 100%;
    padding: 10px;
    margin-bottom: 18px;
    border-radius: 8px;
    border: 1px solid var(--gris-bord);
  }
  #etatChargement, #erreurChargement {
    text-align: center;
    padding: 40px 0;
    color: #666;
  }
  #erreurChargement { color: #c62828; display:none; }

  .no-print { display:none;
   }
   ::-webkit-scrollbar {
    width: 12px;
    height: 12px;
}

    background: #eef3ff;

}

::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #2196f3, #1565c0);

}

::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #42a5f5, #1976d2);
}

    scrollbar-width: thin;

}

</style>

<body>
  <header class="page-header no-print">

    <div class="toolbar">
      <button type="button" class="secondaire" style = "display:none;" id="btnRetour">⬅️ Retour à la fiche</button>
    </div>
  </header>

  <div class="card no-print" id="barreExport" style="display:none;">
    <h3 style="margin-top:0;">📥 Impression PDF d'une hospitalisation</h3>
    <div class="toolbar">
      <select id="selectHospiExport"></select>
      <label class="checkbox-inline">
        <input type="checkbox" id="chkInclureHistorique">
        Inclure le journal des modifications
      </label>
      <button type="btn-id" id="btnExporterPDF">📥 Générer le PDF</button>
    </div>
    <div class="muted" style="font-size:0.82rem;color:#777;margin-top:8px;">
      L'export ne concerne que l'hospitalisation sélectionnée ci-dessus (avec rappel de l'identité du patient en en-tête).
    </div>
  </div>

  <input
    type="text"
    id="rechercheGlobale"
    class="no-print"
    placeholder="🔍 Rechercher dans l'historique (motif, service, date, texte, auteur...)"
    style="display:none;"
  />

  <div id="etatChargement">⏳ Chargement de l'historique du patient...</div>
  <div id="erreurChargement"></div>

  <div id="contenuHistorique" style="display:none;">
    <!-- Bloc identité patient : rappel permanent -->
    <section id="identitePatient" style = "display:none;" class="card"></section>

    <!-- Liste des hospitalisations -->
    <div id="listeHospitalisations"></div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  where,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",
  authDomain: "urgences-a8ed4.firebaseapp.com",
  projectId: "urgences-a8ed4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const patientId = urlParams.get("id");

const elEtat = document.getElementById("etatChargement");
const elErreur = document.getElementById("erreurChargement");
const elContenu = document.getElementById("contenuHistorique");
const elIdentite = document.getElementById("identitePatient");
const elListe = document.getElementById("listeHospitalisations");
const elRecherche = document.getElementById("rechercheGlobale");
const elBarreExport = document.getElementById("barreExport");
const elSelectHospiExport = document.getElementById("selectHospiExport");

let hospitalisationsData = [];
let patientDataGlobal = null;
let tousLesDocumentsGlobal = [];

// Identité du médecin connecté (pour la signature du PDF exporté)
onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  try {
    const docSnap = await getDoc(doc(db, "medecins", user.uid));
    if (docSnap.exists()) {
      const data = docSnap.data();
      window.medecinNom = data.nom || "";
      window.medecinSpecialite = data.specialite || "";
      window.medecinType = data.type || "";
    }
  } catch (e) {
    console.error("Erreur chargement médecin :", e);
  }
});

function afficherErreur(message) {
  elEtat.style.display = "none";
  elErreur.style.display = "block";
  elErreur.textContent = "❌ " + message;
}

function calculerAge(dateNaissance) {
  if (!dateNaissance) return null;
  const parts = dateNaissance.split(/[\/\-]/);
  let d;
  if (parts.length === 3) {
    // formats possibles: JJ/MM/AAAA ou AAAA-MM-JJ
    if (parts[0].length === 4) {
      d = new Date(parts[0], parts[1] - 1, parts[2]);
    } else {
      d = new Date(parts[2], parts[1] - 1, parts[0]);
    }
  } else {
    d = new Date(dateNaissance);
  }
  if (isNaN(d.getTime())) return null;
  const diff = Date.now() - d.getTime();
  return Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
}

function echapper(texte) {
  const div = document.createElement("div");
  div.textContent = texte ?? "";
  return div.innerHTML;
}

function formatHorodatage(entree) {
  // entree.horodatage est un Timestamp Firestore ; fallback sur date/heure textuelles
  try {
    if (entree.horodatage && typeof entree.horodatage.toDate === "function") {
      const d = entree.horodatage.toDate();
      return d;
    }
  } catch (e) {}
  return null;
}

function rendreIdentite(patient) {
  const age = calculerAge(patient.dateNaissance);
  const allergiesImportantes = patient.importanceAllergies === true;

  elIdentite.innerHTML = `
    <h2>🧑‍⚕️ Identité du patient</h2>
    <div class="identite-grid">
      <div class="champ"><span class="lbl">Nom</span><span class="val">${echapper(patient.nom || "—")}</span></div>
      <div class="champ"><span class="lbl">Prénom</span><span class="val">${echapper(patient.prenom || "—")}</span></div>
      <div class="champ"><span class="lbl">Sexe</span><span class="val">${echapper(patient.sexe || "—")}</span></div>
      <div class="champ"><span class="lbl">Date de naissance</span><span class="val">${echapper(patient.dateNaissance || "—")}${age !== null ? " (" + age + " ans)" : ""}</span></div>
      <div class="champ"><span class="lbl">ID patient</span><span class="val">${echapper(patientId)}</span></div>
      <div class="champ"><span class="lbl">Médecin traitant</span><span class="val">${echapper(patient.medtraitant || "—")}</span></div>
      <div class="champ"><span class="lbl">Allergies</span><span class="val ${allergiesImportantes ? "alerte-allergie" : ""}">${allergiesImportantes ? "🚨 " : ""}${echapper(patient.allergies || "aucune")}</span></div>
      <div class="champ"><span class="lbl">Vigilances</span><span class="val">${echapper(patient.vigilances || "aucune")}</span></div>
    </div>
  `;
}

function rendreJournalModifications(historique) {
  const entrees = Array.isArray(historique) ? [...historique] : [];

  entrees.sort((a, b) => {
    const da = formatHorodatage(a);
    const db_ = formatHorodatage(b);
    if (da && db_) return da - db_;
    return 0;
  });

  if (entrees.length === 0) {
    return `
      <details class="journal-modifications">
        <summary>🕘 Journal des modifications (0)</summary>
        <p class="journal-vide">Aucune modification enregistrée pour cette hospitalisation.</p>
      </details>
    `;
  }

  const lignes = entrees.map(e => {
    const d = formatHorodatage(e);
    const dateAffichee = d
      ? d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" })
      : `${e.date || ""} ${e.heure || ""}`.trim() || "Date inconnue";

    const auteur = e.auteurNom || "Utilisateur inconnu";
    const type = e.auteurType || e.auteurSpecialite || "";

    return `
      <div class="journal-ligne">
        <span class="jl-date">${echapper(dateAffichee)}</span>
        <span class="jl-action">${echapper(e.action || e.texte || "—")}</span>
        <span class="jl-auteur">${echapper(auteur)}${type ? `<span class="type">${echapper(type)}</span>` : ""}</span>
      </div>
    `;
  }).join("");

  return `
    <details class="journal-modifications" open>
      <summary>🕘 Journal des modifications (${entrees.length})</summary>
      <div class="journal-liste">${lignes}</div>
    </details>
  `;
}

function formatRapport(rapport) {
  if (!rapport) return null;
  if (typeof rapport === "string") return rapport;
  if (typeof rapport === "object") {
    const labels = {
      identite: "Identité",
      hospitalisation: "Hospitalisation",
      medical: "Dossier médical",
      evolution: "Évolution aux urgences",
      constantes: "Constantes vitales",
      examens: "Examens complémentaires",
      actes: "Actes réalisés",
      medicaments: "Médicaments administrés",
      sortie: "Sortie"
    };
    return Object.entries(labels)
      .filter(([cle]) => rapport[cle] && String(rapport[cle]).trim() !== "")
      .map(([cle, lbl]) => `${lbl} :\n${rapport[cle]}`)
      .join("\n\n");
  }
  return null;
}

function rendreListeActesOuMeds(items, verbeRealise, champComment, champDateRealise, champCommentRealise) {
  if (!items || items.length === 0) {
    return `<p class="section-vide">Aucune entrée enregistrée.</p>`;
  }
  return `<div class="sous-liste">` + items.map(it => {
    const estFait = it.status === "realise" || it.status === "pris";
    return `
      <div class="sous-item ${estFait ? "statut-ok" : "statut-attente"}">
        <div class="sous-item-titre">${echapper(it.product || "Non renseigné")}
          <span class="badge-statut ${estFait ? "ok" : "attente"}">${estFait ? "✅ " + verbeRealise : "⏳ en attente"}</span>
        </div>
        <div class="sous-item-meta">
          ${it.createdAt ? `Demandé le ${echapper(it.createdAt)}` : ""}${it.dueAt ? ` — pour le ${echapper(it.dueAt)}` : ""}
          ${it[champDateRealise] ? `<br>${verbeRealise} le ${echapper(it[champDateRealise])}` : ""}
        </div>
        ${it[champComment] ? `<div class="sous-item-meta">Commentaire demande : ${echapper(it[champComment])}</div>` : ""}
        ${it[champCommentRealise] ? `<div class="sous-item-meta">Commentaire réalisation : ${echapper(it[champCommentRealise])}</div>` : ""}
      </div>
    `;
  }).join("") + `</div>`;
}

function rendreConstantesTable(rows) {
  if (!rows || rows.length === 0) {
    return `<p class="section-vide">Aucune constante enregistrée.</p>`;
  }
  const tries = [...rows].sort((a, b) => `${b.date || ""} ${b.heure || ""}`.localeCompare(`${a.date || ""} ${a.heure || ""}`));
  const lignes = tries.map(r => `
    <tr>
      <td>${echapper(r.date || "—")}</td>
      <td>${echapper(r.heure || "—")}</td>
      <td>${echapper(r.temperature || "—")}</td>
      <td>${echapper(r.fc || "—")}</td>
      <td>${echapper(r.ta || "—")}</td>
      <td>${echapper(r.saturation || "—")}</td>
      <td>${echapper(r.fr || "—")}</td>
      <td>${echapper(r.douleur || "—")}</td>
      <td>${echapper(r.glasgowTotal || "—")}</td>
      <td>${echapper(r.observation || "—")}</td>
    </tr>
  `).join("");
  return `
    <table class="mini-table">
      <thead>
        <tr><th>Date</th><th>Heure</th><th>Temp</th><th>FC</th><th>TA</th><th>Sat</th><th>FR</th><th>Douleur</th><th>GCS</th><th>Obs</th></tr>
      </thead>
      <tbody>${lignes}</tbody>
    </table>
  `;
}

function rendreDocumentsListe(docs) {
  if (!docs || docs.length === 0) {
    return `<p class="section-vide">Aucun document rattaché à cette hospitalisation.</p>`;
  }
  return docs.map(d => `
    <div class="doc-item">
      <span><strong>${echapper(d.type || "Document")}</strong> — ${echapper(d.dateCreation || "date inconnue")}${d.creePar ? ` <span style="color:#888;">(par ${echapper(d.creePar)})</span>` : ""}</span>
      ${d.pdfBase64 ? `<button type="button" class="secondaire" data-doc-open="${d.id}">🔎 Consulter</button>` : ""}
    </div>
  `).join("");
}

function rendreHospitalisation(hospi, numero, hospiId, estActive, documents) {

  const examens = Array.isArray(hospi.examens) ? hospi.examens : [];

  parts.push(`<hr>`);
  parts.push(`<h3>🌡️ Constantes vitales</h3>`);
  parts.push(rendreConstantesTable(constantes));

  if (examens.length > 0) {

    parts.push(`<h3>🩻 Examens demandés</h3>`);
    parts.push(examens.map(ex => `
      <div class="entry">
        <strong>${echapper(ex.type || "Examen")}</strong> — ${ex.realise ? "✅ Réalisé" : "⏳ En attente"}

        ${ex.compteRendu ? `<br><small>Résultat : ${echapper(ex.compteRendu)}</small>` : ""}

  parts.push(`<h3>💊 Médicaments administrés aux urgences</h3>`);

  parts.push(`<hr>`);
  parts.push(`<h3>📄 Documents</h3>`);
  parts.push(rendreDocumentsListe(documents));

  if (sortie) {
    parts.push(`<hr>`);
    parts.push(`<h3>🚪 Sortie</h3>`);
    parts.push(`<p><strong>Type :</strong> ${echapper(sortie.type || "—")}</p>`);
    if (sortie.serviceHospitalisation) parts.push(`<p><strong>🏥 Service hospitalisation :</strong> ${echapper(sortie.serviceHospitalisation)}</p>`);
    if (sortie.destinationTransfert) parts.push(`<p><strong>↔️ Destination transfert :</strong> ${echapper(sortie.destinationTransfert)}</p>`);
    if (sortie.avisSpecialiste) parts.push(`<p><strong>👩‍⚕️ Avis spécialiste :</strong> ${echapper(sortie.avisSpecialiste)}</p>`);
    if (Array.isArray(sortie.options) && sortie.options.length > 0) parts.push(`<p><strong>📋 Options :</strong> ${echapper(sortie.options.join(", "))}</p>`);
    if (sortie.traitementSortie) parts.push(`<p><strong>💊 Traitement de sortie :</strong><br>${echapper(sortie.traitementSortie)}</p>`);
    if (sortie.autreSortieTexte) parts.push(`<p><strong>🔤 Autre :</strong> ${echapper(sortie.autreSortieTexte)}</p>`);
    if (sortie.autreOptionTexte) parts.push(`<p><strong>🔤 Autre option :</strong> ${echapper(sortie.autreOptionTexte)}</p>`);

  if (rapportTexte) {

    parts.push(`<h3>🧾 Clôture</h3>`);
    parts.push(`<p style="white-space:pre-wrap">${echapper(rapportTexte)}</p>`);

if (hospi.signatureImage) {
      parts.push(`<p><strong>✍️ Signature du patient :</strong><br>
        <img src="${hospi.signatureImage}" alt="Signature du patient" style="max-width:280px;border:1px solid #e0e6ec;border-radius:6px;background:white;padding:6px;">
      </p>`);
    } else if (hospi.signatureStatut === "Refus de signer") {
      parts.push(`<p><strong>✍️ Signature du patient :</strong> ⚠️ Refus de signer</p>`);
    }
  parts.push(`<hr>`);
  parts.push(rendreJournalModifications(hospi.historique));

  const card = document.createElement("section");
  card.className = "card hospi-card" + (estActive ? " active-hospi" : "");

    <h2>🏥 Hospitalisation n°${numero} (${hospiId}) ${estActive ? '<span class="badge-active">EN COURS</span>' : ""}</h2>
   
    ${parts.join("\n")}
  `;

  // Ouverture des documents (PDF base64) dans un nouvel onglet
  card.querySelectorAll("[data-doc-open]").forEach(btn => {
    btn.addEventListener("click", () => {
      const docId = btn.getAttribute("data-doc-open");
      const docData = (documents || []).find(d => d.id === docId);
      if (!docData || !docData.pdfBase64) return;
      try {
        const byteChars = atob(docData.pdfBase64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: docData.mime || "application/pdf" });
        const url = URL.createObjectURL(blob);
        window.open(url, docData.type || "document");
      } catch (e) {
        console.error("Erreur ouverture document :", e);
      }
    });
  });

  return card;
}

function parseDateSouple(str) {
  if (!str) return null;
  str = String(str).trim();
  // format "JJ/MM/AAAA[, ]HH:MM(:SS)?" (fr-FR)
  let m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) {
    const [, d, mo, y, h, mi, s] = m;
    return new Date(+y, +mo - 1, +d, +h, +mi, s ? +s : 0);
  }
  // format date seule JJ/MM/AAAA
  m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) {
    const [, d, mo, y] = m;
    return new Date(+y, +mo - 1, +d, 0, 0, 0);
  }
  // fallback : tout format reconnu nativement (ISO, etc.)
  const d2 = new Date(str);
  if (!isNaN(d2.getTime())) return d2;
  return null;
}

function documentsDeLHospitalisation(tousLesDocuments, hospiId, hospi, estActive) {
  const debut = parseDateSouple(hospi.dateDebut);
  const fin = estActive ? new Date() : (parseDateSouple(hospi.dateFin) || new Date());

  return tousLesDocuments.filter(d => {
    // Rattachement explicite (documents créés après la mise à jour de docs.html)
    if (d.hospitalisationId && d.hospitalisationId === hospiId) return true;
    if (d.hospitalisationId && d.hospitalisationId !== hospiId) return false;

    // Documents "legacy" sans hospitalisationId : rattachement par date de création
    const dateDoc = parseDateSouple(d.dateCreation);
    if (!dateDoc || !debut) return false;
    return dateDoc >= debut && dateDoc <= fin;
  });
}

async function chargerTout() {
  if (!patientId) {
    afficherErreur("Identifiant patient manquant dans l'URL (?id=...)");
    return;
  }

  try {
    const patientRef = doc(db, "patients", patientId);
    const patientSnap = await getDoc(patientRef);

    if (!patientSnap.exists()) {
      afficherErreur("Patient introuvable.");
      return;
    }

    const patient = patientSnap.data();
    rendreIdentite(patient);

    // Tous les documents du patient, répartis ensuite par hospitalisation
    let tousLesDocuments = [];
    try {
      const docsSnap = await getDocs(query(collection(db, "documents"), where("patientId", "==", patientId)));
      tousLesDocuments = docsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      tousLesDocumentsGlobal = tousLesDocuments;
    } catch (e) {
      console.error("Erreur chargement des documents :", e);
    }

    const hospitalisationIds = Array.isArray(patient.hospitalisations) ? [...patient.hospitalisations] : [];

    hospitalisationsData = [];
    elSelectHospiExport.innerHTML = "";

    if (hospitalisationIds.length === 0) {
      elListe.innerHTML = "<p>Aucune hospitalisation enregistrée pour ce patient.</p>";
    } else {
      const hospis = await Promise.all(
        hospitalisationIds.map(id => getDoc(doc(db, "hospitalisations", id)))
      );

      elListe.innerHTML = "";
      // Affichage du plus récent au plus ancien
      for (let i = hospitalisationIds.length - 1; i >= 0; i--) {
        const snap = hospis[i];
        if (!snap.exists()) continue;
        const hospiId = hospitalisationIds[i];
        const hospiData = snap.data();
        const estActive = hospiId === patient.hospitalisationActiveId;
        const numero = i + 1;

        const documentsHospi = documentsDeLHospitalisation(tousLesDocuments, hospiId, hospiData, estActive);

        hospiData.__id = hospiId;
        const card = rendreHospitalisation(hospiData, numero, hospiId, estActive, documentsHospi);
        elListe.appendChild(card);

        hospitalisationsData.push({ id: hospiId, data: hospiData, numero, estActive });

        const option = document.createElement("option");
        option.value = hospiId;
        option.textContent = `Hospitalisation n°${numero} — ${hospiData.dateDebut || "date inconnue"}${estActive ? " (EN COURS)" : ""}`;
        elSelectHospiExport.appendChild(option);
      }
    }

    patientDataGlobal = patient;

    elEtat.style.display = "none";
    elContenu.style.display = "block";
    elRecherche.style.display = "block";
    elBarreExport.style.display = hospitalisationsData.length > 0 ? "block" : "none";

  } catch (err) {
    console.error("Erreur chargement historique patient :", err);
    afficherErreur("Erreur lors du chargement de l'historique.");
  }
}

            ? d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })
            : `${e.date || ""} ${e.heure || ""}`.trim() || "—";
          return [dateAffichee, e.action || e.texte || "—", e.auteurNom || "—", e.auteurType || e.auteurSpecialite || "—"];
        }),
        styles: { fontSize: 8, cellPadding: 3 },
        headStyles: { fillColor: bleu, textColor: 255 },
        theme: "grid"
      });
      y = pdf.lastAutoTable.finalY + 20;
    } else {
      pdf.setFont("helvetica", "italic");
      pdf.setFontSize(10);
      pdf.setTextColor(120, 120, 120);
      pdf.text("Aucune modification enregistrée pour cette hospitalisation.", marginX, y);
      y += 24;
    }
  }

  // ---- Signature / pied de page ----
  if (y > pdf.internal.pageSize.getHeight() - 80) {
    pdf.addPage();
    y = 40;
  }
  pdf.setDrawColor(220, 220, 220);
  pdf.setLineWidth(0.6);
  pdf.line(marginX, y, pageWidth - marginX, y);
  y += 18;
  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(9);
  pdf.setTextColor(120, 120, 120);
  const auteurExport = window.medecinNom
    ? `Document généré par ${window.medecinNom}${window.medecinType ? " (" + window.medecinType + ")" : ""} le ${new Date().toLocaleString("fr-FR")}`
    : `Document généré le ${new Date().toLocaleString("fr-FR")}`;
  pdf.text(auteurExport, marginX, y);

  const nomFichier = `rapport_hospitalisation_n°_${numero}_${(patient.nom || "patient").replace(/\s+/g, "_")}.pdf`;

  const blob = pdf.output("blob");
  const tempId = await stockerPdfTemporaire(blob);

  const viewerUrl =
    `viewer.html?tempId=${encodeURIComponent(tempId)}&nom=${encodeURIComponent(nomFichier)}`;

  window.parent.postMessage(
    {
      type: "OPEN_TAB",
      title: nomFichier,
      url: viewerUrl
    },
    "junior2704.github.io/GestUrg2/ // idéalement remplace par ton origine exacte plutôt que "junior2704.github.io/GestUrg2/
  );
}

// Petites fonctions utilitaires (à mettre une fois, par ex. dans un fichier commun)
function ouvrirDbTemp() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("gesturg2-temp-pdfs", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("pdfs");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function stockerPdfTemporaire(blob) {
  const db = await ouvrirDbTemp();
  const id = crypto.randomUUID();
  await new Promise((resolve, reject) => {
    const tx = db.transaction("pdfs", "readwrite");
    tx.objectStore("pdfs").put(blob, id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
  return id;
}

// ---- Helpers de mise en page PDF (mêmes conventions que rapporthospitalisation.html) ----

function addExamenBloc(pdf, ex, y, marginX, pageWidth, bleu) {
  const maxWidth = pageWidth - marginX * 2;
  const estRealise = !!ex.realise;

  const verifierSaut = (hauteurNecessaire) => {
    if (y + hauteurNecessaire > pdf.internal.pageSize.getHeight() - 60) {
      pdf.addPage();
      y = 40;
    }
  };

  // Titre de l'examen + statut
  verifierSaut(16);
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(11);
  pdf.setTextColor(30, 30, 30);
  pdf.text(ex.type || "Examen", marginX, y);

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(9);
  pdf.setTextColor(...(estRealise ? [46, 125, 50] : [230, 140, 0]));
  pdf.text(estRealise ? "✔ Réalisé" : "⏳ En attente", pageWidth - marginX, y, { align: "right" });
  y += 15;

  // Métadonnées (dates)
  const meta = [];
  if (ex.dateDemande) meta.push(`Demandé le ${ex.dateDemande}`);
  if (ex.dateRealisation) meta.push(`Réalisé le ${ex.dateRealisation}`);
  if (meta.length > 0) {
    verifierSaut(13);
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(9);
    pdf.setTextColor(110, 110, 110);
    pdf.text(meta.join("    "), marginX, y);
    y += 15;
  }

  // Commentaire de la demande
  if (ex.commentaire) {
    pdf.setFont("helvetica", "italic");
    pdf.setFontSize(9.5);
    pdf.setTextColor(70, 70, 70);
    const lignesCom = pdf.splitTextToSize(`Commentaire : ${ex.commentaire}`, maxWidth);
    lignesCom.forEach(ligne => {
      verifierSaut(13);
      pdf.text(ligne, marginX, y);
      y += 13;
    });
  }

  // Compte-rendu (peut être long, multi-lignes)
  if (ex.compteRendu) {
    verifierSaut(14);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(9.5);
    pdf.setTextColor(50, 50, 50);
    pdf.text("Compte-rendu :", marginX, y);
    y += 13;

    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(9.5);
    pdf.setTextColor(40, 40, 40);
    const lignesCR = pdf.splitTextToSize(ex.compteRendu, maxWidth);
    lignesCR.forEach(ligne => {
      verifierSaut(13);
      pdf.text(ligne, marginX, y);
      y += 13;
    });
  }

  return y + 8;
}
function addTitreSection(pdf, titre, y, marginX, pageWidth, bleu) {
  if (y > pdf.internal.pageSize.getHeight() - 100) {
    pdf.addPage();
    y = 40;
  }
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(13);
  pdf.setTextColor(...bleu);
  pdf.text(titre, marginX, y);
  y += 8;
  pdf.setDrawColor(...bleu);
  pdf.setLineWidth(0.8);
  pdf.line(marginX, y, pageWidth - marginX, y);
  return y + 16;
}

function addBlock(pdf, titre, contenu, y, marginX, pageWidth, bleu) {
  y = addTitreSection(pdf, titre, y, marginX, pageWidth, bleu);

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(10);
  pdf.setTextColor(40, 40, 40);

  const maxWidth = pageWidth - marginX * 2;
  const lignes = pdf.splitTextToSize(contenu || "—", maxWidth);

  lignes.forEach(ligne => {
    if (y > pdf.internal.pageSize.getHeight() - 60) {
      pdf.addPage();
      y = 40;
    }
    pdf.text(ligne, marginX, y);
    y += 13;
  });

  return y + 14;
}

function addListeTable(pdf, titre, items, statutFait, statutFaitAff, champDateRealise, champCommentRealise, y, marginX, pageWidth, bleu) {
  y = addTitreSection(pdf, titre, y, marginX, pageWidth, bleu);
  if (!items || items.length === 0) {
    pdf.setFont("helvetica", "italic");
    pdf.setFontSize(10);
    pdf.setTextColor(120, 120, 120);
    pdf.text("Aucune entrée enregistrée.", marginX, y);
    return y + 24;
  }
  pdf.autoTable({
    startY: y,
    margin: { left: marginX, right: marginX },
    head: [["Libellé", "Statut", "Demandé le", `${statutFaitAff} le`, "Commentaire"]],
    body: items.map(it => [
      it.product || "—",
      (it.status === statutFait) ? "Fait" : "En attente",
      it.createdAt || "—",
      it[champDateRealise] || "—",
      it[champCommentRealise] || it.comment || "—"
    ]),
    styles: { fontSize: 8, cellPadding: 3 },
    headStyles: { fillColor: bleu, textColor: 255 },
    theme: "grid"
  });
  return pdf.lastAutoTable.finalY + 20;
}

function afficherBulle(message, typeBulle){

  if(window.parent === window){

    console.warn("afficherBulle appelée sans parent, message perdu :", message);

    return;

  }

  window.parent.postMessage(

    {
      source:"notification-bulle",
      message,
      typeBulle
    },

    ORIGINE_PARENT_BULLE

  );

}


/* relais : si ce code lui-même iframe d'autres codes qui
   demandent une bulle, on transmet plus haut à notre tour */

if (!window.__bulleRelaisInit) {

  window.addEventListener("message", (event) => {

    if (event.origin !== "junior2704.github.io/GestUrg2") {
        return;

    if (
      event.data &&
      event.data.source === "notification-bulle" &&
      window.parent !== window
    ) {

  });
}
