<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nettoyage PDFs</title>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h2>Nettoyage des PDF expirés...</h2>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",
      authDomain: "urgences-a8ed4.firebaseapp.com",
      projectId: "urgences-a8ed4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function nettoyerPDFs() {
      const now = new Date();
      const uneSemaine = 7 * 24 * 60 * 60 * 1000;

      const snapshot = await db.collection("liens_pdf").get();
      let count = 0;
      for (const doc of snapshot.docs) {
        const data = doc.data();
        if (data.dateCreation?.toDate) {
          const age = now - data.dateCreation.toDate();
          if (age > uneSemaine) {
            await doc.ref.delete();
            count++;
          }
        }
      }
      document.body.innerHTML += `<p>✅ ${count} lien(s) supprimé(s).</p>`;
    }

    async function nettoyerAccueil1() {
  try {
    const snapshot = await getDocs(collection(db, "accueil-1"));

    if (snapshot.empty) {
      console.log("📭 La collection accueil-1 est vide.");
      return;
    }

    // Trouver le ticket TERMINÉ avec le numéro le plus élevé
    let docAConserver = null;
    let numeroMax = -Infinity;

    snapshot.forEach((documentSnap) => {
      const data = documentSnap.data();

      // On ne traite QUE les tickets terminés
      if (data.statut !== "termine") {
        return;
      }

      const numero = Number(data.numero);

      if (!isNaN(numero) && numero > numeroMax) {
        numeroMax = numero;
        docAConserver = documentSnap;
      }
    });

    // Aucun ticket terminé
    if (!docAConserver) {
      console.log("ℹ️ Aucun ticket avec statut = termine.");
      return;
    }

    console.log(
      `✅ Conservation du ticket terminé ${docAConserver.id} avec numéro ${numeroMax}`
    );

    // Supprimer uniquement les autres tickets TERMINÉS
    const suppressions = [];

    snapshot.forEach((documentSnap) => {
      const data = documentSnap.data();

      // On ne supprime QUE les tickets terminés
      if (
        data.statut === "termine" &&
        documentSnap.id !== docAConserver.id
      ) {
        suppressions.push(
          deleteDoc(doc(db, "accueil-1", documentSnap.id))
        );
      }
    });

    await Promise.all(suppressions);

    console.log(
      `🗑️ ${suppressions.length} ticket(s) terminé(s) supprimé(s).`
    );

  } catch (error) {
    console.error("❌ Erreur nettoyage accueil-1 :", error);
  }
}

    nettoyerPDFs();
    nettoyerAccueil1();
  </script>
</body>
</html>
