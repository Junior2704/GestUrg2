<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal NFC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   TOKENS
========================================================= */

:root{
    --metal-1:#2b303c;
    --metal-2:#14161c;
    --metal-edge:#454d5f;

    --accent:#2f9bff;
    --accent-soft:#8fd0ff;
    --accent-glow:rgba(47,155,255,.55);

    --success:#22c55e;
    --success-glow:rgba(34,197,94,.5);

    --error:#f43f5e;
    --error-glow:rgba(244,63,94,.5);

    --state-color:var(--accent);
    --state-glow:var(--accent-glow);

    --card-1:#fbfbfe;
    --card-2:#e4e9f1;
    --ink:#10131a;
    --muted:#7b8494;

    --ease-out:cubic-bezier(.16,.84,.32,1);
    --ease-elastic:cubic-bezier(.34,1.56,.64,1);
}

*{ box-sizing:border-box; }

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:transparent !important;
    overflow:hidden;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Manrope', -apple-system, 'Segoe UI', sans-serif;
}


/* =========================================================
   SCENE
========================================================= */

.stage{
    position:relative;
    width:min(420px, 90vw);
    height:min(420px, 90vh);
    display:flex;
    align-items:center;
    justify-content:center;
}

.floor{
    position:absolute;
    left:50%;
    bottom:16%;
    width:190px;
    height:26px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.28), transparent 72%);
    filter:blur(2px);
    z-index:1;
}


/* =========================================================
   CHAMP NFC (ondes d'attente)
========================================================= */

.field-wrap{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
    opacity:1;
    transform:scale(1);
    transition:opacity .4s var(--ease-out), transform .5s var(--ease-out);
}

.field {
    position: absolute;
    left: 45%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 270px;
    height: 270px;
}

.wave{
    position:absolute;
    left:50%;
    top:50%;
    width:76px;
    height:76px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1.5px solid var(--accent-soft);
    opacity:0;
}

@media (prefers-reduced-motion:no-preference){
    .wave{ animation:wavePulse 2.6s infinite cubic-bezier(.2,.65,.3,1); }
    .wave:nth-child(2){ animation-delay:.85s; }
    .wave:nth-child(3){ animation-delay:1.7s; }
}

@keyframes wavePulse{
    0%   { width:70px; height:70px; opacity:.6; border-width:2px; }
    70%  { width:270px; height:270px; opacity:0; border-width:.5px; }
    100% { width:270px; height:270px; opacity:0; }
}


/* =========================================================
   LECTEUR
========================================================= */

.reader-orbit{
    position:absolute;
    left:45%;
    top:50%;
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
    z-index:5;
    transition:transform .55s var(--ease-out), opacity .55s var(--ease-out);
}

.reader{
    position:relative;
    width:148px;
    height:196px;
 border-radius:30px; 
    background:linear-gradient(150deg, var(--metal-1), var(--metal-2) 70%);
    box-shadow:
        0 22px 46px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.14),
        inset 0 -3px 10px rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
}

@media (prefers-reduced-motion:no-preference){
    .reader{ animation:breathe 4.2s ease-in-out infinite; }
}

@keyframes breathe{
    0%,100%{ transform:scale(1); }
    50%    { transform:scale(1.018); }
}

/* liseré métallique + halo de contour */
.reader::before{
    content:"";
    position:absolute;
    inset:-1.5px;
    border-radius:32px;
    padding:1.5px;
    background:linear-gradient(155deg, var(--metal-edge), rgba(255,255,255,.02) 40%, var(--metal-edge));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

.reader::after{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:38px;
    background:radial-gradient(circle at 50% 38%, var(--state-glow), transparent 68%);
    opacity:.65;
    transition:background .4s ease;
    z-index:-1;
}

/* diode d'état */
.led{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:24px;
    height:6px;
    border-radius:6px;
    background:var(--state-color);
    box-shadow:0 0 10px var(--state-glow), 0 0 2px rgba(255,255,255,.6);
    transition:background .35s ease, box-shadow .35s ease;
}

@media (prefers-reduced-motion:no-preference){
    .led{ animation:ledBreathe 4.2s ease-in-out infinite; }
}

@keyframes ledBreathe{
    0%,100%{ opacity:.65; }
    50%    { opacity:1; }
}

/* écran / zone de contact */
.reader-face{
    width:84px;
    height:84px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle, rgba(47,155,255,.22), rgba(47,155,255,.05) 58%, transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}

.nfc-icon{
    width:38px;
    height:38px;
    overflow:visible;
}

.nfc-icon .dot{
    fill:var(--accent-soft);
    filter:drop-shadow(0 0 4px var(--accent-glow));
}

.nfc-icon .arc{
    fill:none;
    stroke:var(--accent-soft);
    stroke-width:2.6;
    stroke-linecap:round;
    filter:drop-shadow(0 0 3px var(--accent-glow));
}

.nfc-icon .arc:nth-child(3){ opacity:.85; }
.nfc-icon .arc:nth-child(4){ opacity:.55; }

/* anneau de lecture (spinner) */
/* anneau de lecture (spinner) */
.reader-ring{
    position:absolute;
    /* On centre l'élément absolument dans son parent flex */
    top: 0;
    bottom: 0;
    left: 100px;
    right: 0;
    margin: auto;
    
    /* On force des dimensions parfaitement carrées */
    width: 114px; 
    height: 114px;
    border-radius:50%;

    border:3px solid rgba(47,155,255,.15);
    border-top-color:var(--accent-soft);

    opacity:0;
    transition:opacity .25s ease;

    box-sizing:border-box;
}

@media (prefers-reduced-motion:no-preference){
    .reader-ring{
        animation:spin .8s linear infinite;
    }
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}
/* impact / flash de contact */
.impact{
    position:absolute;
    left:50%;
    top:50%;
    width:14px;
    height:14px;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(.2);
    background:radial-gradient(circle, #fff, var(--accent-soft) 45%, transparent 72%);
    opacity:0;
    z-index:8;
}


/* =========================================================
   BADGE
========================================================= */

.card-orbit{
    position:absolute;
    left:50%;
    top:50%;
    z-index:9;
    transform:translate(-50%,-50%);
    opacity:1;
    transition:opacity .3s ease, transform .3s var(--ease-out);
}

.card{
    position:relative;
    width:154px;
    height:97px;
    border-radius:15px;
	
    margin-left:10px;
    background:linear-gradient(150deg, var(--card-1), var(--card-2));
    box-shadow:
        0 16px 34px rgba(10,15,25,.28),
        inset 0 1px 0 #fff;
    overflow:hidden;
}

@media (prefers-reduced-motion:no-preference){
    .card{ animation:cardLoop 3.6s infinite; }
}

@keyframes cardLoop{
    0%   { transform:translate(-165px,6px) rotate(-7deg); }
    12%  { transform:translate(-165px,-2px) rotate(-7deg); }
    42%  { transform:translate(-88px,-10px) rotate(-4deg); }
    58%  { transform:translate(-30px,2px) rotate(-1.5deg); }
    64%  { transform:translate(-28px,2px) rotate(-1.5deg) scale(1.035); }
    72%  { transform:translate(-30px,2px) rotate(-1.5deg) scale(1); }
    88%  { transform:translate(-100px,-8px) rotate(-5deg); }
    100% { transform:translate(-165px,6px) rotate(-7deg); }
}

.card-shine{
    position:absolute;
    inset:0;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.75) 46%, transparent 60%);
    transform:translateX(-120%);
}

@media (prefers-reduced-motion:no-preference){
    .card-shine{ animation:shine 3.6s infinite; }
}

@keyframes shine{
    0%,55%{ transform:translateX(-120%); }
    72%   { transform:translateX(120%); }
    100%  { transform:translateX(120%); }
}

.chip{
    position:absolute;
    left:17px;
    top:37px;
    width:28px;
    height:22px;
    border-radius:5px;
    background:linear-gradient(150deg, #f5d878, #d9a93b);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.8), 0 2px 4px rgba(0,0,0,.15);
}

.chip::before,.chip::after{
    content:"";
    position:absolute;
    background:rgba(120,80,0,.35);
}
.chip::before{ width:100%; height:1px; top:50%; left:0; }
.chip::after{ height:100%; width:1px; left:50%; top:0; }

.card-line{
    position:absolute;
    right:16px;
    height:5px;
    border-radius:10px;
    background:#d6dce4;
}
.card-line.l1{ top:40px; width:50px; }
.card-line.l2{ top:52px; width:36px; }
.card-line.l3{ top:64px; width:44px; }

.card-band{
    position:absolute;
    left:0; right:0; top:0;
    height:20px;
    background:linear-gradient(90deg, #0072d1, #17a8ff);
}


/* =========================================================
   RESULTAT
========================================================= */

.result-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-right: 10%; /* <-- AJOUTER CECI pour compenser le décalage à 45% */
    z-index: 20;
    opacity: 0;
    transform: scale(.72);
    pointer-events: none;
    transition: opacity .4s var(--ease-out), transform .5s var(--ease-out);
}

.result-circle{
    position:relative;
    width:148px;
    height:148px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    box-shadow:0 22px 48px rgba(0,0,0,.2);
    color:var(--state-color);
}

.result-circle::before{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:4px solid currentColor;
    opacity:0;
}

.result-icon{
    width:70px;
    height:70px;
}

.result-icon path{
    fill:none;
    stroke:currentColor;
    stroke-width:5.5;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.icon-check{ stroke-dasharray:40; stroke-dashoffset:40; }
.icon-cross-a,.icon-cross-b{ stroke-dasharray:30; stroke-dashoffset:30; }

.result-text{
    margin-top:26px;
    font-size:21px;
    font-weight:800;
    letter-spacing:.2px;
    color:var(--accent);
    opacity:0;
    transform:translateY(10px);
}

.result-sub{
    margin-top:4px;
    font-size:13px;
    font-weight:600;
    color:rgba(255,255,255,.68);
    opacity:0;
    transform:translateY(8px);
}


/* =========================================================
   PARTICULES
========================================================= */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:25;
}

.particle{
    position:absolute;
    left:45%;
    top:50%;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--state-color);
    opacity:0;
}


/* =========================================================
   ETATS
========================================================= */

.stage[data-state="tapping"] .field-wrap,
.stage[data-state="success"] .field-wrap,
.stage[data-state="error"] .field-wrap{
    opacity:0;
    transform:scale(.82);
}

.stage[data-state="tapping"] .card-orbit,
.stage[data-state="success"] .card-orbit,
.stage[data-state="error"] .card-orbit{
    opacity:0;
    transform:translate(-50%,-50%) scale(.55);
}

.stage[data-state="tapping"] .reader-orbit{
    transform:translate(-50%,-50%) scale(.95);
    opacity:.75;
}

.stage[data-state="success"] .reader-orbit,
.stage[data-state="error"] .reader-orbit{
    transform:translate(-50%,-50%) scale(.82);
    opacity:.28;
}

.stage[data-state="tapping"] .reader-ring{ opacity:1; }

.stage[data-state="tapping"] .impact{
    animation:impactBurst .6s var(--ease-out);
}

@keyframes impactBurst{
    0%  { opacity:0; transform:translate(-50%,-50%) scale(.2); }
    18% { opacity:1; }
    60% { opacity:.45; transform:translate(-50%,-50%) scale(3.4); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(4.4); }
}

.stage[data-state="tapping"] .led{
    background:#fff;
    box-shadow:0 0 12px #fff, 0 0 20px var(--accent);
    animation:ledFlash .16s steps(1) infinite;
}

@keyframes ledFlash{ 50%{ opacity:.2; } }

.stage[data-state="success"] .led,
.stage[data-state="error"] .led{
    animation:none;
    opacity:1;
}

/* couleurs d'etat */
.stage[data-state="success"]{ --state-color:var(--success); --state-glow:var(--success-glow); }
.stage[data-state="error"]  { --state-color:var(--error);   --state-glow:var(--error-glow); }

/* panneau resultat */
.stage[data-state="success"] .result-wrap,
.stage[data-state="error"] .result-wrap{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
}

.stage[data-state="success"] .result-circle{
    animation:resultAppear .55s var(--ease-elastic);
}

.stage[data-state="error"] .result-circle{
    animation:resultAppear .45s var(--ease-out);
	animation:iconShake .42s ease;
}

@keyframes resultAppear{
    0%{
        transform:scale(.45) rotate(-180deg);
        opacity:0;
    }

    60%{
        transform:scale(1.06) rotate(8deg);
        opacity:1;
    }

    100%{
        transform:scale(1) rotate(0deg);
        opacity:1;
    }
}

.stage[data-state="success"] .result-circle::before,
.stage[data-state="error"] .result-circle::before{
    animation:ringPulse .8s ease-out .05s forwards;
}
@keyframes ringPulse{
    from{ transform:scale(.7); opacity:.7; }
    to{ transform:scale(1.3); opacity:0; }
}

.stage[data-state="success"] .icon-check{
    animation:draw .5s .18s var(--ease-out) forwards;
}
.stage[data-state="error"] .icon-cross-a{
    animation:draw .3s .1s ease forwards;
}
.stage[data-state="error"] .icon-cross-b{
    animation:draw .3s .26s ease forwards;
}
@keyframes draw{ to{ stroke-dashoffset:0; } }

.stage[data-state="success"] .result-text,
.stage[data-state="error"] .result-text{
    animation:textIn .5s .3s var(--ease-out) forwards;
}
.stage[data-state="success"] .result-sub,
.stage[data-state="error"] .result-sub{
    animation:textIn .5s .4s var(--ease-out) forwards;
}
@keyframes textIn{ to{ opacity:1; transform:translateY(0); } }


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:500px){
    .reader{ width:128px; height:170px; }
    .card{ width:134px; height:84px; }
    .result-circle{ width:132px; height:132px; }
}

</style>
</head>

<body>

<div class="stage" id="stage" data-state="idle">

    <div class="floor"></div>

    <!-- CHAMP NFC -->
    <div class="field-wrap">
        <div class="field">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>

    <!-- LECTEUR -->
    <div class="reader-orbit">
        <div class="reader">
            <div class="led"></div>
            <div class="reader-ring"></div>
            <div class="reader-face">
                <svg class="nfc-icon" viewBox="0 0 40 40" aria-hidden="true">
                    <circle class="dot" cx="14" cy="29" r="2.4"></circle>
                    <path class="arc" d="M18 29a6 6 0 0 1 6-6"></path>
                    <path class="arc" d="M13 29a11 11 0 0 1 11-11"></path>
                    <path class="arc" d="M8 29a16 16 0 0 1 16-16"></path>
                </svg>
            </div>
        </div>
        <div class="impact"></div>
    </div>

    <!-- BADGE -->
    <div class="card-orbit">
        <div class="card">
            <div class="card-band"></div>
            <div class="chip"></div>
            <div class="card-line l1"></div>
            <div class="card-line l2"></div>
            <div class="card-line l3"></div>
            <div class="card-shine"></div>
        </div>
    </div>

    <!-- RESULTAT -->
    <div class="result-wrap">
        <div class="result-circle">
            <svg class="result-icon" viewBox="0 0 52 52" aria-hidden="true">
                <path class="icon-check" id="iconCheck" d="M14 27 L22 35 L38 17"></path>
                <path class="icon-cross-a" id="iconCrossA" d="M16 16 L36 36"></path>
                <path class="icon-cross-b" id="iconCrossB" d="M36 16 L16 36"></path>
            </svg>
        </div>
        <div class="result-text" id="resultText"></div>
        <div class="result-sub" id="resultSub"></div>
    </div>

    <div class="particles" id="particles"></div>

    <div id="srStatus" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);"></div>

</div>


<script>
/* =========================================================
   CONTROLEUR ANIMATION NFC
   ---------------------------------------------------------
   Système de validation inchangé : la page parente déclenche
   le résultat via postMessage.

       iframe.contentWindow.postMessage("Valide", "*");
       iframe.contentWindow.postMessage("Invalide", "*");

   Valeurs acceptées : "Valide" / "valide" / "VALID"
                       "Invalide" / "invalide" / "INVALID"
========================================================= */

(function(){

    const stage       = document.getElementById("stage");
    const resultText   = document.getElementById("resultText");
    const resultSub    = document.getElementById("resultSub");
    const srStatus      = document.getElementById("srStatus");
    const particlesBox = document.getElementById("particles");
    const iconCheck    = document.getElementById("iconCheck");
    const iconCrossA   = document.getElementById("iconCrossA");
    const iconCrossB   = document.getElementById("iconCrossB");

    let timers = [];

    function clearTimers(){
        timers.forEach(clearTimeout);
        timers = [];
    }

    function setState(state){
        // force le redémarrage propre des animations liées à l'état,
        // même si un nouveau message arrive pendant une transition en cours.
        stage.dataset.state = "idle";
        // eslint-disable-next-line no-unused-expressions
        stage.offsetWidth; // reflow
        requestAnimationFrame(() => {
            stage.dataset.state = state;
        });
    }

    function spawnParticles(count, color){
        particlesBox.innerHTML = "";

        for (let i = 0; i < count; i++){
            const p = document.createElement("div");
            p.className = "particle";

            const angle    = (Math.PI * 2 * i) / count + Math.random() * .4;
            const distance = 70 + Math.random() * 55;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance - 10;
            const delay = Math.random() * 80;

            p.style.background = color;
            p.style.animation  = `particleOut .85s cubic-bezier(.2,.7,.3,1) ${delay}ms forwards`;
            p.style.setProperty("--dx", dx + "px");
            p.style.setProperty("--dy", dy + "px");

            particlesBox.appendChild(p);
        }
    }

    // keyframes des particules injectées dynamiquement (dépendent de --dx/--dy)
    const styleTag = document.createElement("style");
    styleTag.textContent = `
        @keyframes particleOut{
            0%   { opacity:1; transform:translate(-50%,-50%) scale(1); }
            100% { opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); }
        }
    `;
    document.head.appendChild(styleTag);

    function afficherResultat(valide){

        clearTimers();

        // réinitialise le tracé des icônes pour un rejouage propre
        [iconCheck, iconCrossA, iconCrossB].forEach(el => {
            el.style.animation = "none";
            el.getBoundingClientRect();
            el.style.animation = "";
        });

        setState("tapping");

        timers.push(setTimeout(() => {

            resultText.textContent = valide ? "Badge reconnu" : "Badge refusé";
            resultSub.textContent  = valide ? "Accès autorisé" : "Accès refusé";
            srStatus.textContent   = resultText.textContent;

            setState(valide ? "success" : "error");

            spawnParticles(
                valide ? 12 : 7,
                valide ? "#22c55e" : "#f43f5e"
            );

        }, 620));

        timers.push(setTimeout(resetAnimation, 3400));
    }

    function resetAnimation(){
        clearTimers();
        setState("idle");
        resultText.textContent = "";
        resultSub.textContent  = "";
        particlesBox.innerHTML = "";
    }

    window.addEventListener("message", function(event){

        const message = event.data;

        if (message === "Valide" || message === "valide" || message === "VALID"){
            afficherResultat(true);
        }
        else if (message === "Invalide" || message === "invalide" || message === "INVALID"){
            afficherResultat(false);
        }

    });

    // aide au développement local (n'affecte pas le contrat postMessage)
    window.testNFC = {
        valid:   () => afficherResultat(true),
        invalid: () => afficherResultat(false),
        reset:   resetAnimation
    };

})();
</script>

</body>
</html>
