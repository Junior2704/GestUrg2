<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration des demandes · GestUrg2</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172b3a;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}.top{padding:16px 24px;background:#fff;border-bottom:1px solid #dce5ee;display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{max-width:1400px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #dce5ee;border-radius:16px;padding:18px;box-shadow:0 5px 22px #1231}.layout{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:16px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,select,input,textarea{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbd7e2}button{background:#0078d4;color:white;border:0;font-weight:700;cursor:pointer}button.secondary{background:#edf3f8;color:#234}button.danger{background:#b42318}input,select,textarea{width:100%;background:white}.list{display:grid;gap:8px;max-height:70vh;overflow:auto}.item{border:1px solid #dce5ee;padding:12px;border-radius:12px;cursor:pointer}.item.active{border-color:#0078d4;background:#eff7ff}.muted{color:#607386;font-size:13px}.badge{font-size:12px;background:#edf3f8;padding:4px 8px;border-radius:20px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.hidden{display:none!important}.messages{max-height:35vh;overflow:auto}.message{background:#f3f7fb;border-radius:10px;padding:12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.message.internal{background:#fff6df;border:1px solid #f0d99a}label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}.field{margin:10px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:8px 0}a{color:#005ea2}@media(max-width:850px){.layout{grid-template-columns:1fr}.list{max-height:35vh}.split{grid-template-columns:1fr}}</style></head><body><header class="top"><strong>GestUrg2 · Administration des demandes</strong><div class="row"><span id="who" class="muted"></span><button id="logout" class="secondary hidden">Déconnexion</button></div></header><main class="wrap"><section id="login" class="card" style="max-width:480px;margin:40px auto"><h1>Connexion agent</h1><p class="muted">Connectez-vous avec un compte GestUrg2 habilité à la gestion des demandes.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="username" required><label>Mot de passe GestUrg2</label><input id="password" type="password" autocomplete="current-password" required><button style="margin-top:14px">Se connecter</button></form><p id="loginError" class="muted"></p></section><section id="app" class="hidden"><div class="layout"><section class="card"><div class="row"><h1>Demandes</h1><button id="refresh" class="secondary">Actualiser</button></div><input id="search" placeholder="Rechercher référence, demandeur, patient…" style="margin-top:14px"><div class="filters"><select id="scope"><option value="ouvertes">Toutes les non clôturées</option><option value="miennes">Mes demandes</option><option value="nonattribuees">Non attribuées</option><option value="toutes">Toutes</option></select><select id="status"><option value="">Tous statuts</option><option value="nouvelle">Nouvelle</option><option value="en_cours">En cours</option><option value="en_attente_demandeur">En attente du demandeur</option><option value="reponse_recue">Réponse reçue</option><option value="cloturee">Clôturée</option></select></div><div id="list" class="list"></div></section><section class="card"><div id="empty"><h2>Sélectionnez une demande</h2><p class="muted">Le détail, la messagerie et les actions apparaîtront ici.</p></div><div id="detail" class="hidden"><div class="row"><div><h1 id="dtitle"></h1><p id="dmeta" class="muted"></p></div><button id="assign" class="secondary">M'attribuer</button></div><div class="split"><div><label>Statut</label><select id="dstatus"><option value="nouvelle">Nouvelle</option><option value="en_cours">En cours</option><option value="en_attente_demandeur">En attente du demandeur</option><option value="reponse_recue">Réponse reçue</option><option value="cloturee">Clôturée</option></select></div><div><label>Priorité (affichage)</label><select id="priority"><option value="normale">Normale</option><option value="haute">Haute</option><option value="urgente">Urgente</option></select></div></div><div class="field"><label>Demandeur</label><div id="requester" class="message"></div></div><div class="field"><label>Patient déclaré</label><div id="patient" class="message"></div><button id="openPatient" class="secondary" type="button">Ouvrir la fiche patient</button></div><div class="field"><label>Demande</label><div id="description" class="message"></div></div><div class="field"><label>Rattacher à un patient GestUrg2 (après vérification)</label><div class="split"><input id="patientId" placeholder="ID Firestore patient"><input id="hospitalisationId" placeholder="ID hospitalisation (facultatif)"></div><button id="linkPatient" class="secondary" style="margin-top:8px">Enregistrer le rattachement</button></div><div class="field"><label>Messages de l'espace demandeur</label><div id="messages" class="messages"></div><textarea id="reply" rows="3" maxlength="5000" placeholder="Répondre au demandeur…"></textarea><button id="sendReply" style="margin-top:8px">Envoyer la réponse</button></div><div class="field"><label>Note interne (visible uniquement par les agents)</label><textarea id="internalNote" rows="2" maxlength="5000" placeholder="Note interne…"></textarea><button id="saveNote" class="secondary" style="margin-top:8px">Ajouter une note interne</button></div><div class="field"><label>Partager un document existant</label><input id="documentId" placeholder="ID du document Firestore"><textarea id="documentMessage" rows="2" placeholder="Message accompagnant le document"></textarea><button id="shareDoc" class="secondary" style="margin-top:8px">Créer un lien sécurisé de 7 jours</button></div><div class="field"><label>Motif / résumé de clôture</label><textarea id="closeReason" rows="2" placeholder="Obligatoire pour clôturer"></textarea><button id="saveStatus" style="margin-top:8px">Enregistrer le statut</button></div><p id="detailMsg" class="muted" role="status"></p></div></section></div></section></main>
<script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{firebaseConfig,API_BASE}from'./config.js';const app=initializeApp(firebaseConfig);const auth=getAuth(app);const $=id=>document.getElementById(id);let current=null,items=[];function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,body){const u=auth.currentUser;if(!u)throw Error('Session expirée');const token=await u.getIdToken();const r=await fetch(API_BASE+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Erreur serveur');return j}function msg(s){$('detailMsg').textContent=s}async function loadList(){try{const scope=$('scope').value;const p=new URLSearchParams();if(scope!=='ouvertes'&&scope!=='toutes')p.set('scope',scope);if(scope==='ouvertes')p.set('scope','ouvertes');if(scope==='toutes')p.set('scope','toutes');if($('status').value)p.set('statut',$('status').value);const j=await api('/admin?'+p.toString());items=j.demandes;renderList()}catch(e){$('list').textContent=e.message}}function renderList(){const q=$('search').value.toLowerCase();const data=items.filter(d=>`${d.reference} ${d.demandeur?.nom} ${d.demandeur?.prenom} ${d.patient?.nom} ${d.patient?.prenom} ${d.motif}`.toLowerCase().includes(q));$('list').innerHTML=data.map(d=>`<div class="item ${current===d.id?'active':''}" data-id="${esc(d.id)}"><div class="row"><strong>${esc(d.reference)}</strong><span class="badge">${esc(d.statut)}</span></div><p>${esc(d.motif)} · ${esc(d.demandeur?.prenom)} ${esc(d.demandeur?.nom)}</p><div class="muted">Patient : ${esc((d.patient?.prenom||'')+' '+(d.patient?.nom||''))||'Non précisé'} · ${esc(d.assigneNom||'Non attribuée')}</div></div>`).join('')||'<p class="muted">Aucune demande.</p>';document.querySelectorAll('.item[data-id]').forEach(el=>el.onclick=()=>openDetail(el.dataset.id))}async function openDetail(id){try{const j=await api('/admin/'+encodeURIComponent(id));current=id;const d=j.demande;$('empty').classList.add('hidden');$('detail').classList.remove('hidden');$('dtitle').textContent=d.reference;$('dmeta').textContent=`Créée : ${d.creeLe?.toDate?d.creeLe.toDate().toLocaleString('fr-FR'):d.creeLe?.toDate?.()||''} · Affectation : ${d.assigneNom||'Non attribuée'}`;$('dstatus').value=d.statut;$('priority').value=d.priorite||'normale';$('requester').textContent=`${d.demandeur?.prenom||''} ${d.demandeur?.nom||''} · ${d.demandeur?.email||''} · ${d.demandeur?.telephone||''} · Qualité : ${d.demandeur?.qualite||''}`;$('patient').textContent=d.patient?.concerne===false?'Aucun patient déclaré':`${d.patient?.prenom||''} ${d.patient?.nom||''} · Né(e) le ${d.patient?.dateNaissance||'non précisée'} · CIP : ${d.patient?.cip||'non connu'} · Rapprochement : ${d.patient?.rapprochementStatut||'à vérifier'}`;$('description').textContent=d.description||'';$('patientId').value=d.patient?.patientId||'';$('hospitalisationId').value=d.patient?.hospitalisationId||'';$('openPatient').disabled=!d.patient?.patientId;$('messages').innerHTML=j.messages.map(m=>`<div class="message"><strong>${esc(m.auteurLabel||m.auteurType)}</strong><div>${esc(m.texte)}</div><small class="muted">${esc(m.date||'')}</small></div>`).join('');renderList();msg('')}catch(e){msg(e.message)}}$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(x){$('loginError').textContent=x.message}};onAuthStateChanged(auth,u=>{ $('login').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);$('logout').classList.toggle('hidden',!u);$('who').textContent=u?.email||'';if(u)loadList()});$('logout').onclick=()=>signOut(auth);$('refresh').onclick=loadList;$('search').oninput=renderList;$('scope').onchange=loadList;$('status').onchange=loadList;$('assign').onclick=async()=>{try{await api('/admin/'+current+'/assigner',{uid:auth.currentUser.uid});msg('Demande attribuée.');await loadList();await openDetail(current)}catch(e){msg(e.message)}};$('sendReply').onclick=async()=>{try{await api('/admin/'+current+'/message',{texte:$('reply').value});$('reply').value='';await openDetail(current);msg('Réponse envoyée.')}catch(e){msg(e.message)}};$('saveNote').onclick=async()=>{try{await api('/admin/'+current+'/note-interne',{texte:$('internalNote').value});$('internalNote').value='';msg('Note interne enregistrée.')}catch(e){msg(e.message)}};$('openPatient').onclick=()=>{const pid=$('patientId').value.trim();if(!pid)return;const url='fiche.html?id='+encodeURIComponent(pid);if(window.parent!==window)window.parent.postMessage({type:'OPEN_TAB',title:'Fiche patient',url},'*');else window.open(url,'_blank','noopener')};$('loadDocs').onclick=async()=>{try{const j=await api('/admin/'+current+'/documents');$('documentId').innerHTML='<option value="">Sélectionner un document…</option>'+j.documents.map(d=>`<option value="${esc(d.id)}">${esc(d.type)} · ${esc(d.dateCreation)}${d.disponible?'':' (PDF non disponible)'}</option>`).join('');msg(j.documents.length+' document(s) trouvé(s).')}catch(e){msg(e.message)}};$('linkPatient').onclick=async()=>{try{await api('/admin/'+current+'/rattacher-patient',{patientId:$('patientId').value,hospitalisationId:$('hospitalisationId').value});await openDetail(current);msg('Rattachement enregistré.')}catch(e){msg(e.message)}};$('shareDoc').onclick=async()=>{try{if(!$('documentId').value)throw Error('Sélectionnez un document.');const j=await api('/admin/'+current+'/partager-document',{documentId:$('documentId').value,message:$('documentMessage').value});msg('Lien sécurisé créé et ajouté à la messagerie : '+j.url)}catch(e){msg(e.message)}};$('priority').onchange=async()=>{try{await api('/admin/'+current+'/priorite',{priorite:$('priority').value});await loadList();msg('Priorité mise à jour.')}catch(e){msg(e.message)}};$('saveStatus').onclick=async()=>{try{await api('/admin/'+current+'/statut',{statut:$('dstatus').value,motif:$('closeReason').value});await loadList();await openDetail(current);msg('Statut enregistré.')}catch(e){msg(e.message)}};</script></body></html>
