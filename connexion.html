<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connexion</title>
  <link rel="icon" type="image/jpeg" href="logog2.png">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserSessionPersistence,
    browserLocalPersistence,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // --- Config Firebase ---
  const firebaseConfig = {
    apiKey: "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",
    authDomain: "urgences-a8ed4.firebaseapp.com",
    projectId: "urgences-a8ed4"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
window.allerAdmin = async function () {
    window.location.href = "connexionadmin.html";
  }

const DERNIER_EMAIL_KEY = "gu2_dernierEmail";
const SESSION_EXPIRE_KEY = "gu2_sessionExpire";
const DUREE_SESSION_MS = 7 * 24 * 3600 * 1000; // 7 jours

let systemeBloque = false;
let badgeLoginEmail = null;
let badgeLoginUid = null;
let connexionManuelleEnCours = false; // évite le double appel de finaliserConnexion

// ➡️ Redirige vers la page principale
// (mobile → urgences_mobile, ordinateur → urgences)
// ➡️ Sauf si un paramètre ?page=... est présent dans l'URL : dans ce cas, priorité à cette page
function isMobileDevice() {
  const ua = navigator.userAgent;

  // iPad : ancien UA ("iPad") ou iPadOS 13+ (se présente comme "Macintosh" mais est tactile)
  const isIPad = /iPad/i.test(ua)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  // Les tablettes Android n'ont pas "Mobile" dans leur UA (les téléphones l'ont)
  const isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);

  // Tablettes → version bureau (shell.html)
  if (isIPad || isAndroidTablet) return false;

  // Téléphones uniquement
  return /iPhone|iPod|Android|webOS|BlackBerry|Windows Phone|Mobile/i.test(ua);
}
// 🔎 Logique commune post-authentification (mot de passe ET badge)
async function finaliserConnexion(user) {
  const ref = doc(db, "medecins", user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    const data = snap.data();

    // 🔴 Vérifie si le compte est marqué pour suppression
    if (data.supprime === true) {
      window.location.href = "suppressioncompte.html";
      return;
    }

    // 🔐 Vérifie si l'utilisateur doit changer son mot de passe
    if (data.doitChangerMDP === true) {
      window.location.href = "changer_mot_passe.html?from=obligatoire";
      return;
    }
  }

  const urlParams = new URLSearchParams(window.location.search);
  let pageDemandee = urlParams.get("page");

  if (pageDemandee) {
    // Nettoie une éventuelle extension .html déjà présente
    pageDemandee = pageDemandee.replace(/\.html$/i, "");
    window.location.href = `${pageDemandee}.html?uid=${user.uid}`;
  } else if (isMobileDevice()) {
    window.location.href = `fichemobile.html?uid=${user.uid}`;
  } else {
    window.location.href = `shell.html`;
  }
}

// 🈳 Traduction des erreurs Firebase (communes mot de passe / badge)
function traduireErreurConnexion(error) {
  switch (error.message) {
    case "Firebase: Error (auth/invalid-email).":
      return "Email invalide. Vérifiez l'adresse saisie.";
    case "Firebase: Error (auth/user-disabled).":
      return "Ce compte a été désactivé. Contactez un administrateur.";
    case "Firebase: Error (auth/user-not-found).":
      return "Aucun compte trouvé avec cet email.";
    case "Firebase: Error (auth/invalid-credential).":
      return "Couple email/mot de passe incorrect.";
    case "Firebase: Error (auth/missing-password).":
      return "Merci de saisir un mot de passe.";
    case "Firebase: Error (auth/too-many-requests).":
      return "Vous avez tenté de vous connecté trop de fois avec un mot de passe éronné. Merci de réessayer plus tard";
    case "Firebase: Error (auth/network-request-failed).":
      return "Problème de connexion réseau. Vérifiez votre connexion Internet.";
    default:
      return "Une erreur est survenue : " + error.message;
  }
}

  // --- Fonction de connexion (mot de passe) ---
window.seConnecter = async function () {
  if (systemeBloque) return;

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");
  const rester = document.getElementById("resterConnecte").checked;

  message.textContent = "";
  message.style.color = "red";

  // Réinitialise l'animation
  const animation = document.querySelector(".login-mdp-anim");

  connexionManuelleEnCours = true;

  try {
    // 🔐 Choix de la persistance AVANT la connexion
    await setPersistence(auth, rester ? browserLocalPersistence : browserSessionPersistence);

    // 🔐 Connexion utilisateur
    const userCredential = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    // ✅ Date d'expiration enregistrée seulement si la connexion a réussi
    if (rester) {
      localStorage.setItem(SESSION_EXPIRE_KEY, String(Date.now() + DUREE_SESSION_MS));
    } else {
      localStorage.removeItem(SESSION_EXPIRE_KEY);
    }

    // ✅ Animation de succès
    animation?.contentWindow.postMessage("Valide", "*");

    localStorage.setItem(DERNIER_EMAIL_KEY, email);

    // Laisse le temps à l'animation de jouer
    setTimeout(async () => {
      await finaliserConnexion(userCredential.user);
    }, 1500);

  } catch (error) {
    connexionManuelleEnCours = false;

    // ❌ Animation d'échec
    animation?.contentWindow.postMessage("Invalide", "*");

    message.textContent = traduireErreurConnexion(error);
  }
};

  // ==========================
  // 🪪 CONNEXION PAR BADGE
  // ==========================

  window.switchLoginTab = function (tab) {
    const isBadge = tab === "badge";

    document.getElementById("loginTabBadge").classList.toggle("active", isBadge);
    document.getElementById("loginTabPassword").classList.toggle("active", !isBadge);
    document.getElementById("loginPanelBadge").classList.toggle("active", isBadge);
    document.getElementById("loginPanelPassword").classList.toggle("active", !isBadge);

    document.getElementById("message").textContent = "";
    document.getElementById("badgeLoginError").textContent = "";

    if (isBadge) {
      document.getElementById("badgeLoginInput").value = "";
      setTimeout(focusBadgeLoginInput, 50);
    }
  };

  window.focusBadgeLoginInput = function () {
    if (systemeBloque) return;
    const panel = document.getElementById("loginPanelBadge");
    if (panel && panel.classList.contains("active")) {
      document.getElementById("badgeLoginInput").focus();
    }
  };

  // 🔎 Recherche l'utilisateur propriétaire du badge scanné
  window.rechercherBadge = async function () {
    if (systemeBloque) return;
    const input = document.getElementById("badgeLoginInput");
    const valeur = input.value.trim();
    const errorDiv = document.getElementById("badgeLoginError");
    errorDiv.textContent = "";

    if (!valeur) return;

    try {
      const q = query(collection(db, "medecins"), where("idBadge", "==", valeur));
      const snap = await getDocs(q);

      if (snap.empty) {
        document.querySelector('.login-badge-anim')
  .contentWindow
  .postMessage("Invalide", "*");
        errorDiv.textContent = "Badge non reconnu.";
        input.value = "";
        focusBadgeLoginInput();
        return;
      }

      const docSnap = snap.docs[0];
      const data = docSnap.data();

      badgeLoginEmail = data.email;
      badgeLoginUid = docSnap.id;

      input.value = "";
document.querySelector('.login-badge-anim')
  .contentWindow
  .postMessage("Valide", "*");
        setTimeout(() =>{
      document.getElementById("usbUserText").textContent = `Utilisateur : ${data.nom || data.email || ""}`;
      document.getElementById("usbPassword").value = "";
      document.getElementById("usbLoginError").textContent = "";
      document.getElementById("usbLoginModal").style.display = "flex";
      setTimeout(() => document.getElementById("usbPassword").focus(), 50);
    }, 2000);
    } catch (error) {
      document.querySelector('.login-badge-anim')
  .contentWindow
  .postMessage("Invalide", "*");
      console.error(error);
      errorDiv.textContent = "Erreur lors de la vérification du badge.";
      input.value = "";
      focusBadgeLoginInput();
    }
  };

  // ✔ Validation de la modale mot de passe (déclenchée après reconnaissance du badge)
  // 🔁 La case "Rester connecté" du badge est synchronisée avec celle du mot de passe
  window.validerUSBLogin = async function () {
    if (!badgeLoginEmail) return;

    const password = document.getElementById("usbPassword").value;
    const errorDiv = document.getElementById("usbLoginError");
    errorDiv.textContent = "";

    if (!password) {
      errorDiv.textContent = "Merci de saisir un mot de passe.";
      return;
    }

    connexionManuelleEnCours = true;

    try {
      const rester = document.getElementById("resterConnecteBadge").checked;
      await setPersistence(auth, rester ? browserLocalPersistence : browserSessionPersistence);
      const userCredential = await signInWithEmailAndPassword(auth, badgeLoginEmail, password);
      if (rester) {
        localStorage.setItem(SESSION_EXPIRE_KEY, String(Date.now() + DUREE_SESSION_MS));
      } else {
        localStorage.removeItem(SESSION_EXPIRE_KEY);
      }
      localStorage.setItem(DERNIER_EMAIL_KEY, badgeLoginEmail);
      document.getElementById("usbLoginModal").style.display = "none";
      await finaliserConnexion(userCredential.user);
    } catch (error) {
      connexionManuelleEnCours = false;
      errorDiv.textContent = traduireErreurConnexion(error);
      document.getElementById("usbPassword").value = "";
      document.getElementById("usbPassword").focus();
    }
  };

  // ❌ Annulation de la modale mot de passe badge
  window.annulerUSBLogin = function () {
    document.getElementById("usbLoginModal").style.display = "none";
    document.getElementById("usbPassword").value = "";
    document.getElementById("usbLoginError").textContent = "";
    badgeLoginEmail = null;
    badgeLoginUid = null;
    focusBadgeLoginInput();
  };

  // 🔧 Détermine l'onglet par défaut (badge ou mot de passe) selon la préférence
  // de l'utilisateur, retrouvée via le dernier email de connexion connu localement.
  async function appliquerOngletParDefaut() {
    const dernierEmail = localStorage.getItem(DERNIER_EMAIL_KEY);

    if (dernierEmail) {
      document.getElementById("email").value = dernierEmail;
    }

    let ongletParDefaut = "password";

    if (dernierEmail) {
      try {
        const q = query(collection(db, "medecins"), where("email", "==", dernierEmail));
        const snap = await getDocs(q);
        if (!snap.empty) {
          const pref = snap.docs[0].data()["préférenceConnexion"];
          if (pref === "badge") ongletParDefaut = "badge";
        }
      } catch (e) {
        console.warn("Impossible de récupérer la préférence de connexion :", e);
      }
    }

    switchLoginTab(ongletParDefaut);
  }
  async function checkFonctionnement() {
  try {
    const ref = doc(db, "referentiels", "fonctionnement");
    const snap = await getDoc(ref);

    console.log("🔥 Firestore snap exists:", snap.exists());
    console.log("🔥 Firestore data:", snap.data());

    if (!snap.exists()) {
      showSystemModal("Erreur système", "Document introuvable");
      return false;
    }

    const data = snap.data();

    // 🚨 DEBUG IMPORTANT
    const rawMode = data.mode ?? data.Mode ?? data.etat ?? data.status;
    console.log("🔥 MODE BRUT =", rawMode);

    const mode = String(rawMode || "").trim().toLowerCase();

    console.log("🔥 MODE NORMALISÉ =", mode);

    if (mode === "normal") return true;

    if (mode === "maintenance") {
      showSystemModal(
        "Maintenance en cours",
        "Le système est en maintenance. Merci de réessayer plus tard."
      );
      return false;
    }

    if (mode === "erreur") {
      showSystemModal(
        "Erreur système",
        "Accès bloqué pour cause d’erreur système."
      );
      return false;
    }

    showSystemModal(
      "Mode inconnu",
      "Valeur reçue : " + mode
    );

    return false;

  } catch (e) {
    console.error("🔥 FIRESTORE ERROR:", e);
    showSystemModal("Erreur Firestore", e.message);
    return false;
  }
}

document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    seConnecter();
  }
});

document.getElementById("badgeLoginInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    rechercherBadge();
  }
});

document.getElementById("usbPassword").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    validerUSBLogin();
  }
});


// 🔄 Synchronise les cases "Rester connecté" (badge + mot de passe)
document.querySelectorAll(".js-rester").forEach(cb => {
  cb.addEventListener("change", () => {
    document.querySelectorAll(".js-rester").forEach(autre => {
      autre.checked = cb.checked;
    });
  });
});

window.showSystemModal = function(title, text) {
  const modal = document.getElementById("systemModal");

  document.getElementById("systemModalTitle").textContent = title;
  document.getElementById("systemModalText").textContent = text;

  const icon = document.getElementById("systemModalIcon");
  const ICONES = {
    maintenance: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg>',
    erreur: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>',
    autre: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>'
  };
  icon.innerHTML = title.includes("Maintenance") ? ICONES.maintenance
                 : title.includes("Erreur") ? ICONES.erreur
                 : ICONES.autre;

  // 🔒 BLOQUAGE TOTAL INTERFACE
  document.body.classList.add("locked");

  modal.style.display = "flex";
};

window.addEventListener("DOMContentLoaded", async () => {
  await appliquerOngletParDefaut();

  const ok = await checkFonctionnement();

  // si pas OK → on bloque les boutons et la lecture de badge
  if (!ok) {
    systemeBloque = true;
    document.querySelectorAll("button").forEach(btn => {
      if (btn.textContent.includes("Se connecter") || btn.textContent.includes("Connexion")) {
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.style.cursor = "not-allowed";
      }
    });
    document.getElementById("badgeLoginInput").disabled = true;
    return;
  }

  // 🔁 Reconnexion automatique (session déjà ouverte : "rester connecté" ou onglet encore actif)
  onAuthStateChanged(auth, async (user) => {
    if (!user || systemeBloque || connexionManuelleEnCours) return;

    // Durée maximale de la session persistante (contrôle côté navigateur)
    const exp = Number(localStorage.getItem(SESSION_EXPIRE_KEY) || 0);
    if (exp && Date.now() > exp) {
      localStorage.removeItem(SESSION_EXPIRE_KEY);
      await signOut(auth);
      return;
    }

    await finaliserConnexion(user);
  });
});
</script>

  <style>
/* =====================================================================
   THÈME MODERNE HOSPITALIER — identité reprise de fiche.html
   ===================================================================== */
:root{

  --bg:#ffffff; --surface:#ffffff; --ink:#112336; --muted:#586a7e;
  --line:#d8e1ea; --line-soft:#e9eff5; --field:#f6f9fc;
  --primary:#0b6fa4; --primary-d:#085a86; --primary-soft:#e3f1f9;
  --ok:#16784a; --ok-soft:#e1f4e9;
  --late:#b92a30; --late-soft:#fdecec;
  --warn:#7a4f00; --warn-soft:#fff5da;
  --shadow:0 1px 2px rgba(17,35,54,.05), 0 8px 24px rgba(17,35,54,.07);
  --shadow-sm:0 1px 2px rgba(17,35,54,.06);
  --ring:0 0 0 4px rgba(11,111,164,.15);
  --safe-t:env(safe-area-inset-top,0px); --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px);
  --head-h:64px; --gutter:clamp(16px,3vw,32px);
}

  display:flex;flex-direction:column;overflow:hidden;

  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}

/* En-tête */
body > header{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:var(--head-h);
  padding:calc(8px + var(--safe-t)) calc(20px + var(--safe-r)) 8px calc(20px + var(--safe-l));
  background:#fff;border-bottom:1px solid var(--line);z-index:5;
}
.left-header{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.right-header{display:flex;align-items:center;gap:10px;flex:none}
.brand{
  width:38px;height:38px;flex:none;display:grid;place-items:center;
  color:#fff;background:linear-gradient(145deg,var(--primary),var(--primary-d));
  border-radius:11px;box-shadow:0 4px 10px rgba(11,111,164,.25);
}

.head-text{min-width:0;display:flex;flex-direction:column}
.head-kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.head-title{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.icon-button{
  appearance:none;width:44px;height:44px;flex:none;display:inline-grid;place-items:center;padding:0;margin:0;
  color:var(--primary);background:#fff;border:1px solid var(--line);border-radius:12px;cursor:pointer;touch-action:manipulation;
  transition:background .15s,border-color .15s;
}
.icon-button:active{background:var(--primary-soft)}
@media (hover:hover){.icon-button:hover{background:var(--primary-soft);border-color:#b5d6ea}}
.icon-button:focus-visible{outline:3px solid rgba(11,111,164,.4);outline-offset:2px}

#mainContent{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#fff}
.panel-head{
  position:sticky;top:0;z-index:4;padding:18px var(--gutter) 14px;
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.panel-body{padding:18px var(--gutter) calc(48px + var(--safe-b))}
.wrap{max-width:980px;margin:0 auto}

/* Champs */
label{display:block;margin:0 0 6px;font-size:14px;font-weight:600;color:var(--ink)}
input[type=text],textarea{
  width:100%;min-height:48px;margin:0;padding:12px 14px;
  font:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:12px;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
textarea{resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:#8a9bad}
input:focus,textarea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:var(--ring)}
.search{position:relative;flex:1;min-width:0}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:44px}
.search-row{display:flex;align-items:center;gap:10px}
.filter-count{
  display:inline-flex;align-items:center;flex:none;padding:6px 12px;
  font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--field);border:1px solid var(--line);border-radius:999px;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
  font-size:13px;font-weight:600;line-height:1.3;color:var(--primary-d);
  background:var(--primary-soft);border:1px solid #b5d6ea;border-radius:999px;
}
.empty-state{padding:32px 12px;text-align:center;color:var(--muted);font-size:15px}

/* Boutons */
.btn-id{
  appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 18px;margin:0;
  font:600 15px/1 var(--font);color:var(--ink);text-decoration:none;white-space:nowrap;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  cursor:pointer;touch-action:manipulation;
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
}
.btn-id .i{width:18px;height:18px}
.btn-id:active{background:var(--line-soft)}
.btn-id:focus-visible{outline:3px solid rgba(11,111,164,.4);outline-offset:2px}
@media (hover:hover){.btn-id:hover{background:var(--primary-soft);border-color:#b5d6ea;color:var(--primary-d)}}
.btn-id-v{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-id-v:active{background:var(--primary-d)}
@media (hover:hover){.btn-id-v:hover{background:var(--primary-d);border-color:var(--primary-d);color:#fff}}
.btn-id-c{color:var(--late);background:#fff;border-color:#f0c3c5}
@media (hover:hover){.btn-id-c:hover{background:var(--late-soft);border-color:#e7a9ac;color:var(--late)}}
.btn-id-c:active{background:#fbdcdc}

/* Modales */
.modal-overlay{

    <div id="systemModalIcon" class="state-ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></div>
    <h2 id="systemModalTitle"></h2>
    <p id="systemModalText"></p>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js')
    .then(() => console.log("Service Worker enregistré !"));
}
</script>

<script>
function updateDateTime() {
  const now = new Date();
  const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('datetime').textContent = now.toLocaleDateString('fr-FR', options) + ' ' + time;
}

// Mise à jour toutes les secondes
setInterval(updateDateTime, 1000);
updateDateTime();
</script>

</body>
</html>
