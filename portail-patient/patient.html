<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="icon" type="image/jpeg" href="logog2.png">
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mes documents - GestUrg2</title>


<!-- ======================================================
     HTML2PDF
====================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- ======================================================
     CONVERSION ORD → PDF
====================================================== -->

<script src="../ordToPdf.js"></script>


<style>
/* ============================================================
   GESTURG2 — ESPACE PATIENT
   Style inspiré du design "Centre Hospitalier"
============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');


/* ============================================================
   VARIABLES
============================================================ */

:root {

    --bg: #F6FBFA;
    --surface: #FFFFFF;

    --ink: #12312D;
    --ink-soft: #4C6B66;

    --teal: #0F766E;
    --teal-deep: #0B544E;

    --aqua: #DCF3F0;

    --coral: #EF6351;
    --coral-soft: #FDE4DF;

    --amber: #E2A63A;

    --line: #E2EEEC;

    --radius: 22px;

    --shadow:
        0 20px 50px -25px
        rgba(15, 60, 55, .35);

    --shadow-soft:
        0 10px 30px -18px
        rgba(15, 60, 55, .25);

    --font-display:
        'Fraunces',
        Georgia,
        serif;

    --font-body:
        'Plus Jakarta Sans',
        Arial,
        sans-serif;
}


/* ============================================================
   RESET
============================================================ */

* {

    box-sizing:
        border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html,
body {

    margin:
        0;

    padding:
        0;

    width:
        100%;

    min-height:
        100%;

    overflow-x:
        hidden;

}


body {

    font-family:
        var(--font-body);

    color:
        var(--ink);

    background:

        radial-gradient(
            1100px 500px at 90% -10%,
            #E7F6F3 0%,
            transparent 60%
        ),

        radial-gradient(
            900px 500px at -10% 110%,
            #FBEDE9 0%,
            transparent 55%
        ),

        var(--bg);

    min-height:
        100vh;

    min-height:
        100dvh;

    -webkit-font-smoothing:
        antialiased;

}


/* ============================================================
   CONTENEUR PRINCIPAL
============================================================ */

.container {

    width:
        100%;

    max-width:
        720px;

    margin:
        0 auto;

    padding:
        34px 18px 60px;

}


/* ============================================================
   HEADER
============================================================ */

header {

    width:
        100%;

    max-width:
        720px;

    margin:
        0 auto;

    padding:
        28px 18px 10px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        18px;

}


header h1 {

    margin:
        0;

    font-family:
        var(--font-display);

    font-weight:
        600;

    font-size:
        clamp(24px, 5vw, 34px);

    line-height:
        1.15;

    color:
        var(--teal-deep);

}


/* petit badge avant le titre */

header h1::before {

    content:
        "🏥  ESPACE PATIENT";

    display:
        block;

    width:
        fit-content;

    margin-bottom:
        10px;

    padding:
        6px 13px;

    border-radius:
        999px;

    background:
        var(--aqua);

    color:
        var(--teal-deep);

    font-family:
        var(--font-body);

    font-size:
        11px;

    font-weight:
        800;

    letter-spacing:
        .08em;

}


/* ============================================================
   BOUTON DÉCONNEXION
============================================================ */

.logout {

    flex:
        0 0 auto;

    border:
        1.5px solid var(--line);

    background:
        rgba(255,255,255,.85);

    color:
        var(--ink-soft);

    padding:
        11px 16px;

    border-radius:
        999px;

    cursor:
        pointer;

    font-family:
        var(--font-body);

    font-size:
        13px;

    font-weight:
        700;

    transition:
        all .18s ease;

    box-shadow:
        0 5px 15px
        rgba(15,60,55,.08);

}


.logout:hover {

    border-color:
        var(--coral);

    color:
        var(--coral);

    background:
        #fff;

    transform:
        translateY(-1px);

}


.logout:active {

    transform:
        scale(.97);

}


.logout:disabled {

    opacity:
        .55;

    cursor:
        wait;

}


/* ============================================================
   CARTE PATIENT
============================================================ */

.patient-card {

    position:
        relative;

    background:
        var(--surface);

    border:
        1px solid var(--line);

    border-radius:
        var(--radius);

    padding:
        28px 30px;

    margin-bottom:
        30px;

    box-shadow:
        var(--shadow);

    overflow:
        hidden;

}


/* décoration */

.patient-card::before {

    content:
        "";

    position:
        absolute;

    width:
        180px;

    height:
        180px;

    border-radius:
        50%;

    background:
        var(--aqua);

    right:
        -80px;

    top:
        -90px;

    opacity:
        .65;

}


.patient-card::after {

    content:
        "✦";

    position:
        absolute;

    right:
        28px;

    top:
        24px;

    color:
        var(--teal);

    font-size:
        22px;

    opacity:
        .7;

}


.patient-card h2 {

    position:
        relative;

    z-index:
        1;

    margin:
        0 0 8px;

    font-family:
        var(--font-display);

    font-size:
        clamp(23px, 5vw, 30px);

    font-weight:
        600;

    color:
        var(--teal-deep);

}


.patient-card p {

    position:
        relative;

    z-index:
        1;

    margin:
        0;

    color:
        var(--ink-soft);

    font-size:
        14px;

    line-height:
        1.6;

}


/* ============================================================
   TITRE DOCUMENTS
============================================================ */

.container > h2 {

    margin:
        0 0 15px;

    font-family:
        var(--font-display);

    font-size:
        25px;

    font-weight:
        600;

    color:
        var(--ink);

}


/* petite ligne décorative */

.container > h2::after {

    content:
        "";

    display:
        block;

    width:
        42px;

    height:
        3px;

    margin-top:
        9px;

    border-radius:
        5px;

    background:
        linear-gradient(
            90deg,
            var(--teal),
            var(--coral)
        );

}


/* ============================================================
   LISTE DES DOCUMENTS
============================================================ */

.documents {

    display:
        grid;

    gap:
        12px;

}


/* ============================================================
   CARTE DOCUMENT
============================================================ */

.document {

    position:
        relative;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        18px;

    padding:
        18px 18px 18px 20px;

    background:
        rgba(255,255,255,.96);

    border:
        1.5px solid var(--line);

    border-radius:
        17px;

    box-shadow:
        var(--shadow-soft);

    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;

    overflow:
        hidden;

}


/* petite barre verte */

.document::before {

    content:
        "";

    position:
        absolute;

    left:
        0;

    top:
        14px;

    bottom:
        14px;

    width:
        4px;

    border-radius:
        0 5px 5px 0;

    background:
        var(--teal);

}


.document:hover {

    transform:
        translateY(-2px);

    border-color:
        #BBDDD8;

    box-shadow:
        0 15px 35px -20px
        rgba(15,60,55,.35);

}


/* ============================================================
   INFORMATIONS DOCUMENT
============================================================ */

.document-info {

    flex:
        1;

    min-width:
        0;

    padding-left:
        5px;

}


.document-title {

    margin-bottom:
        5px;

    color:
        var(--ink);

    font-size:
        15px;

    font-weight:
        800;

    line-height:
        1.4;

    word-break:
        break-word;

}


.document-type {

    color:
        var(--ink-soft);

    font-size:
        13px;

    font-weight:
        500;

    line-height:
        1.4;

}


.document-date {

    display:
        inline-block;

    margin-top:
        7px;

    padding:
        4px 9px;

    border-radius:
        999px;

    background:
        #F1F7F6;

    color:
        var(--ink-soft);

    font-size:
        11px;

    font-weight:
        600;

}


/* ============================================================
   BOUTON OUVRIR
============================================================ */

.document button {

    flex:
        0 0 auto;

    min-height:
        44px;

    padding:
        11px 17px;

    border:
        none;

    border-radius:
        12px;

    background:
        var(--teal);

    color:
        #fff;

    cursor:
        pointer;

    font-family:
        var(--font-body);

    font-size:
        13px;

    font-weight:
        700;

    box-shadow:
        0 10px 20px -12px
        rgba(15,118,110,.7);

    transition:
        all .18s ease;

}


.document button:hover {

    background:
        var(--teal-deep);

    transform:
        translateY(-1px);

}


.document button:active {

    transform:
        scale(.97);

}


.document button:disabled {

    opacity:
        .65;

    cursor:
        wait;

    transform:
        none;

}


/* ============================================================
   MESSAGES
============================================================ */

.message {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    min-height:
        130px;

    padding:
        28px;

    background:
        rgba(255,255,255,.7);

    border:
        1.5px dashed var(--line);

    border-radius:
        17px;

    text-align:
        center;

    color:
        var(--ink-soft);

    font-size:
        14px;

    font-weight:
        500;

}


.message.error {

    border:
        1.5px solid var(--coral-soft);

    background:
        #FFF8F6;

    color:
        var(--coral);

}


/* ============================================================
   ERREUR
============================================================ */

.error {

    color:
        var(--coral);

    font-size:
        14px;

    font-weight:
        600;

}


/* ============================================================
   LOADER
============================================================ */

.loader {

    display:
        inline-block;

    width:
        15px;

    height:
        15px;

    border:
        2px solid
        rgba(255,255,255,.35);

    border-top-color:
        white;

    border-radius:
        50%;

    animation:
        rotation .7s linear infinite;

    vertical-align:
        -3px;

    margin-right:
        7px;

}


@keyframes rotation {

    to {

        transform:
            rotate(360deg);

    }

}


/* ============================================================
   ANIMATION D'APPARITION
============================================================ */

.patient-card,
.documents,
.container > h2 {

    animation:
        fadeUp .45s ease both;

}


.documents {

    animation-delay:
        .06s;

}


@keyframes fadeUp {

    from {

        opacity:
            0;

        transform:
            translateY(10px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0);

    }

}


/* ============================================================
   ACCESSIBILITÉ
============================================================ */

button:focus-visible {

    outline:
        3px solid
        rgba(15,118,110,.25);

    outline-offset:
        2px;

}


@media (prefers-reduced-motion: reduce) {

    * {

        animation-duration:
            .001ms !important;

        transition-duration:
            .001ms !important;

    }

}


/* ============================================================
   TABLETTE
============================================================ */

@media (max-width: 650px) {

    header {

        padding:
            24px 16px 8px;

    }

    .container {

        padding:
            25px 16px 45px;

    }

}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 520px) {

    header {

        align-items:
            flex-start;

        gap:
            12px;

    }


    header h1 {

        font-size:
            25px;

    }


    header h1::before {

        font-size:
            9.5px;

        padding:
            5px 10px;

    }


    .logout {

        padding:
            9px 12px;

        font-size:
            11px;

    }


    .container {

        padding:
            20px 12px 40px;

    }


    .patient-card {

        padding:
            23px 20px;

        border-radius:
            19px;

        margin-bottom:
            25px;

    }


    .patient-card h2 {

        padding-right:
            30px;

    }


    .container > h2 {

        font-size:
            23px;

    }


    .document {

        align-items:
            flex-start;

        padding:
            17px 15px 17px 17px;

    }


    .document button {

        padding:
            10px 13px;

        min-height:
            42px;

        font-size:
            12px;

    }

}


/* ============================================================
   TRÈS PETITS ÉCRANS
============================================================ */

@media (max-width: 380px) {

    header {

        padding-left:
            12px;

        padding-right:
            12px;

    }


    header h1 {

        font-size:
            22px;

    }


    .logout {

        font-size:
            10px;

        padding:
            8px 10px;

    }


    .document {

        flex-direction:
            column;

        gap:
            13px;

    }


    .document-info {

        width:
            100%;

    }


    .document button {

        width:
            100%;

    }

}
/* ============================================================
   FOOTER PATIENT
============================================================ */

.patient-footer {

    width:
        100%;

    padding:
        0 20px 28px;

    text-align:
        center;

    color:
        var(--ink-soft);

    font-family:
        var(--font-body);

    font-size:
        11px;

    font-weight:
        600;

    letter-spacing:
        .01em;

    opacity:
        .75;

}


/* ============================================================
   MOBILE FOOTER
============================================================ */

@media (max-width: 520px) {

    .patient-footer {

        padding:
            0 15px
            calc(25px + env(safe-area-inset-bottom));

        font-size:
            10.5px;

    }

}

/* ============================================================
   SAFE AREA IPHONE
============================================================ */

@supports (padding-bottom: env(safe-area-inset-bottom)) {

    .container {

        padding-bottom:
            calc(
                50px +
                env(safe-area-inset-bottom)
            );

    }

}
</style>
</head>


<body>


<header>

    <h1>
        GestUrg2 — Espace patient
    </h1>

    <button
        class="logout"
        id="btnLogout"
    >
        Se déconnecter
    </button>

</header>


<div class="container">


    <!-- ==================================================
         PATIENT
    ================================================== -->

    <div
        class="patient-card"
        id="patientCard"
    >

        Chargement...

    </div>


    <h2>
        Mes documents
    </h2>


    <!-- ==================================================
         DOCUMENTS
    ================================================== -->

    <div
        id="documents"
        class="documents"
    >

        <div class="message">
            Chargement des documents...
        </div>

    </div>

</div>

<footer class="patient-footer">
    Fièrement propulsé par GestUrg2 🚀
</footer>
<script>

const SERVER =
    "https://gesturg2-server.onrender.com";


let session = null;


// ======================================================
// CHARGER LA SESSION
// ======================================================

async function chargerSession() {

    try {

        const response =
            await fetch(
                `${SERVER}/api/patient-access/session`,
                {
                    method:
                        "GET",

                    credentials:
                        "include"
                }
            );


        const resultat =
            await response.json();


        if (
            response.status === 401 ||
            !resultat.success
        ) {

            window.location.href =
                "patient-login.html";

            return false;

        }


        session =
            resultat;


        console.log(
            "Session patient :",
            session
        );


        afficherPatient();


        return true;


    } catch (error) {

        console.error(
            "Erreur session :",
            error
        );


        document.getElementById(
            "patientCard"
        ).innerHTML = `

            <div class="error">

                Impossible de contacter le serveur.

            </div>

        `;


        return false;

    }

}


// ======================================================
// AFFICHER PATIENT
// ======================================================

function afficherPatient() {

    const patient =
        session.patient;


    document.getElementById(
        "patientCard"
    ).innerHTML = `

        <h2>

            Bonjour
            ${escapeHtml(patient.prenom)}
            ${escapeHtml(patient.nom)}

        </h2>

        <p>

            Vous êtes connecté à votre
            espace patient.

        </p>

    `;

}


// ======================================================
// CHARGER LES DOCUMENTS
// ======================================================

async function chargerDocuments() {

    const container =
        document.getElementById(
            "documents"
        );


    try {

        const response =
            await fetch(
                `${SERVER}/api/patient-access/documents`,
                {
                    method:
                        "GET",

                    credentials:
                        "include"
                }
            );


        const resultat =
            await response.json();


        // --------------------------------------------------
        // SESSION EXPIRÉE
        // --------------------------------------------------

        if (
            response.status === 401
        ) {

            window.location.href =
                "patient-login.html";

            return;

        }


        // --------------------------------------------------
        // ERREUR
        // --------------------------------------------------

        if (!resultat.success) {

            container.innerHTML = `

                <div class="message error">

                    ${escapeHtml(
                        resultat.error ||
                        "Impossible de charger les documents."
                    )}

                </div>

            `;

            return;

        }


        // --------------------------------------------------
        // AUCUN DOCUMENT
        // --------------------------------------------------

        if (
            !resultat.documents ||
            resultat.documents.length === 0
        ) {

            container.innerHTML = `

                <div class="message">

                    Aucun document disponible.

                </div>

            `;

            return;

        }


        container.innerHTML =
            "";


        // --------------------------------------------------
        // AFFICHER LES DOCUMENTS
        // --------------------------------------------------

        resultat.documents.forEach(
            documentMedical => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "document";


                element.innerHTML = `

                    <div class="document-info">

                        <div class="document-title">

                            ${escapeHtml(
                                documentMedical.titre ||
                                "Document"
                            )}

                        </div>

                        <div class="document-type">

                            ${escapeHtml(
                                documentMedical.type ||
                                "Document médical"
                            )}

                        </div>

                        ${
                            documentMedical.dateCreation
                                ? `
                                    <div class="document-date">

                                        ${escapeHtml(
                                            documentMedical.dateCreation
                                        )}

                                    </div>
                                  `
                                : ""
                        }

                    </div>


                    <button
                        type="button"
                        class="btn-open-document"
                    >

                        Ouvrir

                    </button>

                `;


                const bouton =
                    element.querySelector(
                        ".btn-open-document"
                    );


                bouton.addEventListener(
                    "click",
                    () => {

                        ouvrirDocument(
                            documentMedical.id,
                            bouton
                        );

                    }
                );


                container.appendChild(
                    element
                );

            }
        );


    } catch (error) {

        console.error(
            "Erreur documents :",
            error
        );


        container.innerHTML = `

            <div class="message error">

                Impossible de charger les documents.

            </div>

        `;

    }

}


// ======================================================
// OUVRIR UN DOCUMENT
// ======================================================

async function ouvrirDocument(
    documentId,
    bouton
) {

    if (!documentId) {

        return;

    }


    try {

        // --------------------------------------------------
        // BOUTON
        // --------------------------------------------------

        if (bouton) {

            bouton.disabled =
                true;

            bouton.innerHTML = `

                <span class="loader"></span>
                Ouverture...

            `;

        }


        // --------------------------------------------------
        // RÉCUPÉRER LE DOCUMENT
        // --------------------------------------------------

        const response =
            await fetch(
                `${SERVER}/api/patient-access/documents/${encodeURIComponent(documentId)}`,
                {
                    method:
                        "GET",

                    credentials:
                        "include"
                }
            );


        const resultat =
            await response.json();


        // --------------------------------------------------
        // SESSION EXPIRÉE
        // --------------------------------------------------

        if (
            response.status === 401
        ) {

            window.location.href =
                "patient-login.html";

            return;

        }


        // --------------------------------------------------
        // ACCÈS REFUSÉ
        // --------------------------------------------------

        if (
            response.status === 403
        ) {

            alert(
                "Vous n'avez pas accès à ce document."
            );

            return;

        }


        // --------------------------------------------------
        // AUTRE ERREUR
        // --------------------------------------------------

        if (!resultat.success) {

            alert(
                resultat.error ||
                "Impossible d'ouvrir le document."
            );

            return;

        }


        const documentMedical =
            resultat.document;


        // --------------------------------------------------
        // VÉRIFIER LE FORMAT ORD
        // --------------------------------------------------

        if (
            !documentMedical.ord ||
            typeof documentMedical.ord !== "object"
        ) {

            console.error(
                "Format ORD absent :",
                documentMedical
            );


            alert(
                "Ce document ne peut pas être affiché."
            );

            return;

        }


        console.log(
            "ORD récupéré :",
            documentMedical.ord
        );


        // --------------------------------------------------
        // VÉRIFIER ordToPDF
        // --------------------------------------------------

        if (
            typeof window.ordToPDF !==
            "function"
        ) {

            console.error(
                "ordToPDF indisponible"
            );


            alert(
                "Le système PDF n'est pas disponible."
            );

            return;

        }


        // --------------------------------------------------
        // GÉNÉRER LE PDF
        // --------------------------------------------------

        const pdfBlob =
            await window.ordToPDF(
                documentMedical.ord
            );


        // --------------------------------------------------
        // VÉRIFIER LE PDF
        // --------------------------------------------------

        if (!pdfBlob) {

            throw new Error(
                "Le PDF n'a pas été généré."
            );

        }


        // --------------------------------------------------
        // CRÉER URL TEMPORAIRE
        // --------------------------------------------------

        const pdfUrl =
            URL.createObjectURL(
                pdfBlob
            );


        // --------------------------------------------------
        // OUVRIR LE PDF
        // --------------------------------------------------

        const nouvelleFenetre =
            window.open(
                pdfUrl,
                "_blank"
            );


        if (!nouvelleFenetre) {

            alert(
                "Votre navigateur bloque l'ouverture du PDF. Autorisez les fenêtres pop-up pour GestUrg2."
            );

            URL.revokeObjectURL(
                pdfUrl
            );

            return;

        }


        // On laisse le navigateur utiliser
        // temporairement l'URL du PDF.


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    pdfUrl
                );

            },
            60000
        );


    } catch (error) {

        console.error(
            "Erreur ouverture document :",
            error
        );


        alert(
            "Impossible de générer le document PDF."
        );


    } finally {

        if (bouton) {

            bouton.disabled =
                false;

            bouton.textContent =
                "Ouvrir";

        }

    }

}


// ======================================================
// DÉCONNEXION
// ======================================================

document
    .getElementById("btnLogout")
    .addEventListener(
        "click",
        async () => {

            const bouton =
                document.getElementById(
                    "btnLogout"
                );


            bouton.disabled =
                true;


            bouton.textContent =
                "Déconnexion...";


            try {

                await fetch(
                    `${SERVER}/api/patient-access/logout`,
                    {
                        method:
                            "POST",

                        credentials:
                            "include"
                    }
                );


            } catch (error) {

                console.error(
                    "Erreur déconnexion :",
                    error
                );

            }


            window.location.href =
                "patient-login.html";

        }
    );


// ======================================================
// PROTECTION XSS
// ======================================================

function escapeHtml(value) {

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


// ======================================================
// DÉMARRAGE
// ======================================================

(async () => {

    const connecte =
        await chargerSession();


    if (!connecte) {

        return;

    }


    await chargerDocuments();

})();
