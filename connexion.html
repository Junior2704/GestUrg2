  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  
  // --- Config Firebase ---
  const firebaseConfig = {
    apiKey: "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",
    authDomain: "urgences-a8ed4.firebaseapp.com",
    projectId: "urgences-a8ed4"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
window.allerAdmin = async function () {
    window.location.href = "connexionadmin.html";
  }

const DERNIER_EMAIL_KEY = "gu2_dernierEmail";
let systemeBloque = false;
let badgeLoginEmail = null;
let badgeLoginUid = null;

// ➡️ Redirige vers la page principale
// (mobile → urgences_mobile, ordinateur → urgences)
// ➡️ Sauf si un paramètre ?page=... est présent dans l'URL : dans ce cas, priorité à cette page
function isMobileDevice() {
  return /Android|iPhone|iPad|iPod|webOS|BlackBerry|Windows Phone|Mobile/i.test(navigator.userAgent)
      || (window.innerWidth < 850);
}

// 🔎 Logique commune post-authentification (mot de passe ET badge)
async function finaliserConnexion(user) {
  const ref = doc(db, "medecins", user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    const data = snap.data();

    // 🔴 Vérifie si le compte est marqué pour suppression
    if (data.supprime === true) {
      window.location.href = "suppressioncompte.html";
      return;
    }

    // 🔐 Vérifie si l'utilisateur doit changer son mot de passe
    if (data.doitChangerMDP === true) {
      window.location.href = "changer_mot_passe.html?from=obligatoire";
      return;
    }
  }

  const urlParams = new URLSearchParams(window.location.search);
  let pageDemandee = urlParams.get("page");

  if (pageDemandee) {
    // Nettoie une éventuelle extension .html déjà présente
    pageDemandee = pageDemandee.replace(/\.html$/i, "");
    window.location.href = `${pageDemandee}.html?uid=${user.uid}`;
  } else if (isMobileDevice()) {
    window.location.href = `fichemobile.html?uid=${user.uid}`;
  } else {
    window.location.href = `shell.html`;
  }
}

// 🈳 Traduction des erreurs Firebase (communes mot de passe / badge)
function traduireErreurConnexion(error) {
  switch (error.message) {
    case "Firebase: Error (auth/invalid-email).":
      return "🚨 Email invalide. Vérifiez l'adresse saisie.";
    case "Firebase: Error (auth/user-disabled).":
      return "🚫 Ce compte a été désactivé. Contactez un administrateur.";
    case "Firebase: Error (auth/user-not-found).":
      return "❌ Aucun compte trouvé avec cet email.";
    case "Firebase: Error (auth/invalid-credential).":
      return "🔑 Couple email/mot de passe incorrect.";
    case "Firebase: Error (auth/missing-password).":
      return "🚨 Merci de saisir un mot de passe.";
    case "Firebase: Error (auth/too-many-requests).":
      return "🚨 Vous avez tenté de vous connecté trop de fois avec un mot de passe éronné. Merci de réessayer plus tard";
    case "Firebase: Error (auth/network-request-failed).":
      return "📶 Problème de connexion réseau. Vérifiez votre connexion Internet.";
    default:
      return "❌ Une erreur est survenue : " + error.message;
  }
}

  // --- Fonction de connexion (mot de passe) ---
  window.seConnecter = async function () {
    if (systemeBloque) return;
    await setPersistence(auth, browserSessionPersistence);
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");
    message.textContent = "";
    message.style.color = "red";

    try {
      // 🔐 Connexion utilisateur
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      localStorage.setItem(DERNIER_EMAIL_KEY, email);
      await finaliserConnexion(userCredential.user);
    } catch (error) {
      message.textContent = traduireErreurConnexion(error);
    }
  };

  // ==========================
  // 🪪 CONNEXION PAR BADGE
  // ==========================

  window.switchLoginTab = function (tab) {
    const isBadge = tab === "badge";

    document.getElementById("loginTabBadge").classList.toggle("active", isBadge);
    document.getElementById("loginTabPassword").classList.toggle("active", !isBadge);
    document.getElementById("loginPanelBadge").classList.toggle("active", isBadge);
    document.getElementById("loginPanelPassword").classList.toggle("active", !isBadge);

    document.getElementById("message").textContent = "";
    document.getElementById("badgeLoginError").textContent = "";

    if (isBadge) {
      document.getElementById("badgeLoginInput").value = "";
      setTimeout(focusBadgeLoginInput, 50);
    }
  };

  window.focusBadgeLoginInput = function () {
    if (systemeBloque) return;
    const panel = document.getElementById("loginPanelBadge");
    if (panel && panel.classList.contains("active")) {
      document.getElementById("badgeLoginInput").focus();
    }
  };

  // 🔎 Recherche l'utilisateur propriétaire du badge scanné
  window.rechercherBadge = async function () {
    if (systemeBloque) return;
    const input = document.getElementById("badgeLoginInput");
    const valeur = input.value.trim();
    const errorDiv = document.getElementById("badgeLoginError");
    errorDiv.textContent = "";

    if (!valeur) return;

    try {
      const q = query(collection(db, "medecins"), where("idBadge", "==", valeur));
      const snap = await getDocs(q);

      if (snap.empty) {
        errorDiv.textContent = "❌ Badge non reconnu.";
        input.value = "";
        focusBadgeLoginInput();
        return;
      }

      const docSnap = snap.docs[0];
      const data = docSnap.data();

      badgeLoginEmail = data.email;
      badgeLoginUid = docSnap.id;

      input.value = "";

      document.getElementById("usbUserText").textContent = `Utilisateur : ${data.nom || data.email || ""}`;
      document.getElementById("usbPassword").value = "";
      document.getElementById("usbLoginError").textContent = "";
      document.getElementById("usbLoginModal").style.display = "flex";
      setTimeout(() => document.getElementById("usbPassword").focus(), 50);

    } catch (error) {
      console.error(error);
      errorDiv.textContent = "❌ Erreur lors de la vérification du badge.";
      input.value = "";
      focusBadgeLoginInput();
    }
  };

  // ✔ Validation de la modale mot de passe (déclenchée après reconnaissance du badge)
  window.validerUSBLogin = async function () {
    if (!badgeLoginEmail) return;
    await setPersistence(auth, browserSessionPersistence);

    const password = document.getElementById("usbPassword").value;
    const errorDiv = document.getElementById("usbLoginError");
    errorDiv.textContent = "";

    if (!password) {
      errorDiv.textContent = "🚨 Merci de saisir un mot de passe.";
      return;
    }

    try {
      const userCredential = await signInWithEmailAndPassword(auth, badgeLoginEmail, password);
      localStorage.setItem(DERNIER_EMAIL_KEY, badgeLoginEmail);
      document.getElementById("usbLoginModal").style.display = "none";
      await finaliserConnexion(userCredential.user);
    } catch (error) {
      errorDiv.textContent = traduireErreurConnexion(error);
      document.getElementById("usbPassword").value = "";
      document.getElementById("usbPassword").focus();
    }
  };

  // ❌ Annulation de la modale mot de passe badge
  window.annulerUSBLogin = function () {
    document.getElementById("usbLoginModal").style.display = "none";
    document.getElementById("usbPassword").value = "";
    document.getElementById("usbLoginError").textContent = "";
    badgeLoginEmail = null;
    badgeLoginUid = null;
    focusBadgeLoginInput();
  };

  // 🔧 Détermine l'onglet par défaut (badge ou mot de passe) selon la préférence
  // de l'utilisateur, retrouvée via le dernier email de connexion connu localement.
  async function appliquerOngletParDefaut() {
    const dernierEmail = localStorage.getItem(DERNIER_EMAIL_KEY);

    if (dernierEmail) {
      document.getElementById("email").value = dernierEmail;
    }

    let ongletParDefaut = "password";

    if (dernierEmail) {
      try {
        const q = query(collection(db, "medecins"), where("email", "==", dernierEmail));
        const snap = await getDocs(q);
        if (!snap.empty) {
          const pref = snap.docs[0].data()["préférenceConnexion"];
          if (pref === "badge") ongletParDefaut = "badge";
        }
      } catch (e) {
        console.warn("Impossible de récupérer la préférence de connexion :", e);
      }
    }

    switchLoginTab(ongletParDefaut);
  }
  async function checkFonctionnement() {
  try {
    const ref = doc(db, "referentiels", "fonctionnement");
    const snap = await getDoc(ref);

    console.log("🔥 Firestore snap exists:", snap.exists());
    console.log("🔥 Firestore data:", snap.data());

    if (!snap.exists()) {
      showSystemModal("❌ Erreur système", "Document introuvable");
      return false;
    }

    const data = snap.data();

    // 🚨 DEBUG IMPORTANT
    const rawMode = data.mode ?? data.Mode ?? data.etat ?? data.status;
    console.log("🔥 MODE BRUT =", rawMode);

    const mode = String(rawMode || "").trim().toLowerCase();

    console.log("🔥 MODE NORMALISÉ =", mode);

    if (mode === "normal") return true;

    if (mode === "maintenance") {
      showSystemModal(
        "🚧 Maintenance en cours",
        "Le système est en maintenance. Merci de réessayer plus tard."
      );
      return false;
    }

    if (mode === "erreur") {
      showSystemModal(
        "❌ Erreur système",
        "Accès bloqué pour cause d’erreur système."
      );
      return false;
    }

    showSystemModal(
      "🚨 Mode inconnu",
      "Valeur reçue : " + mode
    );

    return false;

  } catch (e) {
    console.error("🔥 FIRESTORE ERROR:", e);
    showSystemModal("❌ Erreur Firestore", e.message);
    return false;
  }
}

document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    seConnecter();
  }
});

document.getElementById("badgeLoginInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    rechercherBadge();
  }
});

document.getElementById("usbPassword").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    validerUSBLogin();
  }
});


window.showSystemModal = function(title, text) {
  const modal = document.getElementById("systemModal");

  document.getElementById("systemModalTitle").textContent = title;
  document.getElementById("systemModalText").textContent = text;

  const icon = document.getElementById("systemModalIcon");

 if (title.includes("Maintenance")) icon.textContent = "🛠️";
 else if (title.includes("Erreur")) icon.textContent = "❌";
  else icon.textContent = "🚨";

  // 🔒 BLOQUAGE TOTAL INTERFACE
  document.body.classList.add("locked");

  modal.style.display = "flex";
};
window.addEventListener("DOMContentLoaded", async () => {
  await appliquerOngletParDefaut();

  const ok = await checkFonctionnement();

  // si pas OK → on bloque les boutons et la lecture de badge
  if (!ok) {
    systemeBloque = true;
    document.querySelectorAll("button").forEach(btn => {
      if (btn.textContent.includes("Se connecter") || btn.textContent.includes("Connexion")) {
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.style.cursor = "not-allowed";
      }
    });
    document.getElementById("badgeLoginInput").disabled = true;
  }
});
</script>

<script>
function updateDateTime() {
  const now = new Date();
  const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
  const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('datetime').textContent = now.toLocaleDateString('fr-FR', options) + ' ' + time;
}

// Mise à jour toutes les secondes
setInterval(updateDateTime, 1000);
updateDateTime();
const vehicles = [
  "🚑",
  "🚒",
  "🚓",
  "🚁"
];
let lastSpawn = 0;
const SPAWN_COOLDOWN = 1000;
function spawnVehicle() {
    const now = Date.now();

    if (now - lastSpawn < SPAWN_COOLDOWN) {
        return;
    }

    lastSpawn = now;
    const lane = document.getElementById("emergency-lane");

    const wrapper = document.createElement("div");
    wrapper.className = "emergency-vehicle";

    const emoji =
      vehicles[Math.floor(Math.random() * vehicles.length)];

wrapper.innerHTML = `
<div class="emergency-vehicle-inner">
    ${emoji}
    ${emoji !== "🚁" ? `
        <div class="gyro-red"></div>
        <div class="gyro-blue"></div>
    ` : ""}
</div>
`;
const lanes = [10];

wrapper.style.top =
    lanes[Math.floor(Math.random() * lanes.length)] + "px";
    if (emoji === "🚁") {
        wrapper.style.top = "-8px";
        wrapper.style.fontSize = "24px";
        wrapper.style.animationDuration = "9s";
    }

    lane.appendChild(wrapper);

    wrapper.addEventListener("animationend", () => {
        wrapper.remove();
    });
}
spawnVehicle();

setTimeout(spawnVehicle, 1500);
setTimeout(spawnVehicle, 3500);
setInterval(() => {

    if (Math.random() < 0.7) {
        spawnVehicle();
    }

}, 3000);

</script>
