<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attribution des comptes - GestUrg2</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14222e;--mut:#5b6878;--line:#dde3ea;--bg:#eef1f4;--ac:#0b7285;--ac2:#095c6c;--tint:#e3f1f4;--red:#b42318}
*{box-sizing:border-box;font-family:"Public Sans",system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px}
button{cursor:pointer;border:0;font-weight:600;font-size:13px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input:not([type=checkbox]),select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.btn{padding:9px 14px;border-radius:8px;background:var(--ac);color:#fff}.btn:hover{background:var(--ac2)}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sec:hover{background:var(--bg)}
header{background:#12283a;color:#fff;padding:16px 28px;font-weight:700;font-size:17px}
.tabs{display:flex;gap:4px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}.tabs button{background:none;color:var(--mut);padding:13px 14px;border-bottom:2px solid transparent;border-radius:0}.tabs button.on{color:var(--ac2);border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:22px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h3{margin:0;font-size:15px}
small,.info{color:var(--mut);font-size:13px}.info{margin-top:6px}
.tag{font-size:11px;padding:1px 8px;border-radius:6px;background:#e0f2e9;color:#1a7f4b;margin-left:8px}.tag.off{background:#f3e3e1;color:var(--red)}
.pick{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto;margin-top:6px}.pick label{display:flex;gap:9px;align-items:center;margin:0;padding:7px 10px;font-weight:500;border-bottom:1px solid #f0f2f5}.pick input{width:auto}
.ck{display:flex;gap:8px;align-items:center;font-weight:500}.ck input{width:auto}.row{display:flex;gap:10px;margin-top:14px}
.vide,.refus{text-align:center;color:var(--mut);padding:40px 20px}.refus{margin-top:80px;font-size:16px}
.vue{display:none}.vue.on{display:block}
dialog{border:0;border-radius:14px;padding:22px;width:min(420px,94vw);box-shadow:0 20px 60px #0a1a2a55}dialog::backdrop{background:#0a1a2a88}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;display:none}#toast.err{background:var(--red)}
</style>
</head>
<body>
<div id="app"><div class="refus">Chargement…</div></div>
<div id="toast" role="status"></div>
<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,getDocs,setDoc,collection,query,where,onSnapshot,addDoc,updateDoc,serverTimestamp,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const cfg={apiKey:"AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",authDomain:"urgences-a8ed4.firebaseapp.com",projectId:"urgences-a8ed4",storageBucket:"urgences-a8ed4.firebasestorage.app",messagingSenderId:"392921498200",appId:"1:392921498200:web:7ccce767332c67c697c02d",measurementId:"G-C74MK2KYDL"};
const fa=getApps().length?getApp():initializeApp(cfg),db=getFirestore(fa),auth=getAuth(fa);
const CODE_PAGE="messagerieadministration";
const DEFS=[{id:"systeme",nom:"Système",icon:"⚙️",page:"adminsysteme"},{id:"admin-medical",nom:"Administration médicale",icon:"🏥",page:"adminmed"},{id:"rh",nom:"Ressources Humaines",icon:"🗂️",page:"adminrh"}];
const TYPES={doc:"Médecin",infirmier:"Infirmier",AS:"Aide Soignant",Int:"Interne",Ext:"Externe"};
const $=id=>document.getElementById(id),esc=t=>{const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML};
let U=null,users=[],gens=[],convs=[],adm=[],eg=null,ea=null,sg=new Set(),sa=new Set(),tab="gen";
const nom=u=>users.find(x=>x.uid===u)?.nom||u;
function toast(m,err){const t=$("toast");t.textContent=m;t.className=err?"err":"";t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3500)}
function refus(m){$("app").innerHTML=`<div class="refus">Accès refusé<br><br>${m}</div>`}

onAuthStateChanged(auth,async u=>{
 if(!u)return refus("Vous devez être connecté pour accéder à cette page.");
 U=u;const s=await getDoc(doc(db,"medecins",u.uid));
 if(!s.exists()||!s.data().pages||s.data().pages[CODE_PAGE]!==true)return refus("Vous n'avez pas accès à l'attribution des comptes.");
 users=(await getDocs(collection(db,"medecins"))).docs.map(d=>({uid:d.id,...d.data()}));
 await initAdmin();build();
 onSnapshot(collection(db,"comptes-generiques"),s=>{gens=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr"));listeGen()});
 onSnapshot(query(collection(db,"messageries"),where("type","==","compte-generique")),s=>{convs=s.docs.map(d=>({id:d.id,...d.data()}));listeGen()});
});
/* les 3 comptes d'envoi sont fixes ; première initialisation depuis les anciennes autorisations pages.admin* */
async function initAdmin(){
 adm=[];
 for(const d of DEFS){const ref=doc(db,"comptes-administrateurs",d.id),s=await getDoc(ref);
  if(s.exists())adm.push({...d,...s.data(),id:d.id,membres:s.data().membres||[]});
  else{const m=users.filter(u=>u.pages&&u.pages[d.page]===true).map(u=>u.uid);
   try{await setDoc(ref,{nom:d.nom,icon:d.icon,membres:m,actif:true,createdAt:serverTimestamp(),initialiseDepuisPages:true})}catch(e){console.error(e)}
   adm.push({...d,membres:m,actif:true})}}
 ea=adm[0].id;sa=new Set(adm[0].membres);
}
function build(){
 $("app").innerHTML=`<header>Attribution des comptes</header>
 <div class="tabs"><button class="on" data-k="gen">Comptes généraux</button><button data-k="adm">Comptes d'envoi</button></div>
 <main>
 <div class="vue on" id="v-gen">
  <div class="card"><div class="head"><h3 id="gT">Nouveau compte général</h3></div>
   <label for="gNom">Nom du compte</label><input id="gNom" maxlength="60" placeholder="Ex : Secrétariat, Planning, Informatique">
   <label for="gIcon">Icône (emoji)</label><input id="gIcon" maxlength="4" placeholder="📬">
   <label for="gDesc">Description, visible par tous les utilisateurs (facultatif)</label><input id="gDesc" maxlength="150">
   <label>Personnes ayant accès à ce compte (voir, répondre, clôturer) <small id="gN"></small></label>
   <input id="gQ" placeholder="Rechercher un utilisateur"><div class="pick" id="gPick"></div>
   <label class="ck"><input type="checkbox" id="gActif" checked> Compte actif : les utilisateurs peuvent ouvrir de nouvelles discussions</label>
   <div class="row"><button class="btn" id="gOk" onclick="enregistrerGen()">Créer le compte</button><button class="btn sec" id="gNo" style="display:none" onclick="resetGen()">Annuler la modification</button></div></div>
  <div id="gList"></div></div>
 <div class="vue" id="v-adm">
  <div class="card"><div class="head"><h3>Comptes d'envoi</h3></div><div class="info">Les personnes cochées pourront envoyer messages et sondages au nom du compte, depuis la messagerie.</div>
   <label for="aSel">Compte</label><select id="aSel">${adm.map(c=>`<option value="${c.id}">${esc(c.icon+" "+c.nom)}</option>`).join("")}</select>
   <label>Personnes autorisées <small id="aN"></small></label><input id="aQ" placeholder="Rechercher un utilisateur"><div class="pick" id="aPick"></div>
   <div class="row"><button class="btn" onclick="enregistrerAdm()">Enregistrer les accès</button></div></div>
  <div id="aList"></div></div>
 </main>`;
 document.querySelector(".tabs").onclick=e=>{const k=e.target.dataset.k;if(!k)return;tab=k;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));$("v-gen").classList.toggle("on",k==="gen");$("v-adm").classList.toggle("on",k==="adm")};
 $("gQ").oninput=()=>pick("g");$("aQ").oninput=()=>pick("a");
 $("aSel").onchange=()=>{ea=$("aSel").value;sa=new Set(adm.find(c=>c.id===ea).membres);pick("a")};
 ["gPick","aPick"].forEach(i=>$(i).onchange=e=>{const s=i==="gPick"?sg:sa;e.target.checked?s.add(e.target.value):s.delete(e.target.value);cnt()});
 pick("g");pick("a");listeAdm();
}
function pick(w){const q=$(w+"Q").value.toLowerCase(),s=w==="g"?sg:sa;
 $(w+"Pick").innerHTML=users.filter(u=>`${u.nom||""} ${u.email||""}`.toLowerCase().includes(q)).map(u=>`<label><input type="checkbox" value="${u.uid}" ${s.has(u.uid)?"checked":""}><span>${esc(u.nom)} <small>${esc(TYPES[u.type]||u.type||"")}, ${esc(u.email)}</small></span></label>`).join("")||'<div class="vide">Aucun utilisateur.</div>';cnt()}
function cnt(){$("gN").textContent=`(${sg.size} sélectionnée${sg.size>1?"s":""})`;$("aN").textContent=`(${sa.size} sélectionnée${sa.size>1?"s":""})`}

/* comptes généraux */
window.resetGen=()=>{eg=null;sg.clear();["gNom","gIcon","gDesc","gQ"].forEach(i=>$(i).value="");$("gActif").checked=true;$("gT").textContent="Nouveau compte général";$("gOk").textContent="Créer le compte";$("gNo").style.display="none";pick("g")};
window.modifierGen=id=>{const c=gens.find(x=>x.id===id);if(!c)return;eg=id;sg=new Set(c.membres||[]);$("gNom").value=c.nom||"";$("gIcon").value=c.icon||"";$("gDesc").value=c.description||"";$("gActif").checked=c.actif!==false;
 $("gT").textContent="Modifier « "+c.nom+" »";$("gOk").textContent="Enregistrer les modifications";$("gNo").style.display="inline-block";pick("g");$("gNom").scrollIntoView({behavior:"smooth",block:"center"})};
window.enregistrerGen=async()=>{
 const nomC=$("gNom").value.trim(),icon=$("gIcon").value.trim()||"📬";
 if(!nomC)return toast("Saisissez un nom pour le compte.",1);if(!sg.size)return toast("Désignez au moins une personne ayant accès.",1);
 if(gens.some(c=>c.id!==eg&&(c.nom||"").trim().toLowerCase()===nomC.toLowerCase()))return toast("Un compte général porte déjà ce nom.",1);
 const data={nom:nomC,icon,description:$("gDesc").value.trim(),actif:$("gActif").checked,membres:[...sg]};
 try{
  if(eg){const id=eg,anc=gens.find(x=>x.id===id)?.membres||[];
   await updateDoc(doc(db,"comptes-generiques",id),{...data,updatedAt:serverTimestamp()});
   await Promise.all(convs.filter(x=>x.compteGeneriqueId===id).map(x=>updateDoc(doc(db,"messageries",x.id),{compteNom:nomC,icon,titre:nomC+(x.demandeurNom?" · "+x.demandeurNom:"")+(x.objet?" — "+x.objet:"")})));
const aj = data.membres.filter(u => !anc.includes(u));
const re = anc.filter(u => !data.membres.includes(u));


// Ajouter les nouveaux membres aux conversations existantes
await Promise.all(
  convs
    .filter(x => x.compteGeneriqueId === id)
    .map(async x => {

      if (aj.length) {
        await updateDoc(
          doc(db, "messageries", x.id),
          {
            participants: arrayUnion(...aj)
          }
        );
      }

      if (re.length) {
        await updateDoc(
          doc(db, "messageries", x.id),
          {
            participants: arrayRemove(...re)
          }
        );
      }

    })
);


// Notification uniquement des nouveaux membres
await Promise.all(
  aj.map(async uid => {

    const utilisateur = users.find(u => u.uid === uid);

    const nomUtilisateur =
      utilisateur?.prenom ||
      utilisateur?.nom ||
      "Bonjour";

    await envoyerMessageSysteme({
      compteId: "systeme",

      texte:
        `Bonjour ${nomUtilisateur},\n\n` +
        `Vous avez été ajouté(e) au compte général « ${nomC} » dans GestUrg2.\n\n` +
        `Vous pouvez désormais accéder aux discussions de ce compte depuis votre messagerie et, selon vos droits, y répondre ou les clôturer.\n\n` +
        `Cette affectation a été effectuée par l'administration.`,

      destinataires: [uid]
    });

  })
);
   toast("Compte modifié.")}
  else {

  // Création du compte
  const ref = await addDoc(
    collection(db, "comptes-generiques"),
    {
      ...data,
      creePar: U.uid,
      createdAt: serverTimestamp()
    }
  );

  // Notification des personnes affectées
  await Promise.all(
    data.membres.map(async uid => {

      const utilisateur = users.find(u => u.uid === uid);

      const nomUtilisateur =
        utilisateur?.prenom ||
        utilisateur?.nom ||
        "Bonjour";

      await envoyerMessageSysteme({
        compteId: "systeme",

        texte:
          `Bonjour ${nomUtilisateur},\n\n` +
          `Vous avez été affecté(e) au compte général « ${nomC} » dans GestUrg2.\n\n` +
          `Vous pouvez désormais consulter les discussions associées à ce compte et, selon vos droits, y répondre ou les clôturer.\n\n` +
          `Vous pouvez retrouver ce compte directement dans votre messagerie.`,

        destinataires: [uid]
      });

    })
  );

  toast("Compte général créé.");
}
  resetGen()}catch(e){console.error(e);toast("Erreur lors de l'enregistrement du compte.",1)}};
window.basculerGen=async id=>{const c=gens.find(x=>x.id===id);if(!c)return;
 try{await updateDoc(doc(db,"comptes-generiques",id),{actif:c.actif===false,updatedAt:serverTimestamp()})}catch(e){toast("Impossible de modifier le compte.",1)}};
function listeGen(){const z=$("gList");if(!z)return;
 z.innerHTML=gens.map(c=>{const cv=convs.filter(x=>x.compteGeneriqueId===c.id),o=cv.filter(x=>x.statut!=="clos").length,a=c.actif!==false;
  return `<div class="card"><div class="head"><h3>${esc(c.icon||"📬")} ${esc(c.nom)}<span class="tag ${a?"":"off"}">${a?"actif":"désactivé"}</span></h3><small>${o} ouverte(s), ${cv.length-o} clôturée(s)</small></div>
  ${c.description?`<div class="info">${esc(c.description)}</div>`:""}<div class="info"><b>Accès (${(c.membres||[]).length}) :</b> ${(c.membres||[]).map(u=>esc(nom(u))).join(", ")||"aucun"}</div>
  <div class="row"><button class="btn sec" onclick="modifierGen('${c.id}')">Modifier</button><button class="btn sec" onclick="basculerGen('${c.id}')">${a?"Désactiver":"Réactiver"}</button></div></div>`}).join("")||'<div class="vide">Aucun compte général pour le moment.</div>'}

/* comptes d'envoi */
window.enregistrerAdm=async()=>{const c=adm.find(x=>x.id===ea);if(!c)return;if(!sa.size)return toast("Désignez au moins une personne pour ce compte.",1);
 try{await updateDoc(doc(db,"comptes-administrateurs",c.id),{membres:[...sa],updatedAt:serverTimestamp()});c.membres=[...sa];listeAdm();toast("Accès au compte « "+c.nom+" » mis à jour.")}
 catch(e){console.error(e);toast("Impossible d'enregistrer les accès.",1)}};
function listeAdm(){$("aList").innerHTML=adm.map(c=>`<div class="card"><div class="head"><h3>${esc(c.icon+" "+c.nom)}</h3><small>${c.membres.length} personne(s)</small></div><div class="info">${c.membres.map(u=>esc(nom(u))).join(", ")||"Aucune personne attribuée"}</div></div>`).join("")}
</script>
</body>
</html>
