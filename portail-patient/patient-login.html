<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="icon" type="image/jpeg" href="logog2.png">
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Accès patient - GestUrg2</title>

<style>
    
/* ============================================================
   GESTURG2 — ACCÈS PATIENT
   Design médical moderne / Centre Hospitalier
============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');


/* ============================================================
   VARIABLES
============================================================ */

:root {

    --bg: #F6FBFA;
    --surface: #FFFFFF;

    --ink: #12312D;
    --ink-soft: #4C6B66;

    --teal: #0F766E;
    --teal-deep: #0B544E;

    --aqua: #DCF3F0;

    --coral: #EF6351;
    --coral-soft: #FDE4DF;

    --line: #E2EEEC;

    --radius: 24px;

    --shadow:
        0 25px 60px -30px
        rgba(15, 60, 55, .40);

    --font-display:
        'Fraunces',
        Georgia,
        serif;

    --font-body:
        'Plus Jakarta Sans',
        Arial,
        sans-serif;
}


/* ============================================================
   RESET
============================================================ */

* {

    box-sizing:
        border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html,
body {

    margin:
        0;

    padding:
        0;

    width:
        100%;

    min-height:
        100%;

    overflow-x:
        hidden;

}


body {

    min-height:
        100vh;

    min-height:
        100dvh;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        30px 16px;

    font-family:
        var(--font-body);

    color:
        var(--ink);

    background:

        radial-gradient(
            1100px 600px at 90% -10%,
            #E7F6F3 0%,
            transparent 60%
        ),

        radial-gradient(
            900px 600px at -10% 110%,
            #FBEDE9 0%,
            transparent 55%
        ),

        var(--bg);

    -webkit-font-smoothing:
        antialiased;

}


/* ============================================================
   CARTE PRINCIPALE
============================================================ */

.card {

    position:
        relative;

    width:
        100%;

    max-width:
        470px;

    padding:
        38px;

    background:
        rgba(255,255,255,.97);

    border:
        1px solid var(--line);

    border-radius:
        var(--radius);

    box-shadow:
        var(--shadow);

    text-align:
        center;

    overflow:
        hidden;

    animation:
        cardAppear .5s ease both;

}


@keyframes cardAppear {

    from {

        opacity:
            0;

        transform:
            translateY(14px)
            scale(.985);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* ============================================================
   DÉCORATIONS DE LA CARTE
============================================================ */

.card::before {

    content:
        "";

    position:
        absolute;

    width:
        210px;

    height:
        210px;

    top:
        -125px;

    right:
        -100px;

    border-radius:
        50%;

    background:
        var(--aqua);

    opacity:
        .8;

}


.card::after {

    content:
        "✦";

    position:
        absolute;

    right:
        30px;

    top:
        25px;

    color:
        var(--teal);

    font-size:
        22px;

    opacity:
        .65;

}


/* ============================================================
   LOGO
============================================================ */

.logo {

    position:
        relative;

    z-index:
        1;

    width:
        82px;

    height:
        82px;

    object-fit:
        contain;

    display:
        block;

    margin:
        0 auto 18px;

    padding:
        9px;

    background:
        #F3FAF8;

    border:
        1px solid var(--line);

    border-radius:
        22px;

    box-shadow:
        0 10px 25px -15px
        rgba(15,60,55,.35);

}


/* ============================================================
   BADGE
============================================================ */

.logo::after {

    content:
        "";

}


/* ============================================================
   TITRE
============================================================ */

h1 {

    position:
        relative;

    z-index:
        1;

    margin:
        0 0 9px;

    font-family:
        var(--font-display);

    font-size:
        clamp(28px, 6vw, 36px);

    line-height:
        1.15;

    font-weight:
        600;

    color:
        var(--teal-deep);

}


/* petit indicateur sous le titre */

h1::after {

    content:
        "";

    display:
        block;

    width:
        38px;

    height:
        3px;

    margin:
        11px auto 0;

    border-radius:
        5px;

    background:
        linear-gradient(
            90deg,
            var(--teal),
            var(--coral)
        );

}


/* ============================================================
   SOUS-TITRE
============================================================ */

.subtitle {

    position:
        relative;

    z-index:
        1;

    margin:
        18px auto 27px;

    max-width:
        390px;

    color:
        var(--ink-soft);

    font-size:
        14px;

    line-height:
        1.7;

}


/* ============================================================
   INDICATION SÉCURITÉ
============================================================ */

.subtitle::before {

    content:
        "🔒";

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    width:
        30px;

    height:
        30px;

    margin:
        0 auto 11px;

    border-radius:
        50%;

    background:
        var(--aqua);

    font-size:
        14px;

}


/* ============================================================
   FORMULAIRE
============================================================ */

#formulaire {

    position:
        relative;

    z-index:
        1;

    text-align:
        left;

}


/* ============================================================
   LABEL
============================================================ */

label {

    display:
        block;

    margin:
        0 0 9px;

    color:
        var(--ink);

    font-size:
        13px;

    font-weight:
        800;

}


/* ============================================================
   CHAMP DATE
============================================================ */

input {

    width:
        100%;

    min-height:
        52px;

    margin:
        0 0 15px;

    padding:
        14px 16px;

    border:
        1.5px solid var(--line);

    border-radius:
        14px;

    outline:
        none;

    background:
        #FBFDFD;

    color:
        var(--ink);

    font-family:
        var(--font-body);

    font-size:
        16px;

    font-weight:
        500;

    -webkit-appearance:
        none;

    appearance:
        none;

    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;

}


input:hover {

    border-color:
        #BBDDD8;

}


input:focus {

    border-color:
        var(--teal);

    background:
        #FFFFFF;

    box-shadow:
        0 0 0 4px
        rgba(15,118,110,.10);

}


/* ============================================================
   BOUTON PRINCIPAL
============================================================ */

button {

    width:
        100%;

    min-height:
        52px;

    padding:
        14px 18px;

    border:
        none;

    border-radius:
        14px;

    background:
        var(--teal);

    color:
        #FFFFFF;

    font-family:
        var(--font-body);

    font-size:
        14px;

    font-weight:
        800;

    cursor:
        pointer;

    box-shadow:
        0 14px 28px -14px
        rgba(15,118,110,.75);

    transition:
        background .18s ease,
        transform .18s ease,
        box-shadow .18s ease;

}


button:hover {

    background:
        var(--teal-deep);

    transform:
        translateY(-1px);

    box-shadow:
        0 17px 32px -15px
        rgba(15,118,110,.8);

}


button:active {

    transform:
        scale(.98);

}


button:disabled {

    opacity:
        .55;

    cursor:
        not-allowed;

    transform:
        none;

    box-shadow:
        none;

}


/* ============================================================
   MESSAGE D'ERREUR
============================================================ */

#error {

    display:
        none;

    margin:
        0 0 20px;

    padding:
        13px 15px;

    border:
        1px solid var(--coral-soft);

    border-radius:
        13px;

    background:
        #FFF7F5;

    color:
        var(--coral);

    font-size:
        13px;

    font-weight:
        600;

    line-height:
        1.5;

    text-align:
        left;

    animation:
        errorAppear .25s ease both;

}


@keyframes errorAppear {

    from {

        opacity:
            0;

        transform:
            translateY(-4px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(0);

    }

}


/* ============================================================
   CHARGEMENT
============================================================ */

#loading {

    display:
        none;

    margin:
        18px 0;

    padding:
        13px;

    border-radius:
        13px;

    background:
        var(--aqua);

    color:
        var(--teal-deep);

    font-size:
        13px;

    font-weight:
        700;

}


/* petit spinner devant le texte */

#loading::before {

    content:
        "";

    display:
        inline-block;

    width:
        14px;

    height:
        14px;

    margin-right:
        8px;

    vertical-align:
        -2px;

    border:
        2px solid
        rgba(15,118,110,.25);

    border-top-color:
        var(--teal);

    border-radius:
        50%;

    animation:
        rotation .7s linear infinite;

}


@keyframes rotation {

    to {

        transform:
            rotate(360deg);

    }

}


/* ============================================================
   TEXTE DE SÉCURITÉ EN BAS
============================================================ */

.card #formulaire::after {

    content:
        "Fièrement propulsé par GestUrg2 🚀";

    display:
        block;

    margin-top:
        19px;

    padding-top:
        17px;

    border-top:
        1px solid var(--line);

    color:
        var(--ink-soft);

    font-size:
        10.5px;

    font-weight:
        600;

    line-height:
        1.5;

    text-align:
        center;

    opacity:
        .8;

}


/* ============================================================
   FOCUS ACCESSIBILITÉ
============================================================ */

button:focus-visible,
input:focus-visible {

    outline:
        3px solid
        rgba(15,118,110,.22);

    outline-offset:
        2px;

}


/* ============================================================
   RÉDUCTION DES ANIMATIONS
============================================================ */

@media (prefers-reduced-motion: reduce) {

    * {

        animation-duration:
            .001ms !important;

        transition-duration:
            .001ms !important;

    }

}


/* ============================================================
   MOBILE
============================================================ */

@media (max-width: 520px) {

    body {

        align-items:
            flex-start;

        padding:
            20px 12px;

    }


    .card {

        max-width:
            100%;

        padding:
            29px 20px;

        border-radius:
            20px;

    }


    .logo {

        width:
            74px;

        height:
            74px;

        border-radius:
            19px;

        margin-bottom:
            15px;

    }


    h1 {

        font-size:
            29px;

    }


    .subtitle {

        font-size:
            13.5px;

        margin-bottom:
            24px;

    }


    input {

        min-height:
            54px;

        font-size:
            16px;

    }


    button {

        min-height:
            54px;

    }

}


/* ============================================================
   PETITS IPHONE
============================================================ */

@media (max-width: 380px) {

    body {

        padding:
            12px 10px;

    }


    .card {

        padding:
            25px 17px;

        border-radius:
            19px;

    }


    .logo {

        width:
            68px;

        height:
            68px;

    }


    h1 {

        font-size:
            26px;

    }


    .subtitle {

        font-size:
            13px;

        line-height:
            1.6;

    }

}


/* ============================================================
   SAFE AREA IPHONE
============================================================ */

@supports (padding-bottom: env(safe-area-inset-bottom)) {

    body {

        padding-bottom:
            calc(
                20px +
                env(safe-area-inset-bottom)
            );

    }

}

</style>
</head>


<body>

<div class="card">

    <img
        src="../logo.png"
        class="logo"
        alt="GestUrg2"
    >

    <h1>
        Espace patient
    </h1>

    <div class="subtitle">
        Pour des raisons de sécurité, nous vous demandons d'entrer la date de naissance du patient hospitalisé au format JJ/MM/AAAA (01/01/2000 par exemple)
    </div>


    <div id="loading">
        Vérification du lien...
    </div>


    <div id="error"></div>


    <div id="formulaire">

        <label for="dateNaissance">
            Date de naissance
        </label>

        <input
            id="dateNaissance"
            type="date"
            autocomplete="bday"
        >

        <button
            id="btnConnexion"
            type="button"
        >
            Accéder à mes documents
        </button>

    </div>

</div>


<script>

const SERVER =
    "https://gesturg2-server.onrender.com";


// ======================================================
// RÉCUPÉRER LE TOKEN
// ======================================================

const params =
    new URLSearchParams(
        window.location.search
    );

const token =
    params.get("token");


// ======================================================
// ÉLÉMENTS
// ======================================================

const loading =
    document.getElementById("loading");

const errorElement =
    document.getElementById("error");

const formulaire =
    document.getElementById("formulaire");

const dateNaissance =
    document.getElementById("dateNaissance");

const btnConnexion =
    document.getElementById("btnConnexion");


// ======================================================
// AFFICHER ERREUR
// ======================================================

function afficherErreur(message) {

    errorElement.textContent =
        message;

    errorElement.style.display =
        "block";
}


// ======================================================
// VÉRIFIER LE TOKEN
// ======================================================

async function verifierLien() {

    if (!token) {

        formulaire.style.display =
            "none";

        afficherErreur(
            "Lien d'accès manquant ou invalide."
        );

        return;
    }

    loading.style.display =
        "block";

    try {

        const response =
            await fetch(
                `${SERVER}/api/patient-access/verify`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            token
                        })
                }
            );

        const resultat =
            await response.json();

        console.log(
            "Vérification du lien :",
            resultat
        );

        if (!response.ok || !resultat.success) {

            formulaire.style.display =
                "none";

            afficherErreur(
                resultat.error ||
                "Lien invalide ou expiré."
            );

            return;
        }

        // Le lien est valide.
        // On laisse le formulaire visible.

    } catch (error) {

        console.error(
            "Erreur vérification lien :",
            error
        );

        formulaire.style.display =
            "none";

        afficherErreur(
            "Impossible de contacter le serveur."
        );

    } finally {

        loading.style.display =
            "none";
    }
}


// ======================================================
// AUTHENTIFICATION
// ======================================================

btnConnexion.addEventListener(
    "click",
    async () => {

        errorElement.style.display =
            "none";

        if (!dateNaissance.value) {

            afficherErreur(
                "Veuillez saisir votre date de naissance."
            );

            return;
        }

        if (!token) {

            afficherErreur(
                "Lien d'accès invalide."
            );

            return;
        }

        btnConnexion.disabled =
            true;

        btnConnexion.textContent =
            "Vérification...";

        try {

            // ==================================================
            // AUTHENTIFICATION
            // ==================================================

            const response =
                await fetch(
                    `${SERVER}/api/patient-access/authenticate`,
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                token,
                                dateNaissance:
                                    dateNaissance.value
                            })
                    }
                );

            const resultat =
                await response.json();

            console.log(
                "Authentification :",
                resultat
            );

            if (!response.ok || !resultat.success) {

                afficherErreur(
                    resultat.error ||
                    "Date de naissance incorrecte."
                );

                return;
            }


            // ==================================================
            // VÉRIFIER QUE LA SESSION EXISTE BIEN
            // ==================================================

            const sessionResponse =
                await fetch(
                    `${SERVER}/api/patient-access/session`,
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );

            const session =
                await sessionResponse.json();

            console.log(
                "Session patient :",
                session
            );

            if (
                !sessionResponse.ok ||
                !session.success
            ) {

                afficherErreur(
                    "La session patient n'a pas pu être créée."
                );

                return;
            }


            // ==================================================
            // AUTHENTIFICATION COMPLÈTE
            // ==================================================

            console.log(
                "Session patient valide."
            );

            // Le token présent dans l'URL
            // n'est plus nécessaire.

            window.location.href =
                "patient.html";

        } catch (error) {

            console.error(
                "Erreur authentification :",
                error
            );

            afficherErreur(
                "Impossible de contacter le serveur."
            );

        } finally {

            btnConnexion.disabled =
                false;

            btnConnexion.textContent =
                "Accéder à mes documents";
        }
    }
);


// ======================================================
// DÉMARRAGE
// ======================================================

verifierLien();

</script>

</body>

</html>
