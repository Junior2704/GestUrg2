<html lang="fr">

<style>

*{

}

body{

    height:100vh;

}


#app{
    height:100vh;
    display:flex;
}


/* SIDEBAR */

    font-weight:600;

}


.bloc{

    padding:15px;
    border-bottom:1px solid #eee;

}


.bloc-titre{

    font-size:13px;
    font-weight:600;
    color:#555;
    margin-bottom:8px;

}


select,
input,
textarea{

    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ddd;

#filtre-type{

    margin-bottom:10px;

}


#recherche-users{

}


#liste-users{

    flex:1;

}


.user-ligne{

    align-items:center;
    gap:10px;

.user-ligne input{

}


.user-nom{

}


.user-email{

    color:#777;

}


.type-badge{

    color:#0078d4;
    padding:2px 6px;

.tous-ligne{

    display:flex;

/* PANEL PRINCIPAL */

#panel{

    flex:1;
    display:flex;
    flex-direction:column;
    overflow:auto;

}


#onglets{

    display:flex;
    background:white;
    border-bottom:1px solid #ddd;
    overflow-x:auto;

}


.onglet{

    padding:18px 22px;

    font-weight:600;
    color:#777;
    border-bottom:3px solid transparent;

.onglet.actif{

    color:#0078d4;

}


#contenu{

    flex:1;
    padding:25px;
    max-width:750px;

}


.vue{

    display:none;

}


.vue.actif{

    display:block;

}


label{

    display:block;
    font-size:13px;
    font-weight:600;
    color:#555;
    margin:15px 0 6px;

}


label:first-child{

    margin-top:0;

}


textarea{

    resize:vertical;
    min-height:100px;

}


button{

    border:none;
    background:#0078d4;
    color:white;
    padding:12px 20px;
    border-radius:20px;
    cursor:pointer;
    font-size:14px;
    margin-top:15px;

}


button.secondaire{

    background:#eef4fb;
    color:#0078d4;
    padding:8px 14px;
    border-radius:10px;
    margin-top:8px;
    font-size:13px;

}


.option-row{

    display:flex;
    gap:8px;
    margin-bottom:8px;

}


.option-row button{

    margin:0;
    padding:8px 12px;
    background:#f4f4f4;
    color:#c00;

}


.radio-row{

    display:flex;
    gap:20px;
    margin-top:4px;

}


.radio-row label{

    display:flex;
    align-items:center;
    gap:6px;
    font-weight:400;
    color:#222;
    margin:0;
    font-size:14px;

}


.radio-row input{

    width:auto;

}


/* CARTES SONDAGES / HISTORIQUE */

.carte{

    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px #0001;

}


.carte-header{

    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
    gap:10px;
    flex-wrap:wrap;

}


.carte-meta{

    font-size:12px;
    color:#777;
    white-space:nowrap;

}


.resultat-option{

    position:relative;
    background:#f0f7ff;
    border-radius:8px;
    margin-bottom:6px;
    overflow:hidden;

}


.resultat-bar{

    position:absolute;
    left:0;
    top:0;
    bottom:0;
    background:#cfe4fb;

}


.resultat-label{

    position:relative;
    display:flex;
    justify-content:space-between;
    padding:8px 12px;

}


.detail-votes{

    display:none;
    margin-top:12px;
    border-top:1px solid #eee;

}

}

    display:flex;

}


</style>

<body>

<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,
doc,
getDoc,
getDocs,
collection,
query,
where,
onSnapshot,
addDoc,
updateDoc,
serverTimestamp,
increment,
orderBy

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",
  authDomain: "urgences-a8ed4.firebaseapp.com",
  projectId: "urgences-a8ed4",
  storageBucket: "urgences-a8ed4.firebasestorage.app",
  messagingSenderId: "392921498200",
  appId: "1:392921498200:web:7ccce767332c67c697c02d",
  measurementId: "G-C74MK2KYDL"
};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const auth=getAuth(app);


/* code de la page, à faire correspondre au champ
   "pages" du document medecins de l'administrateur */

const CODE_PAGE="messagerieadministration";


/*
===========================
COMPTES ADMINISTRATEURS
===========================
Modifiable librement : ajouter / retirer des comptes
depuis lesquels les messages peuvent être envoyés.
*/

let COMPTES_ADMIN = [];

async function chargerComptesAdmin() {
  const user = auth.currentUser;
  if (!user) return;

  const userRef = doc(db, "users", user.uid);
  const userSnap = await getDoc(userRef);

  if (!userSnap.exists()) return;

  const pages = userSnap.data().pages || {};

  COMPTES_ADMIN = [];

  if (pages.msgsysteme === true) {
    COMPTES_ADMIN.push({
      id: "systeme",
      nom: "Système",
      icon: "⚙️"
    });
  }

  if (pages.msgadminmed === true) {
    COMPTES_ADMIN.push({
      id: "admin-medical",
      nom: "Administration médicale",
      icon: "🏥"
    });
  }

  if (pages.msgrh === true) {
    COMPTES_ADMIN.push({
      id: "rh",
      nom: "Ressources Humaines",
      icon: "🗂️"
    });
  }

  console.log("Comptes autorisés :", COMPTES_ADMIN);
}


const comptesParId={};

COMPTES_ADMIN.forEach(c=>{
comptesParId[c.id]=c;
});


/*
===========================
TYPES D'UTILISATEURS
===========================
Correspond au champ "type" de la collection medecins.
*/

const TYPES_UTILISATEURS=[

{ id:"doc", label:"Médecin" },
{ id:"infirmier", label:"Infirmier" },
{ id:"AS", label:"Aide Soignant" },
{ id:"Int", label:"Interne" },
{ id:"Ext", label:"Externe" }

];


const typesParId={};

TYPES_UTILISATEURS.forEach(t=>{
typesParId[t.id]=t;
});



let utilisateur=null;

let tousLesUsers=[];

const selectionUids=new Set();

let modeTous=false;


let sondagesDataCache=[];

let diffusionsDataCache=[];




/*
===========================
CONNEXION / VÉRIFICATION ACCÈS
===========================
*/


onAuthStateChanged(auth,async(user)=>{


if(!user){

afficherAccesRefuse(
"Vous devez être connecté pour accéder à cette page."
);

return;

}


utilisateur=user;


const snap=
await getDoc(
doc(db,"medecins",user.uid)
);


if(
!snap.exists() ||
!snap.data().pages ||
snap.data().pages[CODE_PAGE]!==true
){

afficherAccesRefuse(
"Vous n'avez pas accès à la messagerie administrateur."
);

return;

}


construireInterface();


});



function afficherAccesRefuse(message){

document.getElementById("app").innerHTML=`

<div class="acces-refuse">
🔒 Accès refusé<br><br>
${message}
</div>

`;

}




/*
===========================
UTILITAIRE : NOM D'UN UTILISATEUR
===========================
*/


function nomUtilisateur(uid){

const u=
tousLesUsers.find(x=>x.uid===uid);

if(!u)
return uid;

const nom=
`${u.nom || ""}`.trim();

return nom || uid;

}




/*
===========================
CONSTRUCTION DE L'INTERFACE
===========================
*/


function construireInterface(){


document.getElementById("app").innerHTML=`

<div id="sidebar">

<div class="header">
🛠️ Messagerie - Administration
</div>


<div class="bloc">

<div class="bloc-titre">Compte expéditeur</div>

<select id="compte-select">

${COMPTES_ADMIN.map(c=>
`<option value="${c.id}">${c.icon} ${c.nom}</option>`
).join("")}

</select>

</div>


<div class="bloc" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">

<div class="bloc-titre">Destinataires</div>

<select id="filtre-type">
<option value="">Tous les types</option>
${TYPES_UTILISATEURS.map(t=>
`<option value="${t.id}">${t.label}</option>`
).join("")}
</select>

<input id="recherche-users" placeholder="Rechercher un utilisateur...">

<div class="tous-ligne">
<input type="checkbox" id="check-tous">
<span>Tous les utilisateurs (selon filtre)</span>
</div>

<div id="liste-users"></div>

</div>


</div>



<div id="panel">


<div id="onglets">

<div class="onglet actif" data-vue="vue-message">Message</div>
<div class="onglet" data-vue="vue-sondage">Créer un sondage</div>
<div class="onglet" data-vue="vue-resultats">Sondages envoyés</div>
<div class="onglet" data-vue="vue-historique">Historique des messages</div>

</div>


<div id="contenu">


<div class="vue actif" id="vue-message">

<label>Message à envoyer</label>

<textarea id="message-input" placeholder="Votre message..."></textarea>

<button onclick="envoyerMessage()">Envoyer le message</button>

</div>



<div class="vue" id="vue-sondage">

<label>Type de sondage</label>

<div class="radio-row">

<label>
<input type="radio" name="type-sondage" value="simple" checked>
Choix simple
</label>

<label>
<input type="radio" name="type-sondage" value="multiple">
Choix multiple
</label>

</div>


<label>Question du sondage</label>

<input id="sondage-question" placeholder="Ex : Préférez-vous garder les horaires actuels ?">

<label>Options de réponse</label>

<div id="options-container">

<div class="option-row">
<input class="option-input" placeholder="Option 1">
</div>

<div class="option-row">
<input class="option-input" placeholder="Option 2">
</div>

</div>

<button type="button" class="secondaire" onclick="ajouterOption()">
+ Ajouter une option
</button>

<br>

<button onclick="creerSondage()">Créer et envoyer le sondage</button>

</div>



<div class="vue" id="vue-resultats">

<div id="liste-sondages"></div>

</div>



<div class="vue" id="vue-historique">

<div id="liste-historique"></div>

</div>


</div>


</div>

`;


initOnglets();

chargerUtilisateurs();

chargerSondagesAdmin();

chargerDiffusionsAdmin();


}




/*
===========================
ONGLETS
===========================
*/


function initOnglets(){


document
.querySelectorAll(".onglet")
.forEach(onglet=>{

onglet.onclick=()=>{

document
.querySelectorAll(".onglet")
.forEach(o=>o.classList.remove("actif"));

document
.querySelectorAll(".vue")
.forEach(v=>v.classList.remove("actif"));

onglet.classList.add("actif");

document
.getElementById(onglet.dataset.vue)
.classList.add("actif");

};

});


}




/*
===========================
LISTE DES UTILISATEURS
===========================
*/


function chargerUtilisateurs(){


onSnapshot(

collection(db,"medecins"),

(snap)=>{

tousLesUsers=[];

snap.forEach(docSnap=>{

tousLesUsers.push({
uid:docSnap.id,
...docSnap.data()
});

});

afficherUtilisateurs();

}

);


document
.getElementById("recherche-users")
.addEventListener("input",afficherUtilisateurs);


document
.getElementById("filtre-type")
.addEventListener("change",afficherUtilisateurs);


document
.getElementById("check-tous")
.addEventListener("change",(e)=>{

modeTous=e.target.checked;

document
.querySelectorAll(".user-checkbox")
.forEach(c=>{
c.disabled=modeTous;
});

});


}



function getUtilisateursFiltres(){


const filtreTexte=
(document.getElementById("recherche-users").value || "")
.toLowerCase();


const filtreType=
document.getElementById("filtre-type").value;


return tousLesUsers.filter(u=>{

const texte=
`${u.nom || ""} ${u.email || ""}`
.toLowerCase();

const matchTexte=
texte.includes(filtreTexte);

const matchType=
!filtreType || u.type===filtreType;

return matchTexte && matchType;

});


}



function afficherUtilisateurs(){


const zone=
document.getElementById("liste-users");


zone.innerHTML="";


getUtilisateursFiltres().forEach(u=>{


const div=
document.createElement("div");

div.className="user-ligne";


const typeLabel=
typesParId[u.type] ?
typesParId[u.type].label :
(u.type || "");


div.innerHTML=`

<input type="checkbox"
class="user-checkbox"
data-uid="${u.uid}"
${selectionUids.has(u.uid)?"checked":""}
${modeTous?"disabled":""}>

<div>

<div class="user-nom">
${u.nom || ""}
${typeLabel?`<span class="type-badge">${typeLabel}</span>`:""}
</div>

<div class="user-email">
${u.email || ""}
</div>

</div>

`;


div
.querySelector(".user-checkbox")
.addEventListener("change",(e)=>{

if(e.target.checked){
selectionUids.add(u.uid);
}else{
selectionUids.delete(u.uid);
}

});


zone.appendChild(div);


});


}



function getDestinataires(){


if(modeTous){

return getUtilisateursFiltres().map(u=>u.uid);

}


return Array.from(selectionUids);


}




/*
===========================
CONVERSATION (créer si besoin)
===========================
*/


async function trouverOuCreerConversation(uid,compte){


const q=query(

collection(db,"messageries"),

where("participants","array-contains",uid),
where("compteId","==",compte.id)

);


const snap=
await getDocs(q);


if(!snap.empty){

return snap.docs[0].id;

}


const ref=
await addDoc(

collection(db,"messageries"),

{

participants:[uid],
compteId:compte.id,
titre:compte.nom,
icon:compte.icon,
lastMessage:"",
createdAt:serverTimestamp(),
updatedAt:serverTimestamp()

}

);


return ref.id;


}



function creerStatutsInitiaux(destinataires){


const statuts={};


destinataires.forEach(uid=>{

statuts[uid]={

distribue:true,
lu:false,
luLe:null

};

});


return statuts;


}




/*
===========================
ENVOI D'UN MESSAGE
===========================
*/


window.envoyerMessage=async()=>{


const compte=
comptesParId[
document.getElementById("compte-select").value
];


const texte=
document
.getElementById("message-input")
.value.trim();


if(!texte){
alert("Veuillez saisir un message.");
return;
}


const destinataires=
getDestinataires();


if(destinataires.length===0){
alert("Sélectionnez au moins un destinataire.");
return;
}


const diffusionRef=
await addDoc(

collection(db,"diffusions"),

{

type:"message",
texte,
compteId:compte.id,
compteNom:compte.nom,
destinataires,
statuts:creerStatutsInitiaux(destinataires),
createdAt:serverTimestamp()

}

);


for(const uid of destinataires){

const convId=
await trouverOuCreerConversation(uid,compte);

await addDoc(

collection(db,"messageries",convId,"messages"),

{

auteur:compte.id,
auteurNom:compte.nom,
type:"message",
texte,
diffusionId:diffusionRef.id,
date:serverTimestamp(),
luPar:[]

}

);


await updateDoc(

doc(db,"messageries",convId),

{

lastMessage:texte,
updatedAt:serverTimestamp(),
[`nonLus.${uid}`]:increment(1)

}

);


}


document.getElementById("message-input").value="";


alert(
"Message envoyé à "+
destinataires.length+
" utilisateur(s)."
);


};




/*
===========================
CRÉATION D'UN SONDAGE
===========================
*/


window.ajouterOption=()=>{


const container=
document.getElementById("options-container");


const div=
document.createElement("div");


div.className="option-row";


div.innerHTML=`

<input class="option-input" placeholder="Option">

<button type="button" onclick="this.parentElement.remove()">
✕
</button>

`;


container.appendChild(div);


};



window.creerSondage=async()=>{


const compte=
comptesParId[
document.getElementById("compte-select").value
];


const typeSondage=
document.querySelector('input[name="type-sondage"]:checked').value;


const question=
document
.getElementById("sondage-question")
.value.trim();


const options=
Array.from(
document.querySelectorAll(".option-input")
)
.map(i=>i.value.trim())
.filter(v=>v.length>0);


if(!question || options.length<2){
alert("Une question et au moins 2 options sont nécessaires.");
return;
}


const destinataires=
getDestinataires();


if(destinataires.length===0){
alert("Sélectionnez au moins un destinataire.");
return;
}


const sondageRef=
await addDoc(

collection(db,"sondages"),

{

question,
options,
type:typeSondage,
compteId:compte.id,
compteNom:compte.nom,
destinataires,
reponses:{},
statuts:creerStatutsInitiaux(destinataires),
createdAt:serverTimestamp()

}

);


for(const uid of destinataires){

const convId=
await trouverOuCreerConversation(uid,compte);

await addDoc(

collection(db,"messageries",convId,"messages"),

{

auteur:compte.id,
auteurNom:compte.nom,
type:"sondage",
sondageId:sondageRef.id,
date:serverTimestamp(),
luPar:[]

}

);


await updateDoc(

doc(db,"messageries",convId),

{

lastMessage:"📊 Sondage : "+question,
updatedAt:serverTimestamp(),
[`nonLus.${uid}`]:increment(1)

}

);


}


document.getElementById("sondage-question").value="";

document
.querySelectorAll(".option-input")
.forEach(i=>i.value="");


alert(
"Sondage envoyé à "+
destinataires.length+
" utilisateur(s)."
);


};




/*
===========================
UTILITAIRE : TEXTE DE RÉPONSE À UN SONDAGE
===========================
*/


function texteReponseSondage(sondage,uid){


const rep=
(sondage.reponses || {})[uid];


if(rep===undefined)
return "";


if(Array.isArray(rep)){

return rep
.map(i=>sondage.options[i])
.filter(Boolean)
.join(", ");

}


return sondage.options[rep] || "";


}




/*
===========================
ONGLET : SONDAGES ENVOYÉS (avec détail des votes)
===========================
*/


function chargerSondagesAdmin(){


const q=query(

collection(db,"sondages"),

orderBy("createdAt","desc")

);


onSnapshot(q,(snap)=>{

sondagesDataCache=[];

snap.forEach(d=>{

sondagesDataCache.push({
id:d.id,
...d.data()
});

});

afficherSondagesEnvoyes();

afficherHistorique();

});


}



function afficherSondagesEnvoyes(){


const zone=
document.getElementById("liste-sondages");


if(!zone)
return;


zone.innerHTML="";


if(sondagesDataCache.length===0){

zone.innerHTML=
`<div class="empty">Aucun sondage envoyé pour le moment.</div>`;

return;

}


sondagesDataCache.forEach(s=>{


const reponses=
s.reponses || {};


const totalReponses=
Object.keys(reponses).length;


const totalDestinataires=
(s.destinataires || []).length;


const estMultiple=
s.type==="multiple";


const optionsHTML=

(s.options || [])

.map((opt,i)=>{

const nbVoix=
Object.values(reponses)
.filter(v=>
Array.isArray(v) ?
v.includes(i) :
v===i
).length;

const pourcentage=
totalReponses>0 ?
Math.round((nbVoix/totalReponses)*100) :
0;

return `

<div class="resultat-option">

<div class="resultat-bar" style="width:${pourcentage}%;"></div>

<div class="resultat-label">
<span>${opt}</span>
<span>${pourcentage}% (${nbVoix})</span>
</div>

</div>

`;

})

.join("");


const detailHTML=

(s.destinataires || [])

.map(uid=>{

const reponseTexte=
texteReponseSondage(s,uid);

return `

<div class="detail-ligne">
<span>${nomUtilisateur(uid)}</span>
<span>${reponseTexte || "Pas encore répondu"}</span>
</div>

`;

})

.join("");


const div=
document.createElement("div");


div.className="carte";


div.innerHTML=`

<div class="carte-header">

<strong>${s.question}</strong>

<span class="carte-meta">
${s.compteNom || ""} ·
${estMultiple ? "choix multiple" : "choix simple"} ·
${totalReponses}/${totalDestinataires} réponses
</span>

</div>

${optionsHTML}

<button type="button" class="secondaire"
onclick="this.nextElementSibling.classList.toggle('actif')">
Voir le détail des votes
</button>

<div class="detail-votes">
${detailHTML}
</div>

`;


zone.appendChild(div);


});


}




/*
===========================
ONGLET : HISTORIQUE (messages + sondages, statut distribué/lu)
===========================
*/


function chargerDiffusionsAdmin(){


const q=query(

collection(db,"diffusions"),

orderBy("createdAt","desc")

);


onSnapshot(q,(snap)=>{

diffusionsDataCache=[];

snap.forEach(d=>{

diffusionsDataCache.push({
id:d.id,
...d.data()
});

});

afficherHistorique();

});


}



function afficherHistorique(){


const zone=
document.getElementById("liste-historique");


if(!zone)
return;


const items=[

...diffusionsDataCache.map(d=>({...d,_type:"message"})),
...sondagesDataCache.map(s=>({...s,_type:"sondage"}))

];


items.sort((a,b)=>{

const ta=
a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;

const tb=
b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;

return tb-ta;

});


zone.innerHTML="";


if(items.length===0){

zone.innerHTML=
`<div class="empty">Aucun envoi pour le moment.</div>`;

return;

}


items.forEach(item=>{


const destinataires=
item.destinataires || [];


const statuts=
item.statuts || {};


const nbLu=
Object.values(statuts)
.filter(s=>s.lu).length;


const dateTexte=
item.createdAt?.toDate ?
item.createdAt.toDate().toLocaleString() :
"";


const titre=
item._type==="sondage" ?
"📊 "+item.question :
"📨 "+(item.texte || "");


const detailHTML=

destinataires

.map(uid=>{

const st=
statuts[uid] || {};

const reponseTexte=
item._type==="sondage" ?
texteReponseSondage(item,uid) :
"";

return `

<div class="detail-ligne">

<span>${nomUtilisateur(uid)}</span>

<span>
${st.distribue ? "✅ Distribué" : "—"}
${st.lu ? " · 👁️ Lu" : " · Non lu"}
${reponseTexte ? " · Réponse : "+reponseTexte : ""}
</span>

</div>

`;

})

.join("");


const div=
document.createElement("div");


div.className="carte";


div.innerHTML=`

<div class="carte-header">

<strong>${titre}</strong>

<span class="carte-meta">
${item.compteNom || ""} ·
${dateTexte} ·
${nbLu}/${destinataires.length} lus
</span>

</div>

<button type="button" class="secondaire"
onclick="this.nextElementSibling.classList.toggle('actif')">
Voir le détail
</button>

<div class="detail-votes">
${detailHTML}
</div>

`;


zone.appendChild(div);


});


}


</script>
