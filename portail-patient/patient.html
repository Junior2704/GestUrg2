<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mes documents - GestUrg2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="../ordToPdf.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        #f4f7fa;

    color:
        #222;

}


header {

    background:
        #0078d4;

    color:
        white;

    padding:
        18px 25px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

}


header h1 {

    margin:
        0;

    font-size:
        22px;

}


.logout {

    border:
        none;

    background:
        rgba(255,255,255,.15);

    color:
        white;

    padding:
        10px 15px;

    border-radius:
        8px;

    cursor:
        pointer;

}


.container {

    max-width:
        900px;

    margin:
        30px auto;

    padding:
        0 20px;

}


.patient-card {

    background:
        white;

    padding:
        25px;

    border-radius:
        15px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.07);

    margin-bottom:
        25px;

}


.patient-card h2 {

    margin-top:
        0;

}


.documents {

    display:
        grid;

    gap:
        15px;

}


.document {

    background:
        white;

    border-radius:
        12px;

    padding:
        18px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.06);

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        15px;

}


.document-info {

    flex:
        1;

}


.document-title {

    font-weight:
        600;

    margin-bottom:
        5px;

}


.document-type {

    color:
        #777;

    font-size:
        14px;

}


.document button {

    border:
        none;

    background:
        #0078d4;

    color:
        white;

    padding:
        10px 15px;

    border-radius:
        8px;

    cursor:
        pointer;

}


.message {

    text-align:
        center;

    padding:
        40px;

    color:
        #777;

}


.error {

    color:
        #c62828;

}
/* ======================================================
   VIEWER PDF
====================================================== */

.pdf-viewer {

    position: fixed;

    inset: 0;

    background: #111;

    z-index: 99999;

    display: none;

    flex-direction: column;

}


/* HEADER */

.pdf-viewer-header {

    height: 60px;

    flex-shrink: 0;

    background: #0078d4;

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    font-weight: 600;

}


#btnFermerPdf {

    border: none;

    background: rgba(255,255,255,.15);

    color: white;

    padding: 9px 15px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 14px;

}


#btnFermerPdf:hover {

    background: rgba(255,255,255,.25);

}


/* PDF */

.pdf-viewer-content {

    flex: 1;

    min-height: 0;

    background: #333;

}


#pdfFrame {

    width: 100%;

    height: 100%;

    border: none;

    background: white;

}
</style>

</head>


<body>


<header>

    <h1>
        GestUrg2 — Espace patient
    </h1>

    <button
        class="logout"
        id="btnLogout"
    >
        Se déconnecter
    </button>

</header>


<div class="container">


    <div
        class="patient-card"
        id="patientCard"
    >

        Chargement...

    </div>


    <h2>
        Mes documents
    </h2>


    <div
        id="documents"
        class="documents"
    >

        <div class="message">
            Chargement des documents...
        </div>

    </div>

</div>
<!-- ======================================================
     VIEWER PDF
====================================================== -->

<div id="pdfViewer" class="pdf-viewer">

    <div class="pdf-viewer-header">

        <div id="pdfViewerTitle">
            Document
        </div>

        <button
            type="button"
            id="btnFermerPdf"
        >
            ✕ Fermer
        </button>

    </div>


    <div class="pdf-viewer-content">

        <iframe
            id="pdfFrame"
            title="Document PDF"
        ></iframe>

    </div>

</div>

<script>

const SERVER =
    "https://gesturg2-server.onrender.com";


let session = null;


// ======================================================
// CHARGER LA SESSION
// ======================================================

async function chargerSession() {

    try {

        const response =
            await fetch(
                `${SERVER}/api/patient-access/session`,
                {

                    method:
                        "GET",

                    credentials:
                        "include"

                }
            );


        const resultat =
            await response.json();


        if (!resultat.success) {

            window.location.href =
                "patient-login.html";

            return false;

        }


        session =
            resultat;


        console.log(
            "Session patient :",
            session
        );


        afficherPatient();


        return true;


    } catch (error) {

        console.error(error);

        document.getElementById(
            "patientCard"
        ).innerHTML = `
            <div class="error">
                Impossible de contacter le serveur.
            </div>
        `;

        return false;

    }

}


// ======================================================
// AFFICHER PATIENT
// ======================================================

function afficherPatient() {

    const patient =
        session.patient;


    document.getElementById(
        "patientCard"
    ).innerHTML = `

        <h2>
            Bonjour ${escapeHtml(
                patient.prenom
            )} ${escapeHtml(
                patient.nom
            )}
        </h2>

        <p>
            Vous êtes connecté à votre espace patient.
        </p>

    `;

}


// ======================================================
// CHARGER DOCUMENTS
// ======================================================

async function chargerDocuments() {

    const container =
        document.getElementById(
            "documents"
        );


    try {

        const response =
            await fetch(
                `${SERVER}/api/patient-access/documents`,
                {

                    method:
                        "GET",

                    credentials:
                        "include"

                }
            );


        const resultat =
            await response.json();


        if (!resultat.success) {

            if (
                response.status === 401
            ) {

                window.location.href =
                    "patient-login.html";

                return;

            }


            container.innerHTML = `
                <div class="message">
                    ${escapeHtml(
                        resultat.error ||
                        "Impossible de charger les documents."
                    )}
                </div>
            `;

            return;

        }


        if (
            !resultat.documents ||
            resultat.documents.length === 0
        ) {

            container.innerHTML = `
                <div class="message">
                    Aucun document disponible.
                </div>
            `;

            return;

        }


        container.innerHTML = "";


 resultat.documents.forEach(
    doc => {

        const element =
            document.createElement("div");

        element.className =
            "document";

        element.innerHTML = `

            <div class="document-info">

                <div class="document-title">
                    ${escapeHtml(
                        doc.titre ||
                        "Document"
                    )}
                </div>

                <div class="document-type">
                    ${escapeHtml(
                        doc.type ||
                        "Document médical"
                    )}
                </div>

            </div>

            <button type="button">
                Ouvrir
            </button>

        `;

        element
            .querySelector("button")
            .addEventListener(
                "click",
                () => {
                    ouvrirDocument(doc.id);
                }
            );

        container.appendChild(element);

    }
);
    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="message">
                Impossible de charger les documents.
            </div>
        `;

    }

}


// ======================================================
// OUVRIR UN DOCUMENT
// ======================================================

async function ouvrirDocument(documentId) {

    const viewer =
        document.getElementById("pdfViewer");

    const frame =
        document.getElementById("pdfFrame");

    const titre =
        document.getElementById("pdfViewerTitle");


    try {

        // ==================================================
        // AFFICHER LE VIEWER
        // ==================================================

        viewer.style.display = "flex";

        titre.textContent =
            "Chargement du document...";

        frame.src = "about:blank";


        // ==================================================
        // RÉCUPÉRER LE DOCUMENT
        // ==================================================

        const response =
            await fetch(
                `${SERVER}/api/patient-access/documents/${encodeURIComponent(documentId)}`,
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const resultat =
            await response.json();


        // ==================================================
        // ERREUR
        // ==================================================

        if (!resultat.success) {

            fermerViewerPdf();

            alert(
                resultat.error ||
                "Impossible d'ouvrir le document."
            );

            return;

        }


        const documentData =
            resultat.document;


        // ==================================================
        // VÉRIFICATION
        // ==================================================

        if (
            !documentData.ord ||
            typeof documentData.ord !== "object"
        ) {

            fermerViewerPdf();

            alert(
                "Ce document ne possède pas de format ORD valide."
            );

            return;

        }


        // ==================================================
        // TITRE
        // ==================================================

        titre.textContent =
            documentData.ord.titre ||
            documentData.type ||
            "Document médical";


        // ==================================================
        // GÉNÉRER LE PDF
        // ==================================================

        const pdfBlob =
            await ordToPDF(
                documentData.ord
            );


        // ==================================================
        // CRÉER URL TEMPORAIRE
        // ==================================================

        const pdfUrl =
            URL.createObjectURL(
                pdfBlob
            );


        // ==================================================
        // AFFICHER PDF
        // ==================================================

        frame.src =
            pdfUrl;


        // ==================================================
        // NETTOYAGE
        // ==================================================

        frame.dataset.pdfUrl =
            pdfUrl;


    } catch (error) {

        console.error(
            "Erreur ouverture document :",
            error
        );

        fermerViewerPdf();

        alert(
            "Impossible de générer le PDF."
        );

    }

}

function fermerViewerPdf() {

    const viewer =
        document.getElementById("pdfViewer");

    const frame =
        document.getElementById("pdfFrame");


    // Libérer l'URL Blob
    const ancienneUrl =
        frame.dataset.pdfUrl;


    if (ancienneUrl) {

        URL.revokeObjectURL(
            ancienneUrl
        );

    }


    frame.dataset.pdfUrl = "";

    frame.src = "about:blank";

    viewer.style.display = "none";

}
document
    .getElementById("btnFermerPdf")
    .addEventListener(
        "click",
        fermerViewerPdf
    );
    
document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            const viewer =
                document.getElementById(
                    "pdfViewer"
                );

            if (
                viewer.style.display ===
                "flex"
            ) {

                fermerViewerPdf();

            }

        }

    }
);
// ======================================================
// DÉCONNEXION
// ======================================================

document
    .getElementById("btnLogout")
    .addEventListener(
        "click",
        async () => {

            try {

                await fetch(
                    `${SERVER}/api/patient-access/logout`,
                    {

                        method:
                            "POST",

                        credentials:
                            "include"

                    }
                );

            } catch (error) {

                console.error(error);

            }


            window.location.href =
                "patient-login.html";

        }
    );


// ======================================================
// PROTECTION XSS
// ======================================================

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


// ======================================================
// DÉMARRAGE
// ======================================================

(async () => {

    const connecte =
        await chargerSession();

    if (!connecte) {
        return;
    }

    await chargerDocuments();

})();

</script>

</body>

</html>
