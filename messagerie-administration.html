<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Administration - Messagerie</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">


<style>


*{
box-sizing:border-box;
font-family:Inter,sans-serif;
}


body{

margin:0;
background:#f4f7fa;

}


.container{

max-width:1100px;
margin:auto;
padding:30px;

}


h1{

color:#0078d4;

}



.card{

background:white;
border-radius:15px;
padding:25px;
margin-bottom:20px;
box-shadow:0 5px 20px #0001;

}



input,select,textarea{

width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-top:10px;

}



textarea{

height:120px;
resize:none;

}



button{

background:#0078d4;
color:white;
border:0;
padding:12px 20px;
border-radius:20px;
cursor:pointer;

}



.user-list{

max-height:350px;
overflow:auto;

border:1px solid #eee;
margin-top:15px;

}



.user{

padding:12px;
border-bottom:1px solid #eee;
display:flex;
gap:10px;

}


.user:hover{

background:#eef7ff;

}



.actions{

display:flex;
gap:10px;
margin-top:15px;

}



.badge{

background:#0078d4;
color:white;
padding:5px 10px;
border-radius:20px;

}



</style>


</head>


<body>


<div class="container">


<h1>
🏥 Messagerie administration
</h1>



<div class="card">


<h3>Destinataires</h3>


<input id="recherche"
placeholder="🔎 Rechercher un utilisateur">



<select id="filtre">

<option value="all">
Tous les utilisateurs
</option>

</select>



<div class="actions">

<button onclick="toutSelectionner()">

Tout sélectionner

</button>


<button onclick="viderSelection()">

Tout désélectionner

</button>


</div>



<div id="compteur"></div>



<div id="users"
class="user-list">

</div>


</div>






<div class="card">


<h3>Message</h3>



<select id="source">


<option>
🏥 Administration
</option>


<option>
⚙️ Système
</option>


<option>
🖥 Informatique
</option>


<option>
🚑 Régulation
</option>


</select>




<textarea id="texte"
placeholder="Votre message..."></textarea>



<button onclick="envoyer()">

📨 Envoyer

</button>



</div>



</div>







<script type="module">


import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getFirestore,
collection,
getDocs,
doc,
addDoc,
setDoc,
serverTimestamp

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



import {

getAuth,
onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {
  apiKey: "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",
  authDomain: "urgences-a8ed4.firebaseapp.com",
  projectId: "urgences-a8ed4",
  storageBucket: "urgences-a8ed4.firebasestorage.app",
  messagingSenderId: "392921498200",
  appId: "1:392921498200:web:7ccce767332c67c697c02d",
  measurementId: "G-C74MK2KYDL"
};



const app=
initializeApp(firebaseConfig);


const db=
getFirestore(app);


const auth=
getAuth(app);
console.log("Firebase OK");



let adminUID=null;

let utilisateurs=[];

let selection=[];



/*
=====================
AUTH
=====================
*/


onAuthStateChanged(auth,(user)=>{


if(!user)
return;


adminUID=user.uid;


chargerUsers();


});






/*
=====================
CHARGEMENT USERS
=====================
*/

async function chargerUsers(){

    console.log("Chargement utilisateurs...");

    try {

        const snap = await getDocs(
            collection(db,"medecins")
        );


        console.log(
            "Nombre utilisateurs trouvés :",
            snap.size
        );


        utilisateurs=[];


        snap.forEach((d)=>{

            console.log(
                "Utilisateur :",
                d.id,
                d.data()
            );


            utilisateurs.push({

                id:d.id,
                ...d.data()

            });


        });


        afficherUsers();
        chargerFiltres();


    } catch(error){

        console.error(
            "Erreur chargement utilisateurs :",
            error
        );

        alert(
            "Erreur Firestore : " + error.message
        );

    }

}

function afficherUsers(){


const zone=
document.getElementById("users");


zone.innerHTML="";



let recherche=
document.getElementById("recherche").value
.toLowerCase();



let filtre=
document.getElementById("filtre").value;




utilisateurs
.filter(u=>{


let nom=
(u.nom || "")
.toLowerCase();


let prenom=
(u.prenom || "")
.toLowerCase();



let okRecherche=
nom.includes(recherche)
||
prenom.includes(recherche);



let okFiltre=
filtre=="all"
||
u.specialite==filtre;



return okRecherche && okFiltre;



})
.forEach(u=>{



let checked=
selection.includes(u.id)
?"checked":"";



let div=
document.createElement("div");


div.className="user";



div.innerHTML=`

<input type="checkbox"
${checked}
value="${u.id}">


<div>

<b>
${u.nom || ""}
${u.prenom || ""}
</b>

<br>

${u.specialite || ""}

</div>


`;



div.querySelector("input")
.onchange=(e)=>{


if(e.target.checked)

selection.push(u.id);


else

selection=
selection.filter(
x=>x!=u.id
);



majCompteur();



};



zone.appendChild(div);



});



majCompteur();


}








function chargerFiltres(){


let select=
document.getElementById("filtre");



let valeurs=
[...new Set(
utilisateurs
.map(u=>u.specialite)
.filter(Boolean)
)];



valeurs.forEach(v=>{


let o=
document.createElement("option");


o.value=v;

o.textContent=v;


select.appendChild(o);


});


}





document
.getElementById("recherche")
.oninput=afficherUsers;



document
.getElementById("filtre")
.onchange=afficherUsers;






window.toutSelectionner=()=>{


selection=
utilisateurs.map(u=>u.id);


afficherUsers();


}





window.viderSelection=()=>{


selection=[];


afficherUsers();


}




function majCompteur(){


document
.getElementById("compteur")
.innerHTML=

`

<span class="badge">

${selection.length}
sélectionné(s)

</span>

`;

}







/*
=========================
ENVOI
=========================
*/



window.envoyer=async()=>{


if(selection.length==0){

alert("Aucun destinataire");
return;

}



let texte=
document.getElementById("texte")
.value.trim();



if(!texte)
return;




let source=
document.getElementById("source")
.value;



for(const uid of selection){



let conversation=await addDoc(

collection(db,"messageries"),

{

titre:
source,

icon:
source.substring(0,2),


source,

participants:
[
adminUID,
uid
],


lastMessage:
texte,


updatedAt:
serverTimestamp()


}

);





await addDoc(

collection(
db,
"messageries",
conversation.id,
"messages"
),

{

auteur:
adminUID,

auteurNom:
"Administration",

texte,

date:
serverTimestamp(),

luPar:
[
adminUID
]


}

);



}



alert(
"Messages envoyés avec succès"
);



};



</script>


<script>

console.log("HTML CHARGE");

</script>
</body>
</html>
