// Mascotte 2.5D : l'image d'origine découpée en calques, animée sur canvas 2D.
// const m = createMascot2D(canvas, { base: 'layers/' });   // ou { urls: {body:'data:...', ...} }
// m.play('hello'|'wave'|'nod'|'shake'|'jump'|'think') · m.setTalking(true) · m.lookAt(x, y) · m.destroy()
const NAMES = ['body','arm','head','visor','eyeL','eyeR','browL','browR','mouth','headset','spark0','spark1','spark2'];
const W = 588, H = 720;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, t) => a + (b - a) * t;

function createMascot2D(canvas, opts = {}) {
  const META = opts.meta;
  const imgs = {};
  const ready = Promise.all(NAMES.map((n) => new Promise((res) => {
    const im = new Image(); im.onload = res; im.onerror = res;
    im.src = opts.urls ? opts.urls[n] : (opts.base || 'layers/') + n + '.png'; imgs[n] = im;
  })));
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * 1.5;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas'); off.width = canvas.width; off.height = canvas.height;
  const octx = off.getContext('2d');

  const draw = (c, n, dx = 0, dy = 0) => { const m = META[n]; c.drawImage(imgs[n], m.x + dx, m.y + dy); };
  const center = (n) => [META[n].x + META[n].w / 2, META[n].y + META[n].h / 2];
  const about = (c, px, py, fn) => { c.translate(px, py); fn(); c.translate(-px, -py); };

  let t = 0, talking = false, blinkT = 1.5, blinkP = -1, raf = 0, last = 0;
  const look = { x: 0, y: 0, tx: 0, ty: 0 };
  const active = [];
  const ACTIONS = {
    wave:  { dur: 2.4, fn: (P, a, w) => { P.arm += 0.11 * Math.sin(a * 10) * w; P.sparks = w; P.brow -= 4 * w; } },
    hello: { dur: 3.4, fn: (P, a, w) => { P.arm += 0.11 * Math.sin(a * 10) * w; P.sparks = w; P.brow -= 4 * w; P.talk = Math.max(P.talk, w * (0.5 + 0.5 * Math.sin(a * 14))); P.hrz += 0.02 * Math.sin(a * 3) * w; } },
    nod:   { dur: 1.2, fn: (P, a, w) => { P.hy += 9 * Math.sin(a * 4 * Math.PI) * w; P.hrz += 0.015 * Math.sin(a * 4 * Math.PI) * w; P.lookY -= 0.5 * Math.sin(a * 4 * Math.PI) * w; } },
    shake: { dur: 1.3, fn: (P, a, w) => { P.yaw += 0.9 * Math.sin(a * 2 * Math.PI * 2.2) * w; P.hrz += 0.03 * Math.sin(a * 2 * Math.PI * 2.2) * w; } },
    jump:  { dur: 0.9, fn: (P, a, w, k) => { const s = Math.sin(clamp(k, 0, 1) * Math.PI); P.y -= 70 * s; P.sq += k < 0.15 ? 0.05 * (1 - k / 0.15) : -0.03 * s; P.sparks = s; P.brow -= 5 * s; P.arm += 0.1 * s; } },
    think: { dur: 2.5, fn: (P, a, w) => { P.hrz += 0.05 * w; P.lookX += 0.7 * w; P.lookY += 0.6 * w; P.brow -= 3 * w; } },
  };

  function frame(dt) {
    t += dt;
    look.x = lerp(look.x, look.tx, 1 - Math.exp(-dt * 8)); look.y = lerp(look.y, look.ty, 1 - Math.exp(-dt * 8));
    const P = { y: 0, sq: 0, hx: 0, hy: 0, hrz: 0, yaw: 0, arm: 0, brow: 0, talk: 0, sparks: 0, lookX: look.x, lookY: look.y };
    P.y += 3 * Math.sin(t * 2); P.sq += 0.008 * Math.sin(t * 2 + 0.6);
    P.hrz += 0.012 * Math.sin(t * 1.1); P.yaw += 0.25 * Math.sin(t * 0.7); P.hy += 1.5 * Math.sin(t * 2 + 1);
    P.arm += 0.012 * Math.sin(t * 2.4);
    P.sparks = 0.7 + 0.25 * Math.sin(t * 3);
    for (let i = active.length - 1; i >= 0; i--) {
      const a = active[i]; a.time += dt;
      let w;
      if (a.stopping) { a.fade -= dt * 4; w = ease(clamp(a.fade, 0, 1)); if (a.fade <= 0) { active.splice(i, 1); continue; } }
      else { const k = a.time / a.def.dur; if (k >= 1 && !a.loop) { active.splice(i, 1); continue; } w = a.loop ? ease(clamp(a.time * 4, 0, 1)) : ease(clamp(Math.min(a.time, a.def.dur - a.time) * 4, 0, 1)); }
      a.def.fn(P, a.time, w, a.time / a.def.dur);
    }
    if (talking) P.talk = Math.max(P.talk, 0.5 + 0.35 * Math.sin(t * 13) * Math.sin(t * 5.3 + 1) + 0.15 * Math.sin(t * 21));
    // clignement
    blinkT -= dt; if (blinkT <= 0 && blinkP < 0) blinkP = 0;
    let bl = 0;
    if (blinkP >= 0) { blinkP += dt / 0.17; bl = Math.sin(clamp(blinkP, 0, 1) * Math.PI); if (blinkP >= 1) { blinkP = -1; blinkT = 2 + Math.random() * 3.5; if (Math.random() < 0.2) blinkT = 0.3; } }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(0, P.y);
    about(ctx, 294, 705, () => ctx.scale(1 - P.sq * 0.5, 1 + P.sq));
    // corps + bras
    draw(ctx, 'body');
    ctx.save(); about(ctx, 446, 492, () => ctx.rotate(P.arm)); draw(ctx, 'arm'); ctx.restore();
    // tête
    ctx.save();
    {
      about(ctx, 292, 468, () => { ctx.rotate(P.hrz); ctx.translate(P.hx, P.hy); });
      draw(ctx, 'head');
      // traits du visage : parallaxe, puis découpe dans la visière
      octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, off.width, off.height);
      octx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const fx = P.yaw * 9 + P.lookX * 9, fy = P.lookY * -5;
      octx.save(); octx.translate(fx, fy);
      for (const e of ['eyeL', 'eyeR']) {
        const [cx, cy] = center(e);
        octx.save(); octx.translate(cx + P.lookX * 3, cy + P.lookY * -2); octx.scale(1 + 0.04 * bl, Math.max(0.06, 1 - bl * 0.94)); octx.translate(-cx, -cy);
        draw(octx, e); octx.restore();
      }
      for (const b of ['browL', 'browR']) { octx.save(); octx.translate(0, P.brow - bl * 1.5); draw(octx, b); octx.restore(); }
      const mo = META.mouth, mx = mo.x + mo.w / 2, my = mo.y + 6;
      const open = P.talk > 0 ? clamp(0.3 + P.talk * 0.8, 0.3, 1.1) : 1;
      octx.save(); octx.translate(mx, my); octx.scale(1, open); octx.translate(-mx, -my); draw(octx, 'mouth'); octx.restore();
      octx.restore();
      octx.save(); octx.globalCompositeOperation = 'destination-in'; draw(octx, 'visor'); octx.restore();
      ctx.drawImage(off, 0, 0, W, H);
      draw(ctx, 'headset', -P.yaw * 3, 0);
    }
    ctx.restore();
    // étincelles
    ['spark0', 'spark1', 'spark2'].forEach((n, i) => {
      const s = clamp(P.sparks, 0, 1.2) * (0.85 + 0.15 * Math.sin(t * 6 + i * 2));
      const [cx, cy] = center(n);
      ctx.save(); ctx.globalAlpha = clamp(0.2 + s, 0, 1); about(ctx, cx, cy, () => ctx.scale(0.5 + 0.5 * s, 0.5 + 0.5 * s)); draw(ctx, n); ctx.restore();
    });
    ctx.restore();
  }

  function loop(ts) { const dt = Math.min((ts - (last || ts)) / 1000, 0.1); last = ts; frame(dt); raf = requestAnimationFrame(loop); }
  ready.then(() => { raf = requestAnimationFrame(loop); });

  return {
    ready, frame,
    actions: Object.keys(ACTIONS),
    play(name, { loop = false } = {}) { const def = ACTIONS[name]; if (!def) return; const ex = active.find((a) => a.name === name && !a.stopping); if (ex) { ex.time = 0; ex.loop = loop; return; } active.push({ name, def, time: 0, loop, stopping: false, fade: 1 }); },
    stop(name) { active.forEach((a) => { if (!name || a.name === name) a.stopping = true; }); },
    setTalking(v) { talking = !!v; },
    lookAt(x, y) { look.tx = clamp(x, -1, 1); look.ty = clamp(y, -1, 1); },
    destroy() { cancelAnimationFrame(raf); },
  };
}

const canvas=document.getElementById('c');
const m=createMascot2D(canvas,{meta:META,urls:URLS});
window.mascot=m;
// Pilotage par postMessage. Exemples (depuis la console de la page parente) :
//   frame.contentWindow.postMessage({action:'hello'}, '*')          // dire bonjour
//   frame.contentWindow.postMessage({action:'talk', value:true}, '*') // parler / arrêter (value:false)
//   frame.contentWindow.postMessage({action:'look', x:0.5, y:0}, '*') // regarder (x,y entre -1 et 1)
//   frame.contentWindow.postMessage({action:'stop'}, '*')             // arrêter les animations en boucle
// Animations : hello, wave, nod, shake, jump, think. Ajouter loop:true pour répéter jusqu'à stop.
addEventListener('message',(e)=>{
  const d=e.data; if(!d||typeof d!=='object') return;
  const a=d.action; if(!a) return;
  if(a==='play') m.play(d.name,{loop:!!d.loop});
  else if(m.actions.includes(a)) m.play(a,{loop:!!d.loop});
  else if(a==='talk') m.setTalking(d.value!==false);
  else if(a==='look') m.lookAt(+d.x||0,+d.y||0);
  else if(a==='stop') m.stop(d.name);
});
m.ready.then(()=>{ try{ parent.postMessage({type:'mascot-ready',actions:m.actions},'*'); }catch(_){} });
</script></body></html>
