<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Messagerie - GestUrg2</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    margin:0;
    height:100vh;
    background:#f4f7fa;
    color:#222;
}


/* CONTENEUR */

#app{
    height:100vh;
    display:flex;
}


/* LISTE DISCUSSIONS */

#sidebar{

    width:330px;
    background:white;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
}


.header{

    padding:20px;
    font-size:22px;
    font-weight:600;
    color:#0078d4;
    border-bottom:1px solid #eee;

}


#search{

    margin:15px;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
}



/* conversations */

#conversations{

    overflow:auto;
}


.conversation{

    padding:15px;
    display:flex;
    gap:12px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}


.conversation:hover{

    background:#f0f7ff;

}


.avatar{

    width:45px;
    height:45px;
    border-radius:50%;
    background:#0078d4;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;

}


.conv-text{

    flex:1;

}


.conv-title{

    font-weight:600;

}


.conv-last{

    font-size:13px;
    color:#777;
    margin-top:4px;

}


.badge{

    background:#d93025;
    color:white;
    border-radius:20px;
    padding:2px 8px;
    font-size:12px;

}


/* CHAT */


#chat{

    flex:1;
    display:flex;
    flex-direction:column;
}


#chat-header{

    height:70px;
    background:white;
    border-bottom:1px solid #ddd;
    padding:20px;
    font-size:18px;
    font-weight:600;

}


#messages{

    flex:1;
    padding:25px;
    overflow:auto;

}



.message{

    max-width:70%;
    margin-bottom:15px;
    padding:12px 16px;
    border-radius:15px;
    background:white;
    box-shadow:0 2px 8px #0001;

}


.message.mine{

    margin-left:auto;
    background:#0078d4;
    color:white;

}



.author{

    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;

}


.date{

    font-size:11px;
    opacity:.7;
    margin-top:5px;

}




#input-zone{

    background:white;
    padding:15px;
    display:flex;
    gap:10px;
    border-top:1px solid #ddd;

}


#message-input{

    flex:1;
    padding:12px;
    border-radius:20px;
    border:1px solid #ccc;

}


button{

    border:none;
    background:#0078d4;
    color:white;
    padding:12px 20px;
    border-radius:20px;
    cursor:pointer;

}



.empty{

    margin:auto;
    color:#777;

}


/* SONDAGES */

.sondage{

    margin-top:8px;

}

.sondage-question{

    font-weight:600;
    margin-bottom:8px;

}

.sondage-option{

    display:block;
    width:100%;
    text-align:left;
    background:#f0f7ff;
    color:#0078d4;
    border:1px solid #cfe4fb;
    border-radius:10px;
    padding:8px 12px;
    margin-bottom:6px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    font-size:14px;

}

.sondage-option:hover{

    background:#e2f0ff;

}

.sondage-option.voted-option{

    cursor:default;

}

.sondage-bar{

    position:absolute;
    left:0;
    top:0;
    bottom:0;
    background:#cfe4fb;
    z-index:0;

}

.sondage-option-label{

    position:relative;
    z-index:1;
    display:flex;
    justify-content:space-between;
    gap:10px;

}

.sondage-note{

    font-size:12px;
    opacity:.7;
    margin-top:4px;

}

</style>

</head>


<body>


<div id="app">


<div id="sidebar">

<div class="header">
💬 Messagerie
</div>


<input id="search" placeholder="Rechercher...">


<div id="conversations"></div>


</div>



<div id="chat">


<div id="chat-header">
Sélectionnez une discussion
</div>


<div id="messages">

<div class="empty">
Aucune conversation sélectionnée
</div>

</div>





</div>



</div>





<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,
doc,
getDoc,
collection,
query,
where,
onSnapshot,
addDoc,
updateDoc,
serverTimestamp,
arrayUnion,
orderBy

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",
  authDomain: "urgences-a8ed4.firebaseapp.com",
  projectId: "urgences-a8ed4",
  storageBucket: "urgences-a8ed4.firebasestorage.app",
  messagingSenderId: "392921498200",
  appId: "1:392921498200:web:7ccce767332c67c697c02d",
  measurementId: "G-C74MK2KYDL"
};



const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const auth=getAuth(app);



let utilisateur=null;
let utilisateurNom="";

let conversationActive=null;





/*
===========================
CONNEXION
===========================
*/


onAuthStateChanged(auth,async(user)=>{


if(!user)
return;


utilisateur=user;


const snap=
await getDoc(
doc(db,"medecins",user.uid)
);


if(snap.exists()){

const data=snap.data();

utilisateurNom=
data.nom || "Utilisateur";


}


chargerConversations();


});





/*
===========================
LISTE CONVERSATIONS
===========================
*/


function chargerConversations(){


const q=query(

collection(db,"messageries"),

where(
"participants",
"array-contains",
utilisateur.uid
)

);



onSnapshot(q,(snap)=>{


const zone=
document.getElementById("conversations");


zone.innerHTML="";


snap.forEach(docSnap=>{


const c=docSnap.data();


const div=
document.createElement("div");


div.className="conversation";


div.innerHTML=`

<div class="avatar">
${c.icon || "💬"}
</div>

<div class="conv-text">

<div class="conv-title">
${c.titre || "Discussion"}
</div>


<div class="conv-last">
${c.lastMessage || ""}
</div>


</div>

`;



div.onclick=()=>ouvrirConversation(
docSnap.id,
c
);



zone.appendChild(div);



});


});


}






/*
===========================
OUVERTURE CHAT
===========================
*/


function ouvrirConversation(id,data){


conversationActive=id;


document.getElementById("chat-header")
.innerHTML=
`${data.icon || "💬"} ${data.titre}`;


chargerMessages();



}





function chargerMessages(){


const zone=
document.getElementById("messages");


zone.innerHTML="";


const q=query(

collection(
db,
"messageries",
conversationActive,
"messages"
),

orderBy("date","asc")

);



onSnapshot(q,async(snap)=>{


zone.innerHTML="";


/* on repère d'abord les messages de type "sondage"
   pour charger les documents "sondages" correspondants */

const idsSondages=[];

snap.forEach(m=>{

const msg=m.data();

if(msg.type==="sondage" && msg.sondageId){

idsSondages.push(msg.sondageId);

}

});


const sondagesData={};

await Promise.all(

idsSondages.map(async(id)=>{

const s=
await getDoc(
doc(db,"sondages",id)
);

if(s.exists()){

sondagesData[id]=s.data();

}

})

);



snap.forEach(m=>{


const msg=m.data();


const div=
document.createElement("div");


div.className=
"message "+
(msg.auteur==utilisateur.uid?"mine":"");


let contenuHTML="";


if(
msg.type==="sondage" &&
msg.sondageId &&
sondagesData[msg.sondageId]
){

contenuHTML=
creerSondageHTML(
sondagesData[msg.sondageId],
msg.sondageId
);

}else{

contenuHTML=
`<div>${msg.texte || ""}</div>`;

}



div.innerHTML=`

<div class="author">

${msg.auteurNom || ""}

</div>


${contenuHTML}


<div class="date">

${msg.date?.toDate?
msg.date.toDate().toLocaleString():
""}

</div>

`;



zone.appendChild(div);



if(
msg.luPar &&
!msg.luPar.includes(utilisateur.uid)
){


updateDoc(
doc(
db,
"messageries",
conversationActive,
"messages",
m.id
),
{

luPar:
arrayUnion(utilisateur.uid)

}

);


}



});


zone.scrollTop=
zone.scrollHeight;



});


}





/*
===========================
AFFICHAGE / VOTE SONDAGES
===========================
*/


function creerOptionSondageHTML(sondageId,optionIndex,optionTexte,dejaVote,monChoix,pourcentage,nbVoix){


if(dejaVote){

const estMonChoix=
monChoix===optionIndex;

return `

<div class="sondage-option voted-option">

<div class="sondage-bar" style="width:${pourcentage}%;"></div>

<div class="sondage-option-label">
<span>${optionTexte}${estMonChoix?" ✓":""}</span>
<span>${pourcentage}% (${nbVoix})</span>
</div>

</div>

`;

}


return `

<button type="button" class="sondage-option"
onclick="voterSondage('${sondageId}',${optionIndex})">

${optionTexte}

</button>

`;


}



function creerSondageHTML(sondage,sondageId){


const reponses=
sondage.reponses || {};


const dejaVote=
!!utilisateur &&
Object.prototype.hasOwnProperty.call(
reponses,
utilisateur.uid
);


const monChoix=
dejaVote ? reponses[utilisateur.uid] : null;


const totalReponses=
Object.keys(reponses).length;


const optionsHTML=
(sondage.options || [])
.map((opt,i)=>{

const nbVoix=
Object.values(reponses)
.filter(v=>v===i).length;

const pourcentage=
totalReponses>0 ?
Math.round((nbVoix/totalReponses)*100) :
0;

return creerOptionSondageHTML(
sondageId,
i,
opt,
dejaVote,
monChoix,
pourcentage,
nbVoix
);

})
.join("");



return `

<div class="sondage" data-sondage-id="${sondageId}">

<div class="sondage-question">
📊 ${sondage.question || ""}
</div>

${optionsHTML}

<div class="sondage-note">
${dejaVote ?
"Vous avez déjà répondu à ce sondage." :
"Cliquez sur une option pour répondre."}
</div>

</div>

`;


}



window.voterSondage=async(sondageId,optionIndex)=>{


if(!utilisateur)
return;


await updateDoc(

doc(db,"sondages",sondageId),

{

[`reponses.${utilisateur.uid}`]:
optionIndex

}

);


await rafraichirSondage(sondageId);


};



async function rafraichirSondage(sondageId){


const snap=
await getDoc(
doc(db,"sondages",sondageId)
);


if(!snap.exists())
return;


const sondage=
snap.data();


document
.querySelectorAll(`[data-sondage-id="${sondageId}"]`)
.forEach(el=>{

el.outerHTML=
creerSondageHTML(sondage,sondageId);

});


}






/*
===========================
ENVOI MESSAGE
===========================
*/


window.envoyerMessage=async()=>{


if(!conversationActive)
return;


const input=
document.getElementById("message-input");


const texte=
input.value.trim();



if(!texte)
return;



await addDoc(

collection(
db,
"messageries",
conversationActive,
"messages"
),

{

auteur:
utilisateur.uid,

auteurNom:
utilisateurNom,

texte,

date:
serverTimestamp(),

luPar:
[
utilisateur.uid
]

}

);



await updateDoc(

doc(
db,
"messageries",
conversationActive
),

{

lastMessage:
texte,

updatedAt:
serverTimestamp()

}

);



input.value="";


};



</script>


</body>
</html>
