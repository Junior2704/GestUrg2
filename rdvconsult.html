<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B544E">
<title>Rendez-vous Urgences</title>
<link rel="icon" type="image/png" href="logog2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6FBFA;--surface:#fff;--ink:#12312D;--ink-soft:#4C6B66;--teal:#0F766E;--teal-deep:#0B544E;--aqua:#DCF3F0;--coral:#EF6351;--coral-soft:#FDE4DF;--amber:#E2A63A;--line:#E2EEEC;--radius:22px;--shadow:0 20px 50px -25px rgba(15,60,55,.35);--shadow-sm:0 10px 26px -16px rgba(15,60,55,.35);--font-display:'Fraunces',serif;--font-body:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:var(--font-body);color:var(--ink);-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 500px at 90% -10%,#E7F6F3 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#FBEDE9 0%,transparent 55%),var(--bg);display:flex;flex-direction:column;align-items:center;padding:0 16px 30px}
header{width:100%;max-width:1000px;margin-top:20px;background:linear-gradient(90deg,var(--teal-deep) 0%,var(--teal) 60%,#16A398 100%);color:#fff;border-radius:18px;padding:14px 26px;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:space-between;gap:14px}
header img{height:54px;border-radius:8px;background:rgba(255,255,255,.9);padding:4px}
header h1{flex:1;text-align:center;margin:0;font-family:var(--font-display);font-size:1.7rem;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
main{width:100%;max-width:1000px}
.alerte{margin:18px 0;padding:14px 18px;background:var(--coral-soft);border:1px solid var(--coral);border-radius:16px;font-weight:600}
.section-title{font-family:var(--font-display);font-size:1.5rem;font-weight:600;color:var(--teal-deep);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--teal);border-radius:18px;box-shadow:var(--shadow-sm);padding:22px;margin-top:18px}
.days{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.day{flex:0 0 auto;min-width:78px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font:600 .95rem var(--font-body);color:var(--ink);cursor:pointer;text-align:center}
.day b{display:block;font-family:var(--font-display);font-size:1.5rem;color:var(--teal-deep)}
.day[aria-pressed=true]{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}.day[aria-pressed=true] b{color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.slot{padding:12px 6px;border:2px solid var(--teal);background:var(--aqua);border-radius:14px;font:700 1.1rem var(--font-body);color:var(--teal-deep);cursor:pointer}
.slot small{display:block;font-weight:500;font-size:.75rem;color:var(--ink-soft)}
.slot[aria-pressed=true]{background:var(--teal);color:#fff}.slot[aria-pressed=true] small{color:#fff}
.slot:disabled{border-color:var(--line);background:#f1f5f4;color:#9bb0ac;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:5px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:500 1rem var(--font-body)}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn{margin-top:18px;padding:14px 28px;border:0;border-radius:14px;background:var(--teal);color:#fff;font:700 1.05rem var(--font-body);cursor:pointer;box-shadow:var(--shadow-sm)}
.btn:disabled{opacity:.5}
.err{color:var(--coral);font-weight:700;margin-top:12px}
.mut{color:var(--ink-soft)}
.ok{text-align:center}.ok h2{font-family:var(--font-display);font-size:2rem;color:var(--teal-deep);margin:0 0 6px}.ref{display:inline-block;margin:10px 0;padding:8px 18px;background:var(--aqua);border-radius:12px;font:800 1.4rem var(--font-body);letter-spacing:2px;color:var(--teal-deep)}
@media(max-width:600px){header h1{font-size:1.15rem}header img{height:40px}}

</style>
</head>
<body>
<header><img src="logog2.png" alt="" onerror="this.style.display='none'"><h1>Rendez-vous Urgences</h1><span style="width:54px"></span></header>
<main>
  <div class="alerte">En cas de danger vital (douleur thoracique, difficulté à respirer, malaise grave), appelez le 15 ou le 112 sans attendre.</div>
  <div id="done" hidden></div>
  <div id="flow">
    <div class="card"><h2 class="section-title">1. Choisissez un créneau</h2>
      <div class="days" id="days"></div><div class="slots" id="slots"></div></div>
    <div class="card" style="border-top-color:var(--coral)"><h2 class="section-title">2. Vos informations</h2>
      <div class="grid">
        <div><label for="prenom">Prénom</label><input id="prenom" autocomplete="given-name"></div>
        <div><label for="nom">Nom</label><input id="nom" autocomplete="family-name"></div>
        <div><label for="naiss">Date de naissance</label><input id="naiss" type="date" autocomplete="bday"></div>
        <div><label for="tel">Téléphone</label><input id="tel" type="tel" autocomplete="tel"></div>
        <div class="full"><label for="mail">E-mail</label><input id="mail" type="email" autocomplete="email"></div>
        <div class="full"><label for="motif">Motif de la consultation</label><select id="motif"><option>Douleur</option><option>Traumatisme / chute</option><option>Plaie / brûlure</option><option>Fièvre / infection</option><option>Difficulté respiratoire</option><option>Enfant malade</option><option>Autre</option></select></div>
        <div class="full"><label for="detail">Décrivez ce qui vous amène</label><textarea id="detail"></textarea></div>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="go">Confirmer mon rendez-vous</button>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",authDomain:"urgences-a8ed4.firebaseapp.com",projectId:"urgences-a8ed4"});
const db=getFirestore(app);
const $=s=>document.querySelector(s);
const iso=d=>{const z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const tmin=t=>{const[a,b]=t.split(':');return +a*60+ +b}, mt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const fmtD=s=>new Date(s+'T00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

let rules=[],specials=[],date=iso(new Date()),time=null,caps={},counts={};

// Capacité (nb de médecins) par créneau : un jour « particulier » remplace les créneaux génériques
function capacites(d){
  const sp=specials.filter(s=>s.date===d);
  const src=sp.length?sp:rules.filter(r=>r.days.includes(new Date(d+'T00:00').getDay()));
  const m={};
  src.filter(r=>!r.closed).forEach(r=>{for(let x=tmin(r.start);x+ +r.dur<=tmin(r.end);x+= +r.dur){const t=mt(x);m[t]=Math.max(m[t]||0,+r.docs)}});
  return m;
}
async function charger(){
  try{
    const [g,p]=await Promise.all([getDoc(doc(db,'rdv-config','generiques')),getDoc(doc(db,'rdv-config','particuliers'))]);
    rules=g.exists()?g.data().rules||[]:[]; specials=p.exists()?p.data().items||[]:[];
  }catch(e){$('#slots').innerHTML='<p class="err">Impossible de charger les créneaux. Réessayez dans un instant.</p>'}
  await choisirJour(date);
}
async function choisirJour(d){
  date=d;time=null;caps=capacites(d);counts={};
  try{const o=await getDoc(doc(db,'rdv-occupation',d));if(o.exists())counts=o.data().counts||{}}catch(e){}
  rendre();
}
function rendre(){
  const days=$('#days');days.innerHTML='';
  for(let i=0;i<10;i++){const d=new Date();d.setDate(d.getDate()+i);const s=iso(d);
    const b=document.createElement('button');b.className='day';b.setAttribute('aria-pressed',s===date);
    b.innerHTML=`${i?JOURS[d.getDay()]:'Auj.'}<b>${d.getDate()}</b>${d.toLocaleDateString('fr-FR',{month:'short'})}`;
    b.onclick=()=>choisirJour(s);days.appendChild(b)}
  const now=new Date(),nm=now.getHours()*60+now.getMinutes(),box=$('#slots'),ts=Object.keys(caps).sort();
  box.innerHTML=ts.length?'':'<p class="mut">Aucun créneau ouvert ce jour-là. Essayez une autre date.</p>';
  ts.forEach(t=>{const left=caps[t]-(counts[t]||0),past=date===iso(now)&&tmin(t)<=nm;
    const b=document.createElement('button');b.className='slot';b.disabled=left<=0||past;b.setAttribute('aria-pressed',t===time);
    b.innerHTML=`${t}<small>${past?'passé':left<=0?'complet':left+' place'+(left>1?'s':'')}</small>`;
    b.onclick=()=>{time=t;rendre()};box.appendChild(b)});
}
$('#go').onclick=async()=>{
  const v=id=>$('#'+id).value.trim(),err=$('#err'),miss=[];
  if(!time)miss.push('un créneau');
  [['prenom','le prénom'],['nom','le nom'],['naiss','la date de naissance'],['tel','le téléphone']].forEach(([k,l])=>{if(!v(k))miss.push(l)});
  if(v('mail')&&!/^\S+@\S+\.\S+$/.test(v('mail')))miss.push('un e-mail valide');
  if(miss.length){err.textContent='Il manque : '+miss.join(', ')+'.';return}
  err.textContent='';$('#go').disabled=true;
  const ref=doc(collection(db,'rdv-urgences')),code='URG-'+Math.random().toString(36).slice(2,6).toUpperCase(),occ=doc(db,'rdv-occupation',date);
  try{
    await runTransaction(db,async tx=>{
      const s=await tx.get(occ),c=s.exists()?s.data().counts||{}:{};
      if((c[time]||0)>=caps[time])throw new Error('complet');
      c[time]=(c[time]||0)+1;
      tx.set(occ,{counts:c});
      tx.set(ref,{ref:code,date,heure:time,statut:'pris',creeLe:serverTimestamp(),motif:v('motif'),detail:v('detail'),
        patient:{prenom:v('prenom'),nom:v('nom').toUpperCase(),dateNaissance:v('naiss'),telephone:v('tel'),email:v('mail')},patientId:null});
    });
    $('#flow').hidden=true;
    $('#done').hidden=false;
    $('#done').innerHTML=`<div class="card ok"><h2>Rendez-vous confirmé</h2><p><strong>${fmtD(date)} à ${time}</strong></p><div class="ref">${code}</div>
      <p class="mut">Présentez-vous 10 minutes avant, avec une pièce d’identité et votre carte Vitale.<br>Notez votre référence : elle vous sera demandée à l’accueil.</p></div>`;
  }catch(e){
    err.textContent=e.message==='complet'?'Ce créneau vient d’être pris. Choisissez-en un autre.':'L’enregistrement a échoué. Vérifiez votre connexion et réessayez.';
    $('#go').disabled=false;if(e.message==='complet')choisirJour(date);
  }
};
charger();
</script>
</body>
</html>
