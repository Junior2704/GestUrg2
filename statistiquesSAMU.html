<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statistiques SAMU</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#112336;--muted:#586a7e;--line:#d8e1ea;--field:#f6f9fc;--primary:#0b6fa4;--soft:#e3f1f9;--late:#b92a30;--ok:#16784a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.4 Inter,system-ui,sans-serif;color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:26px 0 10px}h3{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
small{color:var(--muted);font-size:12px}.k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#who{margin-left:auto;font-weight:600;color:var(--muted)}main{padding:16px 24px;max-width:1300px;margin:auto}.msg{padding:30px;text-align:center;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input{min-height:40px;padding:6px 10px;font:inherit;background:var(--field);border:1px solid var(--line);border-radius:10px}
button{font:inherit;font-weight:600;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--primary);cursor:pointer}button.p{background:var(--primary);color:#fff;border-color:var(--primary)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}.card b{font-size:26px;display:block;line-height:1.15}.card small{display:block}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;align-items:start}
.sec{border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;background:#fff}
.bar{display:grid;grid-template-columns:170px 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:13px}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{background:var(--field);border-radius:7px;height:14px}.bar i{display:block;height:14px;border-radius:7px;background:var(--c,var(--primary))}.bar b{text-align:right}
.cols{display:flex;align-items:flex-end;gap:3px;height:150px}.cols .cc{flex:1;display:flex;gap:1px;align-items:flex-end;height:100%;min-width:0}.cols .cc i{flex:1;background:var(--primary);border-radius:3px 3px 0 0;min-height:1px}.cols .cc i.r{background:var(--late)}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding:6px;border-bottom:2px solid var(--line)}td{padding:7px 6px;border-bottom:1px solid var(--line)}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10px;color:var(--muted)}.heat div{height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center}
#map{height:380px;border-radius:12px;border:1px solid var(--line)}
</style></head><body>
<header><b>📊</b><div><div class="k">SAMU</div><h1>Statistiques de régulation et d’interventions</h1></div><span id="who"></span></header>
<main><div id="gate" class="msg">Connexion en cours…</div>
<div id="app" hidden>
 <div class="tools">
  <select id="per"><option value="0">Aujourd’hui</option><option value="7" selected>7 derniers jours</option><option value="30">30 derniers jours</option><option value="90">90 jours</option><option value="365">12 mois</option><option value="9999">Tout</option><option value="custom">Période…</option></select>
  <span id="cust" hidden><input type="date" id="d1"> → <input type="date" id="d2"></span>
  <select id="reg"><option value="">Tous les régulateurs</option></select>
  <button class="p" id="go">Actualiser</button><button id="csv">Exporter CSV</button><small id="info"></small>
 </div>
 <div id="out"><div class="msg">Chargement…</div></div>
</div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",authDomain:"urgences-a8ed4.firebaseapp.com",projectId:"urgences-a8ed4"});
const auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const PRIO=[['P0 · Vital','#b92a30'],['P1 · Urgent','#c2410c'],['P2 · Non urgent','#a35a00'],['P3 · Conseil','#16784a']];
const ETAPES=[['declenche','Déclenché'],['en_route','En route'],['sur_place','Sur place'],['transport','Transport'],['termine','Terminé']];
const JOURS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
let A=[],D=[],users={},medecin={},fromT=0,toT=0;

onAuthStateChanged(auth,async u=>{
 if(!u){$('#gate').textContent='Vous devez être connecté pour accéder à cette page.';return}
 try{const s=await getDoc(doc(db,'medecins',u.uid));if(!s.exists()){$('#gate').textContent='Utilisateur non trouvé, veuillez vous reconnecter.';return}
  medecin=s.data();$('#who').textContent=medecin.nom||'';
  const page=location.pathname.split('/').pop().replace('.html','');
  if(!(medecin.pages||{})[page]){$('#gate').textContent='Accès refusé : contactez un administrateur.';return}
  (await getDocs(collection(db,'medecins'))).docs.forEach(d=>users[d.id]=d.data().nom||d.id);
  $('#gate').hidden=true;$('#app').hidden=false;charger();
 }catch(e){console.error(e);$('#gate').textContent='Une erreur est survenue, réessayez plus tard.'}
});

/* ---------- Chargement ---------- */
function bornes(){
 const p=$('#per').value,fin=new Date();fin.setHours(23,59,59,999);
 if(p==='custom'){const a=$('#d1').value,b=$('#d2').value;return[a?new Date(a+'T00:00').getTime():0,b?new Date(b+'T23:59:59').getTime():fin.getTime()]}
 if(p==='0')return[new Date().setHours(0,0,0,0),fin.getTime()];
 if(p==='9999')return[0,fin.getTime()];
 const d=new Date();d.setDate(d.getDate()-(+p-1));d.setHours(0,0,0,0);return[d.getTime(),fin.getTime()];
}
async function charger(){
 $('#out').innerHTML='<div class="msg">Chargement…</div>';
 [fromT,toT]=bornes();
 try{
  const[sa,sd]=await Promise.all([
   getDocs(query(collection(db,'appels'),where('createdAt','>=',fromT),where('createdAt','<=',toT))),
   getDocs(query(collection(db,'declenchements'),where('heures.declenche','>=',fromT),where('heures.declenche','<=',toT)))]);
  A=sa.docs.map(d=>({id:d.id,...d.data()}));D=sd.docs.map(d=>({id:d.id,...d.data()}));
  const regs=[...new Set(A.map(a=>a.regulateur).filter(Boolean))].sort(),cur=$('#reg').value;
  $('#reg').innerHTML='<option value="">Tous les régulateurs</option>'+regs.map(r=>`<option${r===cur?' selected':''}>${esc(r)}</option>`).join('');
  rendre();
 }catch(e){console.error(e);$('#out').innerHTML='<div class="msg">Impossible de charger les statistiques.</div>'}
}
$('#go').onclick=charger;$('#per').onchange=()=>{$('#cust').hidden=$('#per').value!=='custom';if($('#per').value!=='custom')charger()};
['#d1','#d2'].forEach(s=>$(s).onchange=charger);$('#reg').onchange=rendre;

/* ---------- Utilitaires ---------- */
const moy=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const med=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const p90=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.ceil(s.length*.9)-1)]};
const mn=ms=>{if(ms==null||isNaN(ms))return '—';const m=ms/6e4;if(m<10)return (Math.round(m*10)/10)+' min';const r=Math.round(m);return r<60?r+' min':Math.floor(r/60)+' h '+String(r%60).padStart(2,'0')};
const pct=(n,t)=>t?Math.round(n/t*100)+' %':'—';
const count=(arr,f)=>arr.reduce((m,x)=>{const k=f(x);if(k!=null&&k!==''){m[k]=(m[k]||0)+1}return m},{});
const kpi=(l,v,s)=>`<div class="card"><small>${l}</small><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
const bars=(o,c,order)=>{const e=order?order.map(k=>[k,o[k]||0]):Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,12),m=Math.max(1,...e.map(x=>x[1]));
 return e.length?e.map(([k,v])=>`<div class="bar"><span title="${esc(k)}">${esc(k)}</span><div><i style="width:${v/m*100}%;${c?'--c:'+(typeof c==='function'?c(k):c):''}"></i></div><b>${v}</b></div>`).join(''):'<small>Aucune donnée.</small>'};
const bloc=(t,h)=>`<section class="sec"><h3>${t}</h3>${h}</section>`;
const statTxt=a=>a.length?`<b>${mn(moy(a))}</b> <small>moy. · méd. ${mn(med(a))} · p90 ${mn(p90(a))} · n=${a.length}</small>`:'<small>—</small>';
const decl=d=>d.etape!=='annule';

/* ---------- Rendu ---------- */
function rendre(){
 const r=$('#reg').value,AP=r?A.filter(a=>a.regulateur===r):A,byId=Object.fromEntries(A.map(a=>[a.id,a]));
 const DP=(r?D.filter(d=>byId[d.appelId]?.regulateur===r||d.creePar===r):D);
 const clos=AP.filter(a=>a.statut==='cloture'),victimes=AP.reduce((t,a)=>t+((a.victimes||[]).length||1),0);
 const dDec=AP.filter(a=>a.decisionAt).map(a=>a.decisionAt-a.createdAt).filter(x=>x>=0);
 const dTrait=clos.filter(a=>a.clotureAt).map(a=>a.clotureAt-a.createdAt).filter(x=>x>=0);
 const smurOK=DP.filter(decl),smurApp=new Set(smurOK.map(d=>d.appelId));
 const dSmur=smurOK.map(d=>d.heures.declenche-(d.appelAt||byId[d.appelId]?.createdAt)).filter(x=>x>=0&&!isNaN(x));
 const dInt=smurOK.filter(d=>d.heures.termine).map(d=>d.heures.termine-d.heures.declenche).filter(x=>x>=0);
 const transf=AP.filter(a=>a.decisionKey==='transfert'||a.transfert);
 const ouverts=AP.filter(a=>a.statut!=='cloture').length;
 $('#info').textContent=`${AP.length} dossier(s) · ${DP.length} déclenchement(s)`;
 let h=`<div class="cards">${kpi('Appels reçus',AP.length,`${ouverts} en cours`)}${kpi('Victimes / patients',victimes)}
  ${kpi('Délai médian de décision',mn(med(dDec)),'décroché → décision')}${kpi('Durée médiane du dossier',mn(med(dTrait)),'création → clôture')}
  ${kpi('SMUR déclenchés',smurOK.length,pct(smurApp.size,AP.length)+' des appels')}${kpi('Délai médian appel → SMUR',mn(med(dSmur)),'p90 '+mn(p90(dSmur)))}
  ${kpi('Durée moyenne d’intervention',mn(moy(dInt)),'déclenchement → fin')}${kpi('Transferts à un autre service',transf.length,pct(transf.length,AP.length))}</div>`;

 h+=`<h2>Activité d’appels</h2><div class="g">`;
 h+=bloc('Appels dans le temps <small>(bleu : appels · rouge : avec SMUR)</small>',serie(AP,smurApp));
 h+=bloc('Répartition horaire',bars(count(AP,a=>String(new Date(a.createdAt).getHours()).padStart(2,'0')+' h'),'',[...Array(24)].map((_,i)=>String(i).padStart(2,'0')+' h')));
 h+=bloc('Jour de la semaine × heure',heat(AP));
 h+=bloc('Par priorité',bars(count(AP,a=>PRIO[a.priorite??2][0]),k=>PRIO.find(p=>p[0]===k)[1],PRIO.map(p=>p[0])));
 h+=bloc('Par motif',bars(count(AP,a=>a.motif||'Non précisé')));
 h+=bloc('Par qualité de l’appelant',bars(count(AP,a=>a.qualite||'Non précisé')));
 h+=bloc('Par type de lieu',bars(count(AP,a=>a.lieu||'Non précisé')));
 h+=bloc('Par commune',bars(count(AP,a=>a.ville||'Non précisée')));
 h+='</div>';

 h+=`<h2>Traitement des appels</h2><div class="g">`;
 h+=bloc('Décisions de régulation',bars(count(AP,a=>a.decision||'Aucune décision')));
 h+=bloc('Transferts par service',bars(count(transf,a=>a.transfert?.service||'Non précisé'),'#6b3fc4'));
 h+=bloc('Motifs de clôture',bars(count(clos,a=>a.motifCloture||'Non précisé')));
 h+=bloc('Délais de décision',bars(buckets(dDec,[[2,'< 2 min'],[5,'2 à 5 min'],[10,'5 à 10 min'],[1e9,'> 10 min']]),'',['< 2 min','2 à 5 min','5 à 10 min','> 10 min'])+`<div style="margin-top:8px">${statTxt(dDec)}</div>`);
 h+=bloc('Durée de traitement d’un dossier',statTxt(dTrait)+'<div style="margin-top:10px">'+bars(buckets(dTrait,[[5,'< 5 min'],[15,'5 à 15 min'],[30,'15 à 30 min'],[1e9,'> 30 min']]),'',['< 5 min','5 à 15 min','15 à 30 min','> 30 min'])+'</div>');
 h+=bloc('Par régulateur',regTable(A));
 h+='</div>';

 h+=`<h2>Interventions SMUR</h2><div class="g">`;
 h+=bloc('Délai appel → déclenchement SMUR',statTxt(dSmur)+'<div style="margin-top:10px">'+bars(buckets(dSmur,[[2,'< 2 min'],[5,'2 à 5 min'],[10,'5 à 10 min'],[1e9,'> 10 min']]),'',['< 2 min','2 à 5 min','5 à 10 min','> 10 min'])+'</div>');
 h+=bloc('Délais par étape',etapes(smurOK));
 h+=bloc('Par équipe',equipes(DP));
 h+=bloc('Interventions par priorité',bars(count(smurOK,d=>PRIO[d.priorite??2][0]),k=>PRIO.find(p=>p[0]===k)[1],PRIO.map(p=>p[0])));
 h+=bloc('Interventions par motif',bars(count(smurOK,d=>d.motif||'Non précisé')));
 h+=bloc('Déclenchements annulés',`<b style="font-size:24px">${DP.filter(d=>!decl(d)).length}</b> <small>sur ${DP.length} déclenchements</small>`);
 h+='</div>';

 h+=`<h2>Carte des appels</h2><div class="sec"><div id="map"></div><small id="mapInfo"></small></div>`;
 $('#out').innerHTML=h;carte(AP);
}

function buckets(arr,defs){const o={};defs.forEach(d=>o[d[1]]=0);arr.forEach(ms=>{const m=ms/6e4;const d=defs.find(x=>m<x[0]);if(d)o[d[1]]++});return o}

function serie(AP,smurApp){
 const t0=fromT||Math.min(...AP.map(a=>a.createdAt),Date.now()),d0=new Date(t0);d0.setHours(0,0,0,0);
 const span=(Math.min(toT,Date.now())-d0.getTime())/864e5,mois=span>45,k=t=>mois?iso(new Date(t)).slice(0,7):iso(new Date(t));
 const keys=[],cur=new Date(d0);if(mois)cur.setDate(1);
 for(let i=0;i<400&&cur.getTime()<=Math.min(toT,Date.now());i++){keys.push(mois?iso(cur).slice(0,7):iso(cur));mois?cur.setMonth(cur.getMonth()+1):cur.setDate(cur.getDate()+1)}
 const c=Object.fromEntries(keys.map(x=>[x,[0,0]]));
 AP.forEach(a=>{const x=c[k(a.createdAt)];if(x){x[0]++;if(smurApp.has(a.id))x[1]++}});
 const m=Math.max(1,...keys.map(x=>c[x][0]));
 if(!AP.length)return '<small>Aucun appel sur la période.</small>';
 return `<div class="cols">${keys.map(x=>`<div class="cc" title="${x} : ${c[x][0]} appel(s), ${c[x][1]} avec SMUR"><i style="height:${c[x][0]/m*100}%"></i><i class="r" style="height:${c[x][1]/m*100}%"></i></div>`).join('')}</div><div class="lg"><span>${keys[0]}</span><span>max ${m} / ${mois?'mois':'jour'}</span><span>${keys[keys.length-1]}</span></div>`;
}
function heat(AP){
 const g=[...Array(7)].map(()=>Array(24).fill(0));AP.forEach(a=>{const d=new Date(a.createdAt);g[(d.getDay()+6)%7][d.getHours()]++});
 const m=Math.max(1,...g.flat());
 let h='<div class="heat"><div></div>'+[...Array(24)].map((_,i)=>`<div>${i%3===0?i:''}</div>`).join('');
 g.forEach((r,i)=>{h+=`<div>${JOURS[i]}</div>`+r.map((n,hh)=>`<div title="${JOURS[i]} ${hh} h : ${n}" style="background:rgba(11,111,164,${n?.12+.88*n/m:.05});color:${n/m>.5?'#fff':'#112336'}">${n||''}</div>`).join('')});
 return h+'</div>';
}
function regTable(AP){
 const regs=[...new Set(AP.map(a=>a.regulateur).filter(Boolean))];
 return regs.length?`<table><tr><th>Régulateur</th><th>Appels</th><th>Clôturés</th><th>SMUR</th><th>Décision (méd.)</th></tr>`+regs.map(r=>{const L=AP.filter(a=>a.regulateur===r);
  return `<tr><td>${esc(r)}</td><td>${L.length}</td><td>${L.filter(a=>a.statut==='cloture').length}</td><td>${L.filter(a=>a.decisionKey==='smur').length}</td><td>${mn(med(L.filter(a=>a.decisionAt).map(a=>a.decisionAt-a.createdAt)))}</td></tr>`}).join('')+'</table>':'<small>Aucune donnée.</small>';
}
function etapes(L){
 const paires=[['declenche','en_route','Déclenchement → en route'],['en_route','sur_place','En route → sur place'],['sur_place','transport','Sur place → départ transport'],['transport','termine','Transport → terminé']];
 return `<table><tr><th>Étape</th><th>Moyenne</th><th>Médiane</th><th>p90</th><th>n</th></tr>`+paires.map(([a,b,l])=>{const v=L.filter(d=>d.heures?.[a]&&d.heures?.[b]).map(d=>d.heures[b]-d.heures[a]).filter(x=>x>=0);
  return `<tr><td>${l}</td><td>${mn(moy(v))}</td><td>${mn(med(v))}</td><td>${mn(p90(v))}</td><td>${v.length}</td></tr>`}).join('')+'</table>';
}
function equipes(DP){
 const eq=[...new Set(DP.map(d=>d.equipeLabel).filter(Boolean))].sort();
 return eq.length?`<table><tr><th>Équipe</th><th>Interv.</th><th>Annulés</th><th>Durée moy.</th></tr>`+eq.map(e=>{const L=DP.filter(d=>d.equipeLabel===e),ok=L.filter(decl);
  return `<tr><td>${esc(e)}</td><td>${ok.length}</td><td>${L.length-ok.length}</td><td>${mn(moy(ok.filter(d=>d.heures.termine).map(d=>d.heures.termine-d.heures.declenche)))}</td></tr>`}).join('')+'</table>':'<small>Aucune intervention.</small>';
}
let map=null;
function carte(AP){
 const pts=AP.filter(a=>a.lat!=null&&a.lng!=null);$('#mapInfo').textContent=`${pts.length} appel(s) localisé(s) sur ${AP.length}`;
 if(!window.L){$('#map').innerHTML='<div class="msg">Carte indisponible.</div>';return}
 if(map){map.remove();map=null}
 map=L.map('map').setView([46.6,2.4],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 const g=L.featureGroup(pts.map(a=>L.circleMarker([a.lat,a.lng],{radius:7,color:'#fff',weight:1,fillColor:PRIO[a.priorite??2][1],fillOpacity:.85}).bindPopup(`<b>${esc(a.num)}</b><br>${esc(a.motif||'')}<br>${esc(a.adresse||'')}`))).addTo(map);
 if(pts.length)map.fitBounds(g.getBounds().pad(.2),{maxZoom:14});
 setTimeout(()=>map&&map.invalidateSize(),100);
}

/* ---------- Export CSV ---------- */
$('#csv').onclick=()=>{
 const r=$('#reg').value,L=(r?A.filter(a=>a.regulateur===r):A).sort((a,b)=>a.createdAt-b.createdAt);
 const m=ms=>ms==null||isNaN(ms)?'':Math.round(ms/6e3)/10;
 const decByAppel={};D.filter(decl).forEach(d=>{(decByAppel[d.appelId]=decByAppel[d.appelId]||[]).push(d)});
 const cols=['Numéro','Date','Heure','Régulateur','Appelant','Téléphone','Qualité','Adresse','CP','Commune','Lieu','Motif','Précision','Priorité','Victimes','Décision','Service de transfert','Équipe SMUR','Délai décision (min)','Délai SMUR (min)','Statut','Motif de clôture','Durée dossier (min)'];
 const rows=L.map(a=>{const d=new Date(a.createdAt),ds=decByAppel[a.id]||[];
  return[a.num,iso(d),d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),a.regulateur,a.appelant,a.tel,a.qualite,a.adresse,a.cp,a.ville,a.lieu,a.motif,a.motifPrecision,PRIO[a.priorite??2][0],(a.victimes||[]).length||1,a.decision,a.transfert?.service,ds.map(x=>x.equipeLabel).join(' + '),
   m(a.decisionAt&&a.decisionAt-a.createdAt),m(ds.length&&ds[0].heures.declenche-a.createdAt),a.statut,a.motifCloture,m(a.clotureAt&&a.clotureAt-a.createdAt)]});
 const csv=[cols,...rows].map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
 const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');
