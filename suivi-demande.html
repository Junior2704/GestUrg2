<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accès à ma demande · GestUrg2</title><style>body{margin:0;background:#f3f7fb;font-family:Inter,system-ui,sans-serif;color:#172b3a}.wrap{max-width:760px;margin:40px auto;padding:16px}.card{background:white;border:1px solid #dce5ee;border-radius:18px;padding:26px;box-shadow:0 8px 30px #1232}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd7e2;border-radius:10px;font:inherit;margin:6px 0 14px}button{background:#0078d4;color:white;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}.muted{color:#64788a}.item{padding:12px;background:#f3f7fb;border-radius:10px;margin:10px 0;white-space:pre-wrap}.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center}.row button{white-space:nowrap}</style></head><body><main class="wrap"><section class="card" id="login"><h1>Accéder à ma demande</h1><p class="muted">Saisissez la référence et le mot de passe remis lors de la création.</p><form id="lf"><label>Référence</label><input id="ref" required autocomplete="username" placeholder="DEM-2026-XXXXXXXX"><label>Mot de passe</label><input id="pwd" required autocomplete="current-password"><button>Se connecter</button></form><p id="err" role="status"></p></section><section class="card hidden" id="space"><div class="row"><h1 id="title" style="flex:1"></h1><button id="logout">Déconnexion</button></div><p id="status" class="muted"></p><h2>Échanges</h2><div id="messages"></div><form id="mf"><label>Nouveau message</label><textarea id="texte" required maxlength="5000"></textarea><button>Envoyer le message</button></form><section id="survey" class="hidden"><h2>Enquête de satisfaction</h2><form id="sf"><label>Votre note sur 5</label><select id="note" required><option value="">Choisir…</option><option value="1">1 — Très insatisfait</option><option value="2">2 — Insatisfait</option><option value="3">3 — Moyen</option><option value="4">4 — Satisfait</option><option value="5">5 — Très satisfait</option></select><label>Délai de traitement</label><select id="delai"><option value="correct">Correct</option><option value="rapide">Rapide</option><option value="long">Trop long</option></select><label>Commentaire facultatif</label><textarea id="commentaire" maxlength="2000"></textarea><button>Envoyer mon avis</button></form></section></section></main><script type="module">import{API_BASE}from'./config.js';const $=id=>document.getElementById(id);let token=null;async function api(path,body){const r=await fetch(API_BASE+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Erreur de communication');return j}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const j=await api('/public/me');$('login').classList.add('hidden');$('space').classList.remove('hidden');$('title').textContent=j.demande.reference+' · '+j.demande.motif;$('status').textContent='Statut : '+j.demande.statut;$('messages').innerHTML=j.messages.map(m=>`<div class="item"><strong>${esc(m.auteurLabel||m.auteurType)}</strong><div>${esc(m.texte)}</div><small class="muted">${m.date?new Date(m.date).toLocaleString('fr-FR'):''}</small></div>`).join('');const closed=j.demande.statut==='cloturee';$('mf').classList.toggle('hidden',closed);$('survey').classList.toggle('hidden',!closed)}$('lf').onsubmit=async e=>{e.preventDefault();$('err').textContent='Connexion…';try{const j=await api('/public/login',{reference:$('ref').value.trim(),motDePasse:$('pwd').value});token=j.token;sessionStorage.setItem('demandeSession',token);await load()}catch(x){$('err').textContent=x.message}};$('mf').onsubmit=async e=>{e.preventDefault();try{await api('/public/message',{texte:$('texte').value});$('texte').value='';await load()}catch(x){alert(x.message)}};$('sf').onsubmit=async e=>{e.preventDefault();try{await api('/public/satisfaction',{note:Number($('note').value),delai:$('delai').value,commentaire:$('commentaire').value});alert('Merci pour votre retour.');$('sf').classList.add('hidden')}catch(x){alert(x.message)}};$('logout').onclick=()=>{token=null;sessionStorage.removeItem('demandeSession');location.reload()};token=sessionStorage.getItem('demandeSession');if(token)load().catch(()=>{token=null;sessionStorage.removeItem('demandeSession')});</script></body></html>
