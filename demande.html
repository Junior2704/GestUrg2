<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact – Réclamation</title>
<style>
:root{--r:#0b6fa4;--g:#f6f9fc}*{box-sizing:border-box}body{margin:0;font:16px Inter,system-ui,sans-serif;background:var(--g);color:#222}
main{max-width:640px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #d8e1ea;border-radius:16px;padding:20px;box-shadow:0 1px 2px #11233610;margin-bottom:16px}
h1{color:var(--r);font-size:1.4rem;margin-top:0}label{display:block;margin:12px 0 4px;font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;padding:10px;border:1px solid #d8e1ea;border-radius:12px;background:#f6f9fc;font:inherit}
button{background:var(--r);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;cursor:pointer;margin:14px 6px 0 0}button.s{background:#666}
.m{padding:8px 12px;border-radius:10px;margin:6px 0;max-width:85%;word-wrap:break-word}.p{background:#e3f1f9;margin-left:auto}.a{background:#eee}
.bar{height:6px;background:#ddd;border-radius:3px;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--r);border-radius:3px}
.pw{font:700 1.6rem monospace;background:#fff4d6;padding:10px;border-radius:8px;text-align:center}.err{color:#b92a30}small{color:#666}
</style></head><body><main id="app"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,onSnapshot,query,orderBy,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const db=getFirestore(initializeApp({  apiKey: "AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",
    authDomain: "urgences-a8ed4.firebaseapp.com",
    projectId: "urgences-a8ed4"}));
const $=document.getElementById("app"),id=new URLSearchParams(location.search).get("id");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const rnd=(n,a="abcdefghjkmnpqrstuvwxyz23456789")=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>a[b%a.length]).join("");
const TYPES=["Récupérer un document","Contester une facturation","Qualité de la prise en charge","Erreur dans mon dossier","Autre"];
const F=[ // étapes : titre, show, champs
{t:"Vous",f:[{k:"qualite",l:"Vous êtes",o:["Le patient","Un proche / représentant légal","Autre (avocat, assurance…)","Aucun patient concerné (question générale)"]},{k:"nom",l:"Nom"},{k:"prenom",l:"Prénom"},{k:"naissance",l:"Date de naissance",y:"date"},{k:"email",l:"E-mail",y:"email"},{k:"tel",l:"Téléphone",r:0}]},
{t:"Patient concerné",s:d=>!(d.qualite||"").startsWith("Aucun"),f:[{k:"pnom",l:"Nom du patient",s:d=>!(d.qualite||"").startsWith("Le patient")},{k:"pprenom",l:"Prénom du patient",s:d=>!(d.qualite||"").startsWith("Le patient")},{k:"pnaissance",l:"Date de naissance du patient",y:"date",s:d=>!(d.qualite||"").startsWith("Le patient")},{k:"cip",l:"CIP (si connu)",r:0}]},
{t:"Votre demande",f:[{k:"type",l:"Type de demande",o:TYPES},{k:"doc",l:"Quel document ?",o:["Compte rendu","Ordonnance","Facture / attestation","Imagerie / examens","Autre"],s:d=>d.type===TYPES[0]},{k:"periode",l:"Date ou période concernée",s:d=>d.type!==TYPES[4]},{k:"motif",l:"Expliquez votre demande",y:"area"},{k:"urgence",l:"Urgence",o:["Normale","Urgente (délai précis)"]}]},
{t:"Validation",f:[]}];
const Q=new URLSearchParams(location.search);let d={nom:Q.get("nom")||"",prenom:Q.get("prenom")||"",naissance:Q.get("naissance")||"",email:Q.get("email")||"",cip:Q.get("cip")||""},step=0;
function field(x){const v=esc(d[x.k]||"");const a=`id="${x.k}" ${x.r===0?"":"required"}`;
 const i=x.o?`<select ${a}><option value="">Choisir…</option>${x.o.map(o=>`<option ${o==d[x.k]?"selected":""}>${esc(o)}</option>`).join("")}</select>`:x.y==="area"?`<textarea rows=5 ${a}>${v}</textarea>`:`<input type="${x.y||"text"}" value="${v}" ${a}>`;
 return`<label>${x.l}${x.r===0?" <small>(facultatif)</small>":""}</label>${i}`}
const steps=()=>F.filter(s=>!s.s||s.s(d));
function form(){const S=steps(),s=S[step];
 $.innerHTML=`<div class="card"><h1>Contacter nos services</h1><div class="bar"><i style="width:${(step+1)/S.length*100}%"></i></div><small>Étape ${step+1}/${S.length} — ${s.t}</small>
 <div id="fs">${s.f.filter(x=>!x.s||x.s(d)).map(field).join("")||`<p>Vérifiez votre demande puis validez.</p><p><b>${esc(d.type)}</b> — ${esc(d.motif)}</p><label><input type=checkbox id=ok style="width:auto"> J'accepte le traitement de mes données pour cette demande.</label>`}</div>
 <p class="err" id="e"></p>${step?'<button class="s" id="b">Retour</button>':""}<button id="n">${step==S.length-1?"Envoyer":"Suivant"}</button></div>`;
 if(step)b.onclick=()=>{save(s);step--;form()};
 n.onclick=async()=>{if(!save(s,1))return;if(step<S.length-1){step++;form();}else send()}}
function save(s,chk){for(const x of s.f.filter(x=>!x.s||x.s(d))){const el=document.getElementById(x.k);if(el){if(chk&&x.r!==0&&!el.value.trim()){e.textContent="Merci de remplir : "+x.l;return false}d[x.k]=el.value.trim()}}
 if(chk&&!s.f.length&&!ok.checked){e.textContent="Consentement requis";return false}return true}
async function send(){const nid=rnd(10),pw=rnd(8),P=d.qualite.startsWith("Le patient");
 await setDoc(doc(db,"reclamations",nid),{demandeur:{nom:d.nom,prenom:d.prenom,naissance:d.naissance,email:d.email,tel:d.tel||"",qualite:d.qualite},
  patient:d.qualite.startsWith("Aucun")?null:{nom:P?d.nom:d.pnom,prenom:P?d.prenom:d.pprenom,naissance:P?d.naissance:d.pnaissance,cip:d.cip||""},
  type:d.type,doc:d.doc||"",periode:d.periode||"",motif:d.motif,urgence:d.urgence,statut:"nouvelle",affecteA:"",pwHash:await sha(nid+pw),createdAt:serverTimestamp()});
 const url=location.origin+location.pathname+"?id="+nid;
 $.innerHTML=`<div class="card"><h1>Demande enregistrée</h1><p>Votre espace de suivi :</p><p><a href="${url}">${url}</a></p><p>Mot de passe (affiché <b>une seule fois</b>, notez-le) :</p><div class="pw">${pw}</div></div>`}
function login(){$.innerHTML=`<div class="card"><h1>Mon espace demande</h1><label>Mot de passe</label><input id="pw" type="password"><p class="err" id="e"></p><button id="n">Accéder</button></div>`;
 n.onclick=async()=>{const r=await getDoc(doc(db,"reclamations",id));if(!r.exists()||r.data().pwHash!==await sha(id+pw.value.trim()))return e.textContent="Identifiants incorrects";space(r.data())}}
function space(r){const ST={nouvelle:"Reçue",en_cours:"En cours de traitement",cloturee:"Clôturée"};
 $.innerHTML=`<div class="card"><h1>Ma demande</h1><b>${esc(r.type)}</b> — <span id="st"></span><div id="sv"></div></div><div class="card"><div id="ch"></div><textarea id="t" rows=2 placeholder="Votre message…"></textarea><button id="n">Envoyer</button></div>`;
 const rc=collection(db,"reclamations",id,"messages");
 onSnapshot(doc(db,"reclamations",id),s=>{const x=s.data();st.textContent=ST[x.statut];sv.innerHTML=x.statut==="cloturee"&&!x.enquete?`<h3>Votre avis nous intéresse</h3><label>Satisfaction (1 à 5)</label><select id="no"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label>Commentaire</label><textarea id="co" rows=3></textarea><button id="sb">Envoyer mon avis</button>`:x.enquete?"<p>Merci pour votre avis.</p>":"";
  if(window.sb)sb.onclick=()=>updateDoc(doc(db,"reclamations",id),{enquete:{note:+no.value,commentaire:co.value,date:Date.now()}})});
 onSnapshot(query(rc,orderBy("createdAt")),s=>{ch.innerHTML=s.docs.map(q=>{const m=q.data(),exp=m.expire&&Date.now()>m.expire;
  return`<div class="m ${m.de==="patient"?"p":"a"}">${esc(m.texte)}${m.lien?`<br>${exp?"<i>Lien expiré</i>":`<a href="${esc(m.lien)}" target=_blank rel=noopener>📎 Document</a> <small>(valable jusqu'au ${new Date(m.expire).toLocaleDateString("fr-FR")})</small>`}`:""}</div>`}).join("")});
 n.onclick=()=>{if(t.value.trim()){addDoc(rc,{de:"patient",texte:t.value.trim(),createdAt:serverTimestamp()});t.value=""}}}
id?login():form();
</script></body></html>
