<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Impression — GestUrg2</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  background: #eef2f6;

  color: #1f2937;

  overflow: hidden;
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar {

  height: 64px;

  background: #ffffff;

  border-bottom: 1px solid #dce3ea;

  display: flex;

  align-items: center;

  padding: 0 22px;

  gap: 12px;

  user-select: none;

}

.topbar img {

  width: 38px;

  height: 38px;

  object-fit: contain;

}

.topbar-text {

  display: flex;

  flex-direction: column;

  gap: 1px;

}

.topbar-title {

  font-size: 18px;

  font-weight: 700;

  color: #1565c0;

}

.topbar-subtitle {

  font-size: 12px;

  color: #7b8794;

}


/* =========================================================
   LAYOUT
========================================================= */

.main {

  height: calc(100vh - 64px);

  display: grid;

  grid-template-columns: 330px minmax(0, 1fr);

}


/* =========================================================
   PANNEAU OPTIONS
========================================================= */

.sidebar {

  background: #ffffff;

  border-right: 1px solid #dce3ea;

  padding: 22px;

  overflow-y: auto;

}

.section {

  margin-bottom: 23px;

}

.section-title {

  font-size: 11px;

  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: .65px;

  color: #7b8794;

  margin-bottom: 8px;

}


/* =========================================================
   SELECT
========================================================= */

select {

  width: 100%;

  height: 42px;

  padding: 0 12px;

  border: 1px solid #ccd5de;

  border-radius: 8px;

  background: #ffffff;

  color: #263238;

  font-size: 14px;

  outline: none;

  cursor: pointer;

}

select:hover {

  border-color: #aebbc7;

}

select:focus {

  border-color: #1976d2;

  box-shadow:
    0 0 0 3px rgba(25,118,210,.10);

}


/* =========================================================
   BOUTONS
========================================================= */

.option-buttons {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;

}

.option-button {

  height: 42px;

  border-radius: 8px;

  border: 1px solid #ccd5de;

  background: #ffffff;

  color: #455a64;

  font-size: 13px;

  cursor: pointer;

  transition:
    background .15s,
    border-color .15s,
    color .15s;

}

.option-button:hover {

  background: #f5f8fb;

}

.option-button.active {

  background: #e3f2fd;

  border-color: #1976d2;

  color: #1565c0;

  font-weight: 600;

}


/* =========================================================
   COPIES
========================================================= */

.copies {

  display: flex;

  align-items: center;

  gap: 7px;

}

.copy-button {

  width: 42px;

  height: 42px;

  border-radius: 8px;

  border: 1px solid #ccd5de;

  background: #ffffff;

  color: #37474f;

  font-size: 21px;

  cursor: pointer;

}

.copy-button:hover {

  background: #f5f8fb;

}

#copies {

  flex: 1;

  width: 0;

  height: 42px;

  border-radius: 8px;

  border: 1px solid #ccd5de;

  text-align: center;

  font-size: 15px;

  outline: none;

}

#copies:focus {

  border-color: #1976d2;

}


/* =========================================================
   ORIENTATION
========================================================= */

.orientation-buttons {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;

}

.orientation-button {

  height: 42px;

  border-radius: 8px;

  border: 1px solid #ccd5de;

  background: #ffffff;

  color: #455a64;

  cursor: pointer;

  font-size: 13px;

}

.orientation-button.active {

  background: #e3f2fd;

  border-color: #1976d2;

  color: #1565c0;

  font-weight: 600;

}


/* =========================================================
   IMPRESSION
========================================================= */

.print-button {

  width: 100%;

  height: 48px;

  border: none;

  border-radius: 9px;

  background: #1976d2;

  color: white;

  font-size: 15px;

  font-weight: 600;

  cursor: pointer;

  margin-top: 4px;

  transition:
    background .15s,
    transform .05s;

}

.print-button:hover {

  background: #1565c0;

}

.print-button:active {

  transform: scale(.99);

}

.print-button:disabled {

  opacity: .55;

  cursor: default;

}


/* =========================================================
   APERÇU
========================================================= */

.preview-area {

  position: relative;

  overflow: auto;

  background:
    radial-gradient(
      circle at center,
      #f7f9fb 0%,
      #edf1f5 100%
    );

  padding: 40px;

}


/* =========================================================
   BARRE APERÇU
========================================================= */

.preview-toolbar {

  position: fixed;

  top: 76px;

  right: 24px;

  z-index: 20;

  display: flex;

  align-items: center;

  gap: 5px;

  background: rgba(255,255,255,.96);

  border: 1px solid #dce3ea;

  border-radius: 9px;

  padding: 5px;

  box-shadow:
    0 3px 15px rgba(0,0,0,.08);

}

.zoom-button {

  width: 34px;

  height: 30px;

  border: none;

  border-radius: 6px;

  background: transparent;

  cursor: pointer;

  font-size: 17px;

  color: #455a64;

}

.zoom-button:hover {

  background: #eef3f7;

}

.zoom-value {

  min-width: 55px;

  text-align: center;

  font-size: 12px;

  color: #607d8b;

}


/* =========================================================
   FEUILLE
========================================================= */

.preview-wrapper {

  display: flex;

  justify-content: center;

  align-items: flex-start;

  min-width: 100%;

  padding-top: 20px;

  padding-bottom: 50px;

}

.paper {

  flex: 0 0 auto;

  background: #ffffff;

  box-shadow:
    0 7px 30px rgba(0,0,0,.15);

  position: relative;

  transform-origin: top center;

  transition:
    width .2s,
    min-height .2s;

  overflow: hidden;

}


/* A4 */

.paper.a4 {

  width: 210mm;

  min-height: 297mm;

}


/* A5 */

.paper.a5 {

  width: 148mm;

  min-height: 210mm;

}


/* Ticket */

.paper.ticket58 {

  width: 58mm;

  min-height: 80mm;

}


/* =========================================================
   CONTENU DOCUMENT
========================================================= */

#printContent {

  width: 100%;

  min-height: 100%;

  padding: 10mm;

  background: #ffffff;

}


/* Ticket : marges réduites */

.paper.ticket58 #printContent {

  padding: 3mm;

}


/* =========================================================
   NOIR ET BLANC
========================================================= */

.paper.grayscale {

  filter: grayscale(100%);

}


/* =========================================================
   CHARGEMENT
========================================================= */

.loading {

  width: 100%;

  min-height: 300px;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #90a4ae;

  font-size: 14px;

}


/* =========================================================
   ERREUR
========================================================= */

.error {

  padding: 30px;

  text-align: center;

  color: #c62828;

  font-size: 14px;

}


/* =========================================================
   INDICATEUR
========================================================= */

.status {

  font-size: 12px;

  color: #78909c;

  margin-top: 8px;

  line-height: 1.4;

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

  width: 9px;
  height: 9px;

}

::-webkit-scrollbar-track {

  background: transparent;

}

::-webkit-scrollbar-thumb {

  background: #c7d0d8;

  border-radius: 10px;

}

::-webkit-scrollbar-thumb:hover {

  background: #aeb9c2;

}


/* =========================================================
   IMPRESSION
========================================================= */

@media print {

  html,
  body {

    width: auto;
    height: auto;

    overflow: visible;

    background: white;

  }

  .topbar,
  .sidebar,
  .preview-toolbar {

    display: none !important;

  }

  .main {

    display: block;

    width: auto;

    height: auto;

  }

  .preview-area {

    display: block;

    padding: 0;

    overflow: visible;

    background: white;

  }

  .preview-wrapper {

    display: block;

    padding: 0;

  }

  .paper {

    box-shadow: none;

    transform: none !important;

    width: auto !important;

    min-height: auto !important;

    overflow: visible;

  }

  #printContent {

    padding: 0;

  }

}


/* =========================================================
   PETITES FENÊTRES
========================================================= */

@media (max-width: 1000px) {

  .main {

    grid-template-columns: 290px minmax(0, 1fr);

  }

  .sidebar {

    padding: 18px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     TOPBAR
===================================================== -->

<header class="topbar">

  <img
    src="logog2.png"
    alt="GestUrg2"
  >

  <div class="topbar-text">

    <div class="topbar-title">
      Impression
    </div>

    <div class="topbar-subtitle">
      GestUrg2
    </div>

  </div>

</header>



<!-- =====================================================
     CONTENU
===================================================== -->

<main class="main">


  <!-- ===================================================
       OPTIONS
  ==================================================== -->

  <aside class="sidebar">


    <!-- IMPRIMANTE -->

    <div class="section">

      <div class="section-title">
        Imprimante
      </div>

      <select id="printer">

        <option value="">
          Recherche des imprimantes...
        </option>

      </select>

      <div
        id="printerStatus"
        class="status"
      >
        Recherche des imprimantes...
      </div>

    </div>



    <!-- FORMAT -->

    <div class="section">

      <div class="section-title">
        Format du papier
      </div>

      <select id="paperSize">

        <option value="A4">
          A4 — 210 × 297 mm
        </option>

        <option value="A5">
          A5 — 148 × 210 mm
        </option>

        <option value="ticket58">
          Ticket — 58 mm
        </option>

      </select>

    </div>



    <!-- ORIENTATION -->

    <div class="section">

      <div class="section-title">
        Orientation
      </div>

      <div class="orientation-buttons">

        <button
          class="orientation-button active"
          id="portraitButton"
        >
          ▯ Portrait
        </button>

        <button
          class="orientation-button"
          id="landscapeButton"
        >
          ▭ Paysage
        </button>

      </div>

    </div>



    <!-- COULEUR -->

    <div class="section">

      <div class="section-title">
        Couleur
      </div>

      <div class="option-buttons">

        <button
          class="option-button active"
          id="colorButton"
        >
          🎨 Couleur
        </button>

        <button
          class="option-button"
          id="bwButton"
        >
          ⚫ Noir & blanc
        </button>

      </div>

    </div>



    <!-- COPIES -->

    <div class="section">

      <div class="section-title">
        Nombre de copies
      </div>

      <div class="copies">

        <button
          class="copy-button"
          id="minusButton"
        >
          −
        </button>

        <input
          id="copies"
          type="number"
          min="1"
          max="999"
          value="1"
        >

        <button
          class="copy-button"
          id="plusButton"
        >
          +
        </button>

      </div>

    </div>



    <!-- IMPRESSION -->

    <button
      class="print-button"
      id="printButton"
    >
      🖨️ Imprimer
    </button>


  </aside>



  <!-- ===================================================
       APERÇU
  ==================================================== -->

  <section class="preview-area">


    <!-- ZOOM -->

    <div class="preview-toolbar">

      <button
        class="zoom-button"
        id="zoomOut"
        title="Zoom arrière"
      >
        −
      </button>

      <div
        class="zoom-value"
        id="zoomValue"
      >
        100 %
      </div>

      <button
        class="zoom-button"
        id="zoomIn"
        title="Zoom avant"
      >
        +
      </button>

      <button
        class="zoom-button"
        id="zoomReset"
        title="Réinitialiser"
      >
        ↺
      </button>

    </div>



    <!-- FEUILLE -->

    <div class="preview-wrapper">

      <div
        id="paper"
        class="paper a4"
      >

        <div id="printContent">

          <div class="loading">
            Chargement de l'aperçu...
          </div>

        </div>

      </div>

    </div>


  </section>


</main>



<script>

/* =========================================================
   VARIABLES
========================================================= */

let contenuOriginal = "";

let couleur = true;

let orientation = "portrait";

let zoom = 1;


/* =========================================================
   ELEMENTS
========================================================= */

const printerSelect =
  document.getElementById("printer");

const printerStatus =
  document.getElementById("printerStatus");

const paperSize =
  document.getElementById("paperSize");

const paper =
  document.getElementById("paper");

const printContent =
  document.getElementById("printContent");

const copies =
  document.getElementById("copies");

const printButton =
  document.getElementById("printButton");


/* =========================================================
   CHARGER IMPRIMANTES
========================================================= */

async function chargerImprimantes() {

  printerStatus.textContent =
    "Recherche des imprimantes...";

  printerSelect.innerHTML = "";

  try {

    const printers =
      await window.electronPrint.getPrinters();


    if (!printers || printers.length === 0) {

      const option =
        document.createElement("option");

      option.value = "";

      option.textContent =
        "Aucune imprimante trouvée";

      printerSelect.appendChild(option);

      printerStatus.textContent =
        "Aucune imprimante détectée.";

      printButton.disabled = true;

      return;

    }


    let defaultPrinter = null;


    printers.forEach(printer => {

      const option =
        document.createElement("option");

      option.value =
        printer.name;

      option.textContent =
        printer.displayName ||
        printer.name;


      if (printer.isDefault) {

        option.selected = true;

        defaultPrinter = printer;

      }


      printerSelect.appendChild(option);

    });


    if (!defaultPrinter) {

      printerSelect.selectedIndex = 0;

    }


    printerStatus.textContent =
      `${printers.length} imprimante${printers.length > 1 ? "s" : ""} disponible${printers.length > 1 ? "s" : ""}.`;

    printButton.disabled = false;

  }

  catch (error) {

    console.error(
      "Erreur imprimantes :",
      error
    );

    printerStatus.textContent =
      "Impossible de récupérer les imprimantes.";

    printButton.disabled = true;

  }

}


/* =========================================================
   ACTUALISER APERÇU
========================================================= */

function actualiserApercu() {

  if (!contenuOriginal) {

    printContent.innerHTML = `
      <div class="loading">
        Aucun document à prévisualiser.
      </div>
    `;

    return;

  }


  printContent.innerHTML =
    contenuOriginal;


  /* -----------------------------------------------
     FORMAT
  ------------------------------------------------ */

  paper.classList.remove(
    "a4",
    "a5",
    "ticket58"
  );


  const format =
    paperSize.value;


  if (format === "A4") {

    paper.classList.add("a4");

  }

  else if (format === "A5") {

    paper.classList.add("a5");

  }

  else {

    paper.classList.add("ticket58");

  }


  /* -----------------------------------------------
     COULEUR
  ------------------------------------------------ */

  paper.classList.toggle(
    "grayscale",
    !couleur
  );


  /* -----------------------------------------------
     ORIENTATION
  ------------------------------------------------ */

  if (
    orientation === "landscape" &&
    format !== "ticket58"
  ) {

    if (format === "A4") {

      paper.style.width = "297mm";
      paper.style.minHeight = "210mm";

    }

    else {

      paper.style.width = "210mm";
      paper.style.minHeight = "148mm";

    }

  }

  else {

    paper.style.width = "";

    paper.style.minHeight = "";

  }


  appliquerZoom();

}


/* =========================================================
   ZOOM
========================================================= */

function appliquerZoom() {

  paper.style.transform =
    `scale(${zoom})`;

  document.getElementById(
    "zoomValue"
  ).textContent =
    `${Math.round(zoom * 100)} %`;

}


document.getElementById("zoomIn")
  .addEventListener("click", () => {

    zoom = Math.min(
      2,
      zoom + 0.1
    );

    appliquerZoom();

  });


document.getElementById("zoomOut")
  .addEventListener("click", () => {

    zoom = Math.max(
      0.4,
      zoom - 0.1
    );

    appliquerZoom();

  });


document.getElementById("zoomReset")
  .addEventListener("click", () => {

    zoom = 1;

    appliquerZoom();

  });


/* =========================================================
   FORMAT
========================================================= */

paperSize.addEventListener(
  "change",
  actualiserApercu
);


/* =========================================================
   ORIENTATION
========================================================= */

document.getElementById(
  "portraitButton"
).addEventListener(
  "click",
  () => {

    orientation = "portrait";

    document.getElementById(
      "portraitButton"
    ).classList.add("active");

    document.getElementById(
      "landscapeButton"
    ).classList.remove("active");

    actualiserApercu();

  }
);


document.getElementById(
  "landscapeButton"
).addEventListener(
  "click",
  () => {

    orientation = "landscape";

    document.getElementById(
      "landscapeButton"
    ).classList.add("active");

    document.getElementById(
      "portraitButton"
    ).classList.remove("active");

    actualiserApercu();

  }
);


/* =========================================================
   COULEUR
========================================================= */

document.getElementById(
  "colorButton"
).addEventListener(
  "click",
  () => {

    couleur = true;

    document.getElementById(
      "colorButton"
    ).classList.add("active");

    document.getElementById(
      "bwButton"
    ).classList.remove("active");

    actualiserApercu();

  }
);


document.getElementById(
  "bwButton"
).addEventListener(
  "click",
  () => {

    couleur = false;

    document.getElementById(
      "bwButton"
    ).classList.add("active");

    document.getElementById(
      "colorButton"
    ).classList.remove("active");

    actualiserApercu();

  }
);


/* =========================================================
   COPIES
========================================================= */

document.getElementById(
  "minusButton"
).addEventListener(
  "click",
  () => {

    copies.value =
      Math.max(
        1,
        Number(copies.value || 1) - 1
      );

  }
);


document.getElementById(
  "plusButton"
).addEventListener(
  "click",
  () => {

    copies.value =
      Math.min(
        999,
        Number(copies.value || 1) + 1
      );

  }
);


copies.addEventListener(
  "change",
  () => {

    let value =
      Number(copies.value);

    if (!Number.isFinite(value)) {

      value = 1;

    }

    value =
      Math.max(
        1,
        Math.min(999, Math.round(value))
      );

    copies.value = value;

  }
);


/* =========================================================
   RÉCEPTION DOCUMENT
========================================================= */

window.electronPrint.onContenuImpression(
  (contenu) => {

    contenuOriginal =
      contenu || "";

    actualiserApercu();

  }
);


/* =========================================================
   IMPRESSION
========================================================= */

printButton.addEventListener(
  "click",
  async () => {

    const deviceName =
      printerSelect.value;


    if (!deviceName) {

      alert(
        "Veuillez sélectionner une imprimante."
      );

      return;

    }


    let width;
    let height;


    /* -----------------------------------------------
       FORMAT PAPIER EN MICROMÈTRES
    ------------------------------------------------ */

    if (paperSize.value === "A4") {

      if (orientation === "portrait") {

        width = 210000;
        height = 297000;

      }

      else {

        width = 297000;
        height = 210000;

      }

    }

    else if (paperSize.value === "A5") {

      if (orientation === "portrait") {

        width = 148000;
        height = 210000;

      }

      else {

        width = 210000;
        height = 148000;

      }

    }

    else {

      /*
       * Ticket 58 mm
       *
       * La hauteur est volontairement
       * fixée à 80 mm ici.
       *
       * On pourra ensuite rendre cette
       * hauteur automatique selon le ticket.
       */

      width = 58000;
      height = 80000;

    }


    const options = {

      deviceName,

      pageSize: {
        width,
        height
      },

      color: couleur,

      copies:
        Number(copies.value) || 1,

      orientation

    };


    printButton.disabled = true;

    printButton.textContent =
      "🖨️ Impression...";


    try {

      await window.electronPrint.imprimer(
        options
      );


      printButton.textContent =
        "✓ Imprimé";


      setTimeout(() => {

        window.close();

      }, 500);


    }

    catch (error) {

      console.error(
        "Erreur impression :",
        error
      );


      alert(
        "Impossible d'imprimer.\n\n" +
        (
          error?.message ||
          "Erreur inconnue."
        )
      );


      printButton.disabled = false;

      printButton.textContent =
        "🖨️ Imprimer";

    }

  }
);


/* =========================================================
   INITIALISATION
========================================================= */

chargerImprimantes();

</script>

</body>

</html>
