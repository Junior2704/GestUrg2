<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messagerie - GestUrg2</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14222e;--rail:#12283a;--mut:#5b6878;--line:#dde3ea;--bg:#eef1f4;--card:#fff;--ac:#0b7285;--ac2:#095c6c;--tint:#e3f1f4;--red:#b42318;--grn:#1a7f4b;--r:10px}
*{box-sizing:border-box;font-family:"Public Sans",system-ui,sans-serif}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font-size:14px}
button{cursor:pointer;border:0;font-weight:600;font-size:13px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:250px 340px 1fr;height:100%}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;background:var(--ac);color:#fff}.btn:hover{background:var(--ac2)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sec:hover{background:var(--bg)}.btn.dng{background:#fff;color:var(--red);border:1px solid #f0c4c0}.btn:disabled{opacity:.5;cursor:not-allowed}
/* rail */
#rail{background:var(--rail);color:#cfdbe6;display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
#rail .brand{color:#fff;font-weight:700;font-size:17px;padding:4px 8px 14px}
#rail .btn{justify-content:center;margin-bottom:10px;background:#fff;color:var(--rail)}#rail .btn:hover{background:var(--tint)}
.sect{font-size:12px;color:#8fa5b8;padding:14px 8px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border-radius:8px;background:none;color:#cfdbe6;text-align:left;font-weight:500}
.nav:hover{background:#1c3a52}.nav.on{background:#245073;color:#fff}.nav .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .em{width:26px;height:26px;border-radius:7px;background:#1c3a52;display:grid;place-items:center;font-size:14px}
.cnt{background:#e5484d;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px}
/* liste */
#list{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#list .top{padding:16px 16px 10px}#list h2{margin:0 0 10px;font-size:18px}
.chips{display:flex;gap:6px;margin-top:10px}.chips button{padding:5px 11px;border-radius:14px;background:var(--bg);color:var(--mut)}.chips button.on{background:var(--tint);color:var(--ac2)}
#convs{overflow:auto;flex:1}
.conv{display:flex;gap:11px;padding:12px 16px;border-top:1px solid #edf0f3;cursor:pointer;border-left:3px solid transparent}
.conv:hover{background:#f7f9fb}.conv.sel{background:var(--tint);border-left-color:var(--ac)}.conv.nl .ct{font-weight:700}
.av{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.cx{flex:1;min-width:0}.ct,.cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ct{font-weight:600}.cl{color:var(--mut);font-size:13px;margin-top:2px}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:#f3e3e1;color:var(--red);margin-left:6px;font-weight:600}
.vide{padding:32px 20px;color:var(--mut);text-align:center}
/* fil */
#thread{display:flex;flex-direction:column;min-height:0;min-width:0}
#th{display:flex;align-items:center;gap:12px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);min-height:68px}
#th .tt{flex:1;min-width:0}#th b{font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#th small{color:var(--mut)}
#back{display:none;background:none;padding:4px;color:var(--ink)}
#msgs{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.m{max-width:68%;background:var(--card);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:11px 14px}
.m.me{align-self:flex-end;background:var(--ac);color:#fff;border-color:var(--ac);border-radius:12px 12px 3px 12px}
.m .au{font-size:12px;font-weight:700;margin-bottom:4px}.m .dt{font-size:11px;opacity:.65;margin-top:6px}.m .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.m.sys{align-self:center;background:none;border:0;color:var(--mut);font-size:12px}
#comp{background:var(--card);border-top:1px solid var(--line);padding:12px 22px}#comp .row{display:flex;gap:10px;align-items:flex-end}
#comp textarea{resize:none;max-height:130px}#mode{font-size:12px;color:var(--mut);margin-bottom:7px}
/* sondage */
.opt{position:relative;overflow:hidden;display:block;width:100%;text-align:left;padding:8px 11px;margin-top:6px;border-radius:8px;background:var(--tint);color:var(--ac2);border:1px solid #c3dde3;font-weight:500}
.opt .bar{position:absolute;inset:0 auto 0 0;background:#b9dbe2}.opt span{position:relative;display:flex;justify-content:space-between;gap:10px}
.m.me .opt{color:var(--ink)}.q{font-weight:700}.note{font-size:12px;opacity:.75;margin-top:6px}
.chk{display:flex;gap:8px;align-items:center;padding:7px 10px;margin-top:6px;border-radius:8px;background:var(--tint);color:var(--ink);font-weight:500;margin-bottom:0}.chk input{width:auto}
.rep{margin-top:10px;padding-top:8px;border-top:1px solid #0001}.rep textarea{margin-top:6px}.lk{background:none;color:var(--ac);padding:0;text-decoration:underline}
/* modales */
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);max-height:90vh;box-shadow:0 20px 60px #0a1a2a55;color:var(--ink)}dialog.lg{width:min(860px,96vw)}dialog::backdrop{background:#0a1a2a88}
dialog[open]{display:flex;flex-direction:column}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}.mh h3{margin:0;font-size:17px}
.mh button{background:none;color:var(--mut);padding:4px}.mb{padding:4px 22px 18px;overflow:auto;flex:1}.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}.tabs button{background:none;color:var(--mut);padding:11px 12px;border-bottom:2px solid transparent;border-radius:0}.tabs button.on{color:var(--ac2);border-color:var(--ac)}
.pick{border:1px solid var(--line);border-radius:8px;max-height:210px;overflow:auto;margin-top:6px}.pick label{display:flex;gap:9px;align-items:center;margin:0;padding:7px 10px;font-weight:500;border-bottom:1px solid #f0f2f5}.pick input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ck{display:flex;gap:8px;align-items:center;font-weight:500}.ck input{width:auto}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}.card b{display:block}.card small{color:var(--mut)}.card details{margin-top:8px}.card summary{cursor:pointer;color:var(--ac2);font-weight:600}
.dl{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #f0f2f5;font-size:13px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;display:none;z-index:99}#toast.err{background:var(--red)}
@media(max-width:1000px){#app{grid-template-columns:220px 300px 1fr}}
@media(max-width:760px){#app{grid-template-columns:1fr}#rail,#thread{display:none}#app.vue-thread #list{display:none}#app.vue-thread #thread{display:flex}#app.vue-rail #list{display:none}#app.vue-rail #rail{display:flex}#back{display:block}.m{max-width:90%}.grid2{grid-template-columns:1fr}#list .top .menu{display:inline-flex}}
.menu{display:none;float:right;background:none;color:var(--ink);padding:0}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:pop .15s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>
</head>
<body>
<div id="app">
 <aside id="rail"></aside>
 <section id="list">
  <div class="top"><button class="menu" onclick="app.className='vue-rail'" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h2 id="lt">Boîte de réception</h2>
   <input id="q" placeholder="Rechercher une discussion" aria-label="Rechercher">
   <div class="chips" id="chips"></div></div>
  <div id="convs"></div>
 </section>
 <main id="thread">
  <div id="th"><button id="back" onclick="app.className=''" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><div class="tt"><b>Sélectionnez une discussion</b></div></div>
  <div id="msgs"><div class="vide">Choisissez une discussion dans la liste, ou ouvrez-en une nouvelle.</div></div>
  <div id="comp" style="display:none"><div id="mode"></div><div class="row"><textarea id="mi" rows="2" placeholder="Votre réponse"></textarea><button class="btn" id="send" onclick="envoyerMessage()">Répondre</button></div></div>
 </main>
</div>

<dialog id="dNew"><div class="mh"><h3>Nouvelle discussion</h3><button onclick="dNew.close()" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="mb"><label for="nCompte">Compte à contacter</label><select id="nCompte"></select><div id="nDesc" class="note"></div>
 <label for="nObjet">Objet (facultatif)</label><input id="nObjet" maxlength="80" placeholder="Ex : Échange de garde du 12"></div>
 <div class="mf"><button class="btn sec" onclick="dNew.close()">Annuler</button><button class="btn" onclick="creerDiscussion()">Ouvrir la discussion</button></div></dialog>

<dialog id="dComp" class="lg"><div class="mh"><h3>Nouvel envoi</h3><button onclick="dComp.close()" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="tabs" id="cTabs"><button class="on" data-k="message">Message</button><button data-k="sondage">Sondage</button></div>
 <div class="mb"><div class="grid2"><div><label for="cCompte">Envoyer au nom de</label><select id="cCompte"></select></div><div><label for="cType">Type d'utilisateur</label><select id="cType"></select></div></div>
  <label>Destinataires <span id="cN" style="font-weight:400;color:var(--mut)"></span></label>
  <input id="cQ" placeholder="Rechercher un utilisateur"><label class="ck" style="margin:8px 0 0"><input type="checkbox" id="cTous"> Tous les utilisateurs du filtre</label><div class="pick" id="cPick"></div>
  <div id="pMsg"><label for="cTxt">Message</label><textarea id="cTxt" rows="4"></textarea>
   <label class="ck"><input type="checkbox" id="cDem"> Demander une réponse</label>
   <div id="cDemO" style="display:none" class="grid2"><div><label for="cMax">Caractères max (facultatif)</label><input type="number" id="cMax" min="1"></div><label class="ck" style="margin-top:30px"><input type="checkbox" id="cMod" checked> Réponse modifiable</label></div></div>
  <div id="pSond" style="display:none"><label for="sQ">Question</label><input id="sQ"><label class="ck"><input type="checkbox" id="sMul"> Choix multiple</label><label>Options</label><div id="sOpts"></div><button class="btn sec" style="margin-top:8px" onclick="ajouterOption()">Ajouter une option</button></div>
 </div>
 <div class="mf"><button class="btn sec" onclick="dComp.close()">Annuler</button><button class="btn" id="cGo" onclick="envoyerDiffusion()">Envoyer</button></div></dialog>

<dialog id="dSuivi" class="lg"><div class="mh"><h3>Suivi des envois</h3><button onclick="dSuivi.close()" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="tabs" id="sTabs"><button class="on" data-k="hist">Historique</button><button data-k="sond">Sondages</button><button data-k="rep">Réponses reçues</button></div><div class="mb" id="sBody"></div></dialog>

<dialog id="dConf"><div class="mh"><h3 id="cfT"></h3></div><div class="mb" id="cfB"></div><div class="mf"><button class="btn sec" onclick="dConf.close()">Annuler</button><button class="btn dng" id="cfOk">Confirmer</button></div></dialog>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,getDocs,collection,query,where,onSnapshot,addDoc,updateDoc,serverTimestamp,arrayUnion,increment,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const cfg={apiKey:"AIzaSyBKp5-7NNy0Gyl0tNbDgD-BxucYdg8ArWo",authDomain:"urgences-a8ed4.firebaseapp.com",projectId:"urgences-a8ed4",storageBucket:"urgences-a8ed4.firebasestorage.app",messagingSenderId:"392921498200",appId:"1:392921498200:web:7ccce767332c67c697c02d",measurementId:"G-C74MK2KYDL"};
const fa=getApps().length?getApp():initializeApp(cfg),db=getFirestore(fa),auth=getAuth(fa);
const $=id=>document.getElementById(id),ORIGINE="*";
const esc=t=>{const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML};
const I={plus:'<path d="M12 5v14M5 12h14"/>',inbox:'<path d="M4 13l2-8h12l2 8v6H4zM4 13h5l1 2h4l1-2h5"/>',send:'<path d="M21 3L3 10l7 3 3 7z"/>',chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>'};
const ic=k=>`<svg viewBox="0 0 24 24">${I[k]}</svg>`;
const TYPES={doc:"Médecin",infirmier:"Infirmier",AS:"Aide Soignant",Int:"Interne",Ext:"Externe"};
let U=null,UN="",convs=[],act=null,actD=null,unsub=null,genAttr=[],genAll=[],admAttr=[],users=[],fCompte=null,fStat="ouvert",MSGS=[],SD={},DR={},diffs=[],sonds=[],dems=[],sel=new Set(),cMode="message",sTab="hist";
const nom=uid=>users.find(u=>u.uid===uid)?.nom||uid;
function toast(m,err){const t=$("toast");t.textContent=m;t.className=err?"err":"";t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3500)}
function notif(uid){if(window.parent===window)return;try{window.parent.postMessage({type:"NOTIFICATION",userId:uid,titre:"🔔 Nouveau message",contenu:"Ouvrez GestUrg2 pour le consulter !"},"*")}catch(e){}}
function confirmer(t,b,fn){$("cfT").textContent=t;$("cfB").textContent=b;$("cfOk").onclick=()=>{dConf.close();fn()};dConf.showModal()}
const isGen=d=>d.type==="compte-generique"||!!d.compteGeneriqueId;
const membre=d=>genAttr.some(c=>c.id===d.compteGeneriqueId);
const visible=c=>!(c.type==="compte-administratif"&&c.destinataireUid&&c.destinataireUid!==U.uid);
const nl=c=>c.nonLus?.[U.uid]||0;

onAuthStateChanged(auth,async u=>{
 if(!u)return;U=u;
 const s=await getDoc(doc(db,"medecins",u.uid));UN=s.exists()?(s.data().nom||"Utilisateur"):"Utilisateur";
 try{users=(await getDocs(collection(db,"medecins"))).docs.map(d=>({uid:d.id,...d.data()}))}catch(e){}
 onSnapshot(query(collection(db,"comptes-generiques"),where("membres","array-contains",u.uid)),s=>{genAttr=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.actif!==false);rail()});
 onSnapshot(collection(db,"comptes-generiques"),s=>{genAll=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.actif!==false).sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr"))});
 onSnapshot(query(collection(db,"comptes-administrateurs"),where("membres","array-contains",u.uid)),s=>{admAttr=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.actif!==false);rail();suivre()},()=>{});
 onSnapshot(query(collection(db,"messageries"),where("participants","array-contains",u.uid)),s=>{
  convs=s.docs.map(d=>({id:d.id,data:d.data()})).sort((a,b)=>(b.data.updatedAt?.toMillis?.()||0)-(a.data.updatedAt?.toMillis?.()||0));
  try{window.parent.postMessage({source:"messagerie",type:"non-lus",nonLus:convs.filter(x=>visible(x.data)).reduce((n,x)=>n+nl(x.data),0)},ORIGINE)}catch(e){}
  rail();liste()});
});

/* ---------- rail + liste ---------- */
function rail(){
 if(!U)return;const tot=convs.filter(x=>visible(x.data)).reduce((n,x)=>n+nl(x.data),0);
 let h=`<div class="brand">Messagerie</div><button class="btn" onclick="ouvrirNouvelle()">${ic("plus")}Nouvelle discussion</button>
 <button class="nav ${fCompte===null?"on":""}" onclick="filtrer(null)">${ic("inbox")}<span class="t">Toutes les discussions</span>${tot?`<span class="cnt">${tot}</span>`:""}</button>`;
 if(genAttr.length){h+=`<div class="sect">Mes comptes généraux</div>`;
  genAttr.forEach(c=>{const n=convs.filter(x=>x.data.compteGeneriqueId===c.id&&visible(x.data)).reduce((a,x)=>a+nl(x.data),0);
   h+=`<button class="nav ${fCompte===c.id?"on":""}" onclick="filtrer('${c.id}')"><span class="em">${esc(c.icon||"📬")}</span><span class="t">${esc(c.nom)}</span>${n?`<span class="cnt">${n}</span>`:""}</button>`})}
 if(admAttr.length){h+=`<div class="sect">Envois administratifs</div>
  <button class="nav" onclick="ouvrirComposer('message')">${ic("send")}<span class="t">Nouveau message</span></button>
  <button class="nav" onclick="ouvrirComposer('sondage')">${ic("chart")}<span class="t">Nouveau sondage</span></button>
  <button class="nav" onclick="ouvrirSuivi()">${ic("inbox")}<span class="t">Suivi des envois</span></button>
  <div class="sect" style="padding-top:8px">${admAttr.map(c=>esc((c.icon||"")+" "+c.nom)).join(", ")}</div>`}
 $("rail").innerHTML=h;
}
window.filtrer=id=>{fCompte=id;app.className="";$("lt").textContent=id?(genAttr.find(c=>c.id===id)?.nom||""):"Boîte de réception";rail();liste()};
function chips(){$("chips").innerHTML=[["ouvert","Ouvertes"],["clos","Clôturées"],["tous","Toutes"]].map(([v,l])=>`<button class="${fStat===v?"on":""}" onclick="setStat('${v}')">${l}</button>`).join("")}
window.setStat=v=>{fStat=v;chips();liste()};
function liste(){
 const z=$("convs"),t=($("q").value||"").toLowerCase();
 const l=convs.filter(({data:c})=>visible(c)&&(!fCompte||c.compteGeneriqueId===fCompte)&&(fStat==="tous"||(fStat==="clos")===(c.statut==="clos"))&&((c.titre||"")+(c.lastMessage||"")).toLowerCase().includes(t));
 if(!l.length){z.innerHTML='<div class="vide">Aucune discussion ici.</div>';return}
 z.innerHTML=l.map(({id,data:c})=>`<div class="conv ${nl(c)?"nl":""} ${id===act?"sel":""}" data-id="${id}"><div class="av">${esc(c.icon||"💬")}</div><div class="cx"><div class="ct">${esc(c.titre||"Discussion")}${c.statut==="clos"?'<span class="tag">clôturée</span>':""}</div><div class="cl">${esc(c.lastMessage||"")}</div></div>${nl(c)?`<span class="cnt" style="align-self:center;background:var(--ac)">${nl(c)}</span>`:""}</div>`).join("");
 z.querySelectorAll(".conv").forEach(e=>e.onclick=()=>{const x=convs.find(y=>y.id===e.dataset.id);ouvrir(x.id,x.data)});
}
$("q").oninput=liste;chips();

/* ---------- fil ---------- */
function ouvrir(id,d){
 act=id;actD=d;const g=isGen(d),m=g&&membre(d),clos=d.statut==="clos";
 $("th").innerHTML=`<button id="back" onclick="app.className=''" aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><div class="av">${esc(d.icon||"💬")}</div><div class="tt"><b>${esc(d.titre||d.compteNom||"Discussion")}</b><small>${g?(m?"Vous répondez au nom de "+esc(d.compteNom||""):"Discussion avec "+esc(d.compteNom||"")):"Message d'un compte d'envoi, lecture seule"}</small></div>${m&&!clos?'<button class="btn dng" onclick="cloturer()">Clôturer</button>':""}`;
 $("comp").style.display=g?"block":"none";$("mode").textContent=clos?"Discussion clôturée":"";$("mi").disabled=clos;$("send").disabled=clos;
 app.className="vue-thread";
 updateDoc(doc(db,"messageries",id),{[`nonLus.${U.uid}`]:0}).catch(()=>{});liste();
 if(unsub)unsub();
 unsub=onSnapshot(query(collection(db,"messageries",id,"messages"),orderBy("date","asc")),async s=>{
  MSGS=s.docs.map(x=>({id:x.id,...x.data()}));
  await Promise.all([...new Set(MSGS.filter(x=>x.sondageId).map(x=>x.sondageId))].map(async i=>{const r=await getDoc(doc(db,"sondages",i));if(r.exists())SD[i]=r.data()}));
  await Promise.all([...new Set(MSGS.filter(x=>x.demandeReponseId).map(x=>x.demandeReponseId))].map(async i=>{const r=await getDoc(doc(db,"demandes-reponse",i));if(r.exists())DR[i]=r.data()}));
  rendu();
  MSGS.forEach(x=>{if(x.luPar&&!x.luPar.includes(U.uid)){
   updateDoc(doc(db,"messageries",id,"messages",x.id),{luPar:arrayUnion(U.uid)}).catch(()=>{});
   const st={[`statuts.${U.uid}.lu`]:true,[`statuts.${U.uid}.luLe`]:serverTimestamp()};
   if(x.diffusionId)updateDoc(doc(db,"diffusions",x.diffusionId),st).catch(()=>{});
   if(x.sondageId)updateDoc(doc(db,"sondages",x.sondageId),st).catch(()=>{})}});
 });
}
function rendu(){
 const z=$("msgs"),bas=z.scrollHeight-z.scrollTop-z.clientHeight<80;
 z.innerHTML=MSGS.map(x=>{
  if(x.auteur==="systeme")return `<div class="m sys">${esc(x.texte)}</div>`;
  const body=x.type==="sondage"&&SD[x.sondageId]?sondHTML(SD[x.sondageId],x.sondageId):`<div class="tx">${esc(x.texte)}</div>`;
  const r=x.demandeReponseId&&DR[x.demandeReponseId]?repHTML(DR[x.demandeReponseId],x.demandeReponseId):"";
  return `<div class="m ${x.auteur===U.uid?"me":""}"><div class="au">${esc(x.auteurNom)}</div>${body}${r}<div class="dt">${x.date?.toDate?x.date.toDate().toLocaleString("fr-FR"):""}</div></div>`}).join("")||'<div class="vide">Aucun message.</div>';
 if(bas)z.scrollTop=z.scrollHeight;
}
window.cloturer=()=>{if(!act||!membre(actD)||actD.statut==="clos")return;
 confirmer("Clôturer cette discussion ?","Elle ne pourra plus recevoir de réponse.",async()=>{try{
  const t="Discussion clôturée par "+UN;
  await addDoc(collection(db,"messageries",act,"messages"),{auteur:"systeme",auteurNom:"Système",type:"message",texte:t,date:serverTimestamp(),luPar:[U.uid]});
  const n={};(actD.participants||[]).filter(u=>u!==U.uid).forEach(u=>n[`nonLus.${u}`]=increment(1));
  await updateDoc(doc(db,"messageries",act),{statut:"clos",closedBy:U.uid,closedAt:serverTimestamp(),lastMessage:t,updatedAt:serverTimestamp(),...n});
  actD={...actD,statut:"clos"};ouvrir(act,actD)}catch(e){toast("Impossible de clôturer la discussion.",1)}})};
window.envoyerMessage=async()=>{
 const t=$("mi").value.trim();if(!act||!actD||!t||actD.statut==="clos"||!isGen(actD))return;
 const n=membre(actD)?UN+" · "+(actD.compteNom||""):UN,p=(actD.participants||[]).filter(u=>u!==U.uid),nn={};p.forEach(u=>nn[`nonLus.${u}`]=increment(1));
 try{await addDoc(collection(db,"messageries",act,"messages"),{auteur:U.uid,auteurNom:n,type:"message",texte:t,date:serverTimestamp(),luPar:[U.uid]});
  await updateDoc(doc(db,"messageries",act),{lastMessage:t,updatedAt:serverTimestamp(),...nn});p.forEach(notif);$("mi").value=""}catch(e){toast("Impossible d'envoyer la réponse.",1)}};
$("mi").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))envoyerMessage()});

/* sondages / réponses côté destinataire */
const voixOpt=(r,i)=>Object.values(r).filter(v=>Array.isArray(v)?v.includes(i):v===i).length;
function sondHTML(s,id){
 const r=s.reponses||{},dv=Object.prototype.hasOwnProperty.call(r,U.uid),tot=Object.keys(r).length,mul=s.type==="multiple",mc=r[U.uid];
 let o;
 if(dv||!mul)o=(s.options||[]).map((t,i)=>{const n=voixOpt(r,i),p=tot?Math.round(n/tot*100):0,ch=Array.isArray(mc)?mc.includes(i):mc===i;
  return dv?`<div class="opt"><div class="bar" style="width:${p}%"></div><span><b>${esc(t)}${ch?" ✓":""}</b><b>${p}% (${n})</b></span></div>`:`<button class="opt" onclick="voter('${id}',${i})"><span>${esc(t)}</span></button>`}).join("");
 else o=`<div data-s="${id}">`+(s.options||[]).map((t,i)=>`<label class="chk"><input type="checkbox" value="${i}">${esc(t)}</label>`).join("")+`<button class="btn sec" style="margin-top:8px" onclick="voterMul('${id}',this)">Valider mes réponses</button></div>`;
 return `<div class="q">${esc(s.question)}${mul?" (choix multiple)":""}</div>${o}<div class="note">${dv?"Vous avez répondu à ce sondage.":mul?"Cochez une ou plusieurs options.":"Touchez une option pour répondre."}</div>`}
async function majDoc(col,id,c){const r=await getDoc(doc(db,col,id));if(r.exists())c[id]=r.data();rendu()}
window.voter=async(id,i)=>{await updateDoc(doc(db,"sondages",id),{[`reponses.${U.uid}`]:i});majDoc("sondages",id,SD)};
window.voterMul=async(id,b)=>{const v=[...b.parentElement.querySelectorAll("input:checked")].map(c=>+c.value);if(!v.length)return toast("Cochez au moins une option.",1);
 await updateDoc(doc(db,"sondages",id),{[`reponses.${U.uid}`]:v});majDoc("sondages",id,SD)};
function repHTML(d,id){
 const r=d.reponses||{},dr=Object.prototype.hasOwnProperty.call(r,U.uid),t=dr?r[U.uid].texte||"":"",mx=d.maxCaracteres?`maxlength="${d.maxCaracteres}"`:"";
 const f=`<div class="rf" style="display:${dr?"none":"block"}"><textarea rows="3" ${mx}>${esc(t)}</textarea><button class="btn" style="margin-top:6px" onclick="repondre('${id}',this)">Envoyer la réponse</button></div>`;
 return `<div class="rep">${dr?`<div><b>Votre réponse :</b> ${esc(t)}</div>`+(d.modifiable?`<button class="lk" onclick="this.nextElementSibling.style.display='block'">Modifier ma réponse</button>`:'<div class="note">Réponse enregistrée, non modifiable.</div>'):""}${f}</div>`}
window.repondre=async(id,b)=>{const t=b.parentElement.querySelector("textarea").value.trim();if(!t)return toast("Saisissez une réponse avant d'envoyer.",1);
 await updateDoc(doc(db,"demandes-reponse",id),{[`reponses.${U.uid}`]:{texte:t,date:serverTimestamp()}});majDoc("demandes-reponse",id,DR)};

/* ---------- modale : nouvelle discussion ---------- */
window.ouvrirNouvelle=()=>{if(!genAll.length)return toast("Aucun compte général actif n'est disponible.",1);
 $("nCompte").innerHTML=genAll.map(c=>`<option value="${c.id}">${esc((c.icon||"📬")+" "+c.nom)}</option>`).join("");majDesc();dNew.showModal()};
const majDesc=()=>{$("nDesc").textContent=genAll.find(c=>c.id===$("nCompte").value)?.description||""};$("nCompte").onchange=majDesc;
window.creerDiscussion=async()=>{
 const c=genAll.find(x=>x.id===$("nCompte").value);if(!c)return;const objet=$("nObjet").value.trim();
 try{const s=await getDocs(query(collection(db,"messageries"),where("compteGeneriqueId","==",c.id),where("demandeurUid","==",U.uid)));
  const o=s.docs.map(d=>({id:d.id,data:d.data()})).filter(x=>x.data.statut!=="clos").sort((a,b)=>(b.data.updatedAt?.toMillis?.()||0)-(a.data.updatedAt?.toMillis?.()||0));
  if(o.length){dNew.close();fCompte=null;ouvrir(o[0].id,o[0].data);return toast("Une discussion est déjà ouverte avec ce compte.")}
  const d={type:"compte-generique",compteGeneriqueId:c.id,compteNom:c.nom,icon:c.icon||"📬",demandeurUid:U.uid,demandeurNom:UN,objet,participants:[...new Set([U.uid,...(c.membres||[])])],statut:"ouvert"};
  d.titre=c.nom+" · "+UN+(objet?" — "+objet:"");
  const r=await addDoc(collection(db,"messageries"),{...d,lastMessage:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  $("nObjet").value="";dNew.close();ouvrir(r.id,d)}catch(e){toast("Impossible de créer la discussion.",1)}};

/* ---------- modale : composer (comptes d'envoi) ---------- */
window.ouvrirComposer=k=>{$("cCompte").innerHTML=admAttr.map(c=>`<option value="${c.id}">${esc((c.icon||"🔐")+" "+c.nom)}</option>`).join("");
 $("cType").innerHTML='<option value="">Tous les types</option>'+Object.entries(TYPES).map(([i,l])=>`<option value="${i}">${l}</option>`).join("");
 sel.clear();$("sOpts").innerHTML="";ajouterOption();ajouterOption();modeC(k);pick();dComp.showModal()};
function modeC(k){cMode=k;$("pMsg").style.display=k==="message"?"block":"none";$("pSond").style.display=k==="sondage"?"block":"none";
 $("cTabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));$("cGo").textContent=k==="message"?"Envoyer le message":"Envoyer le sondage"}
$("cTabs").onclick=e=>{if(e.target.dataset.k)modeC(e.target.dataset.k)};
const filtres=()=>{const q=$("cQ").value.toLowerCase(),t=$("cType").value;return users.filter(u=>(!t||u.type===t)&&`${u.nom||""} ${u.email||""}`.toLowerCase().includes(q))};
function pick(){const l=filtres(),tous=$("cTous").checked;
 $("cPick").innerHTML=l.map(u=>`<label><input type="checkbox" value="${u.uid}" ${sel.has(u.uid)||tous?"checked":""} ${tous?"disabled":""}><span>${esc(u.nom)} <small style="color:var(--mut)">${esc(TYPES[u.type]||u.type||"")}</small></span></label>`).join("")||'<div class="vide">Aucun utilisateur.</div>';
 $("cN").textContent=`(${tous?l.length:sel.size} sélectionné${(tous?l.length:sel.size)>1?"s":""})`}
["cQ","cType","cTous"].forEach(i=>$(i).addEventListener("input",pick));
$("cPick").onchange=e=>{e.target.checked?sel.add(e.target.value):sel.delete(e.target.value);pick()};
$("cDem").onchange=e=>$("cDemO").style.display=e.target.checked?"grid":"none";
window.ajouterOption=()=>{const d=document.createElement("div");d.style.cssText="display:flex;gap:6px;margin-top:6px";d.innerHTML=`<input class="so" placeholder="Option"><button class="btn sec" onclick="this.parentElement.remove()" aria-label="Retirer">✕</button>`;$("sOpts").appendChild(d)};
async function conv(uid,c){
 const s=await getDocs(query(collection(db,"messageries"),where("compteId","==",c.id),where("destinataireUid","==",uid)));if(!s.empty)return s.docs[0].id;
 const t=c.nom+" · "+nom(uid),a=await getDocs(query(collection(db,"messageries"),where("compteId","==",c.id),where("participants","array-contains",uid))),old=a.docs.find(d=>!d.data().destinataireUid&&d.data().titre===t);
 if(old){await updateDoc(old.ref,{destinataireUid:uid,participants:[uid]});return old.id}
 return (await addDoc(collection(db,"messageries"),{type:"compte-administratif",participants:[uid],destinataireUid:uid,compteId:c.id,compteNom:c.nom,titre:t,icon:c.icon,lastMessage:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()})).id}
window.envoyerDiffusion=async()=>{
 const c=admAttr.find(x=>x.id===$("cCompte").value),dest=$("cTous").checked?filtres().map(u=>u.uid):[...sel];
 if(!c)return toast("Choisissez un compte d'envoi.",1);if(!dest.length)return toast("Sélectionnez au moins un destinataire.",1);
 const st={};dest.forEach(u=>st[u]={distribue:true,lu:false,luLe:null});let last,extra={},ms;
 const msg=cMode==="message",txt=$("cTxt").value.trim(),q=$("sQ").value.trim(),opts=[...document.querySelectorAll(".so")].map(i=>i.value.trim()).filter(Boolean);
 if(msg&&!txt)return toast("Saisissez un message.",1);if(!msg&&(!q||opts.length<2))return toast("Une question et au moins 2 options sont nécessaires.",1);
 $("cGo").disabled=true;
 try{
  if(msg){
   if($("cDem").checked){const mx=$("cMax").value;extra.demandeReponseId=(await addDoc(collection(db,"demandes-reponse"),{texteConsigne:txt,compteId:c.id,compteNom:c.nom,maxCaracteres:mx?+mx:null,modifiable:$("cMod").checked,destinataires:dest,reponses:{},createdAt:serverTimestamp()})).id}
   extra.diffusionId=(await addDoc(collection(db,"diffusions"),{type:"message",texte:txt,compteId:c.id,compteNom:c.nom,destinataires:dest,statuts:st,createdAt:serverTimestamp()})).id;
   ms={type:"message",texte:txt};last=txt}
  else{extra.sondageId=(await addDoc(collection(db,"sondages"),{question:q,options:opts,type:$("sMul").checked?"multiple":"simple",compteId:c.id,compteNom:c.nom,destinataires:dest,reponses:{},statuts:st,createdAt:serverTimestamp()})).id;ms={type:"sondage"};last="📊 Sondage : "+q}
  for(const u of dest){const id=await conv(u,c);
   await addDoc(collection(db,"messageries",id,"messages"),{auteur:c.id,auteurNom:c.nom,...ms,...extra,date:serverTimestamp(),luPar:[]});
   await updateDoc(doc(db,"messageries",id),{lastMessage:last,updatedAt:serverTimestamp(),[`nonLus.${u}`]:increment(1)});notif(u)}
  toast((msg?"Message":"Sondage")+" envoyé à "+dest.length+" utilisateur(s).");
  ["cTxt","sQ","cMax"].forEach(i=>$(i).value="");$("cDem").checked=false;$("cDemO").style.display="none";dComp.close()
 }catch(e){console.error(e);toast("Échec de l'envoi.",1)}$("cGo").disabled=false};

/* ---------- modale : suivi ---------- */
function suivre(){
 const ids=admAttr.map(c=>c.id);if(!ids.length)return;
 [["diffusions",v=>diffs=v],["sondages",v=>sonds=v],["demandes-reponse",v=>dems=v]].forEach(([n,set])=>
  onSnapshot(query(collection(db,n),where("compteId","in",ids)),s=>{set(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)));if(dSuivi.open)suiviRendu()},()=>{}))}
window.ouvrirSuivi=()=>{suiviRendu();dSuivi.showModal()};
$("sTabs").onclick=e=>{if(e.target.dataset.k){sTab=e.target.dataset.k;suiviRendu()}};
const repTxt=(s,u)=>{const r=(s.reponses||{})[u];return r===undefined?"":Array.isArray(r)?r.map(i=>s.options[i]).filter(Boolean).join(", "):(s.options[r]||"")};
const dte=x=>x?.toDate?x.toDate().toLocaleString("fr-FR"):"";
function suiviRendu(){
 $("sTabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.k===sTab));
 const card=(t,meta,det)=>`<div class="card"><b>${esc(t)}</b><small>${meta}</small><details><summary>Voir le détail</summary>${det}</details></div>`;
 let h="";
 if(sTab==="hist"){const it=[...diffs.map(d=>({...d,_s:0})),...sonds.map(d=>({...d,_s:1}))].sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
  h=it.map(d=>{const dest=d.destinataires||[],lu=Object.values(d.statuts||{}).filter(s=>s.lu).length;
   return card((d._s?"Sondage : "+d.question:d.texte),`${esc(d.compteNom||"")}, ${dte(d.createdAt)}, ${lu}/${dest.length} lus`,dest.map(u=>{const s=(d.statuts||{})[u]||{};return `<div class="dl"><span>${esc(nom(u))}</span><span>${s.lu?"Lu":"Non lu"}${d._s&&repTxt(d,u)?", "+esc(repTxt(d,u)):""}</span></div>`}).join(""))}).join("")}
 if(sTab==="sond")h=sonds.map(s=>{const r=s.reponses||{},t=Object.keys(r).length;
  return card(s.question,`${esc(s.compteNom||"")}, ${s.type==="multiple"?"choix multiple":"choix simple"}, ${t}/${(s.destinataires||[]).length} réponses`,
   (s.options||[]).map((o,i)=>{const n=voixOpt(r,i);return `<div class="dl"><span>${esc(o)}</span><span>${t?Math.round(n/t*100):0}% (${n})</span></div>`}).join("")+`<div style="margin-top:8px"><b>Par personne</b></div>`+(s.destinataires||[]).map(u=>`<div class="dl"><span>${esc(nom(u))}</span><span>${esc(repTxt(s,u))||"Pas encore répondu"}</span></div>`).join(""))}).join("");
 if(sTab==="rep")h=dems.map(d=>{const r=d.reponses||{};
  return card(d.texteConsigne,`${esc(d.compteNom||"")}, ${d.maxCaracteres?d.maxCaracteres+" car. max":"sans limite"}, ${d.modifiable?"modifiable":"non modifiable"}, ${Object.keys(r).length}/${(d.destinataires||[]).length} réponses`,
   (d.destinataires||[]).map(u=>`<div class="dl"><span>${esc(nom(u))}</span><span>${r[u]?esc(r[u].texte)+" ("+dte(r[u].date)+")":"En attente"}</span></div>`).join(""))}).join("");
 $("sBody").innerHTML=h||'<div class="vide">Rien à afficher pour le moment.</div>';
}
window.app=$("app");window.dNew=$("dNew");window.dComp=$("dComp");window.dSuivi=$("dSuivi");window.dConf=$("dConf");
</script>
